intermediate_db: "/shared/import/intermediate.db"
mappings_db: "/shared/import/mappings.db"

# The files database `disco upload` produced. Defaults to `files.db` next to the
# intermediate_db above (the same place `disco upload` writes it), so a normal
# run needs no path here. It's attached only when the file exists; if it's
# missing, the import falls back to inline upload mode (see the `uploads:`
# section below). Set an explicit path to attach a files DB from elsewhere.
#files_db: "/shared/import/files.db"

# if false, allows reserved usernames only for admins
always_allow_reserved_usernames: true

# Inline upload mode. Used when no files DB exists: `files_db` is not set above
# and there is no `files.db` next to the intermediate_db. This is for small
# migrations that skip the separate `disco upload` run. The uploads step then
# creates the uploads itself, straight into the live target site. When some
# uploads are files on disk and `root_paths` is not set, the import stops with
# an error.
#uploads:
#  # Directories the source files live under.
#  root_paths:
#    - "/shared/import/uploads"
#  # Rewrites for a source file's path, tried when the path as recorded is not
#  # found under a root path. A list of [from, to] pairs; the first one that
#  # finds an existing file wins.
#  #path_replacements:
#  #  - ["/old/prefix/", "/new/prefix/"]
#  # Where files fetched from URLs are cached. Defaults to a `downloads`
#  # directory next to the intermediate_db above.
#  #download_cache_path: "/shared/import/downloads"
