inherit_from: ../.rubocop.yml

Style/HashSyntax:
  EnforcedShorthandSyntax: always

Style/ModuleFunction:
  EnforcedStyle: forbidden

Style/EndlessMethod:
  EnforcedStyle: disallow

Style/Send:
  Enabled: true

# Autocorrects `unless x.include?(…)` to ActiveSupport's `exclude?`, which exists
# only on the types ActiveSupport patches. These gems pass around plain classes
# carrying their own `include?` (CompactStringSet), so the rewrite turns working
# code into a NoMethodError that lint still reports as clean. Dropping just that
# pair is not possible — RuboCop merges a cop's hash parameters with the
# inherited ones instead of replacing them — and the cop is `Safe: false`
# anyway, so it is off here.
Style/InvertibleUnlessCondition:
  Enabled: false

# Constants (and classes) declared inside example groups are global — they leak
# across spec files and collide load-order-dependently. Use `let` for aliases
# and top-level (or stubbed) classes for test doubles.
RSpec/LeakyConstantDeclaration:
  Enabled: true
