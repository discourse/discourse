<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Discourse bundle analysis</title>
    <style>
      :root {
        --bg: #0f1115;
        --panel: #181b22;
        --panel2: #1f232c;
        --border: #2b303b;
        --text: #e6e8ec;
        --muted: #9aa3b2;
        --accent: #4c8dff;
        --warn: #e0a23c;
        --good: #43b581;
        --bar: #3a4254;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font:
          13px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      a {
        color: var(--accent);
        text-decoration: none;
      }
      header {
        padding: 18px 24px;
        border-bottom: 1px solid var(--border);
        display: flex;
        align-items: baseline;
        gap: 16px;
        flex-wrap: wrap;
      }
      header h1 {
        font-size: 18px;
        margin: 0;
        font-weight: 600;
      }
      .sub {
        color: var(--muted);
        font-size: 12px;
      }
      main {
        padding: 20px 24px 80px;
        max-width: 1200px;
        margin: 0 auto;
      }
      section {
        margin-bottom: 32px;
      }
      h2 {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        color: var(--muted);
        margin: 0 0 12px;
      }
      .cards {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
        margin-bottom: 16px;
      }
      .card {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 8px;
        padding: 12px 16px;
        min-width: 150px;
      }
      .card .k {
        color: var(--muted);
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .card .v {
        font-size: 20px;
        font-weight: 600;
        margin-top: 2px;
      }
      .card .v small {
        font-size: 12px;
        color: var(--muted);
        font-weight: 400;
      }
      .baseline {
        display: flex;
        gap: 14px;
        flex-wrap: wrap;
        align-items: center;
        margin-bottom: 8px;
      }
      .baseline label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
        cursor: pointer;
      }
      .baseline label.on {
        color: var(--text);
      }
      input[type="search"] {
        background: var(--panel2);
        border: 1px solid var(--border);
        border-radius: 6px;
        color: var(--text);
        padding: 7px 10px;
        width: 280px;
        font-size: 13px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
      }
      .row {
        border: 1px solid var(--border);
        border-radius: 8px;
        margin-bottom: 6px;
        background: var(--panel);
        overflow: hidden;
      }
      .row > .head {
        display: grid;
        grid-template-columns: 1fr 110px 100px 70px;
        gap: 8px;
        align-items: center;
        padding: 9px 12px;
        cursor: pointer;
      }
      .row > .head:hover {
        background: var(--panel2);
      }
      .row .name {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
      }
      .row .name .label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .label.root {
        color: var(--muted);
        font-style: italic;
      }
      .tw {
        color: var(--muted);
        width: 12px;
        display: inline-block;
        transition: transform 0.1s;
        flex: none;
      }
      .row.open > .head .tw {
        transform: rotate(90deg);
      }
      .num {
        text-align: right;
        font-variant-numeric: tabular-nums;
      }
      .num.muted {
        color: var(--muted);
      }
      .badge {
        font-size: 10px;
        padding: 1px 6px;
        border-radius: 4px;
        background: var(--bar);
        color: var(--text);
        flex: none;
      }
      .badge.dyn {
        background: #3a2f4d;
        color: #c9a8ff;
      }
      .badge.entry {
        background: #2f3d4d;
        color: #9ec9ff;
      }
      .badge.add {
        background: #4d3a2f;
        color: #ffc59e;
      }
      .badge.route {
        background: #2f4d3a;
        color: #9effc0;
      }
      .body {
        display: none;
        padding: 0 12px 12px 32px;
      }
      .row.open > .body {
        display: block;
      }
      .bar {
        height: 4px;
        background: var(--bar);
        border-radius: 2px;
        margin-top: 4px;
      }
      .bar > span {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 2px;
      }
      .mod {
        display: grid;
        grid-template-columns: 1fr 90px;
        gap: 8px;
        padding: 3px 0;
        border-bottom: 1px solid #232833;
        color: var(--muted);
      }
      .mod .mname {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        color: var(--text);
      }
      .sites {
        margin: 4px 0 10px;
      }
      .site {
        color: var(--muted);
        padding: 2px 0;
      }
      .site code {
        color: var(--good);
      }
      .sub-list {
        margin-top: 8px;
      }
      .hint {
        color: var(--muted);
        font-size: 12px;
        margin: -4px 0 12px;
      }
      .pill {
        font-size: 11px;
        color: var(--muted);
      }
      .toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
      }
      .seg {
        display: inline-flex;
        border: 1px solid var(--border);
        border-radius: 6px;
        overflow: hidden;
      }
      .seg button {
        background: var(--panel);
        color: var(--muted);
        border: 0;
        padding: 6px 12px;
        cursor: pointer;
        font-size: 12px;
      }
      .seg button.on {
        background: var(--accent);
        color: #fff;
      }
      .empty {
        color: var(--muted);
        padding: 12px;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Discourse bundle analysis</h1>
      <span class="sub" id="meta"></span>
    </header>
    <main>
      <section>
        <h2>Initial page load</h2>
        <div class="hint">
          Files and bytes downloaded before any dynamic import. Toggle which
          entrypoints count as the baseline.
        </div>
        <div class="baseline" id="baseline"></div>
        <div class="cards" id="initialCards"></div>
        <div class="toolbar">
          <div class="seg" id="sizeToggle">
            <button data-size="brotli" class="on">brotli</button>
            <button data-size="raw">raw</button>
          </div>
          <input
            type="search"
            id="search"
            placeholder="Filter files / modules…"
          />
        </div>
        <div id="initialList"></div>
      </section>

      <section>
        <h2>Dynamic entrypoints</h2>
        <div class="hint">
          Each is loaded on demand via <code>import()</code>. “Additional”
          counts only chunks not already in the initial load above.
        </div>
        <div id="dynamicList"></div>
      </section>
    </main>

    <script>
      const BUNDLE_DATA = /*__BUNDLE_DATA__*/ null;
    </script>
    <script>
      const D = BUNDLE_DATA;
      const chunks = D.chunks;
      let sizeKey = "brotli";
      let filter = "";

      // For each chunk, which entrypoints (static or dynamic) pull it in —
      // i.e. whose static-import closure contains it.
      const entryRoots = [...D.entrypoints, ...D.dynamicEntrypoints];
      const usedByEntries = {};
      for (const f in chunks) usedByEntries[f] = [];
      for (const e of entryRoots)
        for (const f of staticClosure(e))
          if (usedByEntries[f] && !usedByEntries[f].includes(e))
            usedByEntries[f].push(e);

      function stem(file) {
        return file.replace(/^assets\/js\//, "").replace(/\.digested\.js$/, "");
      }

      function routeName(c) {
        const m = (c.facadeModuleId || "").match(
          /-embroider-route-entrypoint\.js:route=(.+)$/
        );
        return m ? m[1] : null;
      }

      function sz(file) {
        const c = chunks[file];
        return c ? (sizeKey === "brotli" ? c.brotliSize : c.rawSize) : 0;
      }
      function fmt(n) {
        if (n >= 1048576) return (n / 1048576).toFixed(2) + " MB";
        if (n >= 1024) return (n / 1024).toFixed(1) + " KB";
        return n + " B";
      }
      function staticClosure(file, set) {
        set = set || new Set();
        if (set.has(file) || !chunks[file]) return set;
        set.add(file);
        for (const dep of chunks[file].imports) staticClosure(dep, set);
        return set;
      }
      function closureOf(files) {
        const set = new Set();
        for (const f of files) staticClosure(f, set);
        return set;
      }
      function totals(files) {
        let raw = 0,
          brotli = 0;
        for (const f of files) {
          raw += chunks[f].rawSize;
          brotli += chunks[f].brotliSize;
        }
        return { files: files.size || files.length, raw, brotli };
      }

      const baselineSel = new Set(
        D.entrypoints.filter((f) =>
          ["discourse", "vendor"].includes(chunks[f].name)
        )
      );
      if (baselineSel.size === 0)
        D.entrypoints.forEach((f) => baselineSel.add(f));

      function baselineClosure() {
        return closureOf([...baselineSel]);
      }

      // ---- rendering ----------------------------------------------------
      const el = (h) => {
        const t = document.createElement("template");
        t.innerHTML = h.trim();
        return t.content.firstElementChild;
      };
      function matches(text) {
        return !filter || text.toLowerCase().includes(filter);
      }

      function moduleRows(c) {
        const max = c.modules.length ? c.modules[0].renderedLength : 1;
        return c.modules
          .filter((m) => matches(m.id))
          .map(
            (m) => `
            <div class="mod" title="${m.id}">
              <div>
                <div class="mname">${m.id}</div>
                <div class="bar"><span style="width:${Math.max(2, (m.renderedLength / max) * 100)}%"></span></div>
              </div>
              <div class="num">${fmt(m.renderedLength)}</div>
            </div>`
          )
          .join("");
      }

      function chunkRow(file, opts = {}) {
        const c = chunks[file];
        const badges = [];
        if (!opts.root) {
          if (c.isEntry) badges.push('<span class="badge entry">entry</span>');
          const route = routeName(c);
          if (route) {
            badges.push(`<span class="badge route">route: ${route}</span>`);
          } else if (c.isDynamicEntry) {
            badges.push('<span class="badge dyn">dynamic</span>');
          }
          if (opts.added) badges.push('<span class="badge add">added</span>');
        }
        const label = opts.root
          ? '<span class="label root">dynamic entrypoint root</span>'
          : `<span class="label" title="${file}">${stem(file)} <span class="pill">· ${c.moduleCount} modules</span></span>`;
        const row = el(`
          <div class="row">
            <div class="head">
              <div class="name">
                <span class="tw">▶</span>
                ${badges.join("")}
                ${label}
              </div>
              <div class="num">${fmt(c.brotliSize)} <span class="pill">br</span></div>
              <div class="num muted">${fmt(c.rawSize)} <span class="pill">raw</span></div>
              <div class="num pill">${opts.root ? "" : usedByEntries[file].length + " ep"}</div>
            </div>
            <div class="body"></div>
          </div>`);
        const body = row.querySelector(".body");
        const head = row.querySelector(".head");
        head.addEventListener("click", () => {
          row.classList.toggle("open");
          if (!body.dataset.filled) {
            const entries = usedByEntries[file];
            body.innerHTML =
              `<div class="pill" style="margin:2px 0 6px">Used by entrypoints: ${
                entries.length ? entries.map(stem).join(", ") : "—"
              }</div>` + moduleRows(c);
            body.dataset.filled = "1";
          }
        });
        return row;
      }

      function dynamicCard(file) {
        const c = chunks[file];
        const loadSet = staticClosure(file);
        const base = baselineClosure();
        const added = [...loadSet].filter((f) => !base.has(f));
        const addTot = totals(added);
        const fullTot = totals(loadSet);

        const sites =
          c.importSites && c.importSites.length
            ? c.importSites
                .map(
                  (s) =>
                    `<div class="site">imported by <code>${s.importer}${
                      s.line ? ":" + s.line : ""
                    }</code>${s.specifier ? ` — <span class="pill">import("${s.specifier}")</span>` : ""}</div>`
                )
                .join("")
            : '<div class="site pill">no static import site found</div>';

        const card = el(`
          <div class="row">
            <div class="head" style="grid-template-columns:1fr 130px 130px 70px">
              <div class="name">
                <span class="tw">▶</span>
                ${
                  routeName(c)
                    ? `<span class="badge route">route: ${routeName(c)}</span>`
                    : '<span class="badge dyn">dynamic</span>'
                }
                <span class="label" title="${c.facadeModuleId || file}">${stem(file)}</span>
              </div>
              <div class="num"><b>+${fmt(sizeKey === "brotli" ? addTot.brotli : addTot.raw)}</b> <span class="pill">added</span></div>
              <div class="num muted">${fmt(sizeKey === "brotli" ? fullTot.brotli : fullTot.raw)} <span class="pill">total</span></div>
              <div class="num pill">+${added.length}/${loadSet.size}f</div>
            </div>
            <div class="body">
              <div class="sites">${sites}</div>
              <div class="pill" style="margin-bottom:6px">
                Adds <b>${added.length}</b> new files (${fmt(addTot.brotli)} br / ${fmt(addTot.raw)} raw);
                full subtree is ${loadSet.size} files.
              </div>
              <div class="sub-list"></div>
            </div>
          </div>`);
        const sub = card.querySelector(".sub-list");
        const head = card.querySelector(".head");
        head.addEventListener("click", () => {
          card.classList.toggle("open");
          if (!sub.dataset.filled) {
            const addedSorted = added
              .filter((f) => f !== file)
              .sort((a, b) => sz(b) - sz(a));
            const sharedSorted = [...loadSet]
              .filter((f) => base.has(f) && f !== file)
              .sort((a, b) => sz(b) - sz(a));
            sub.innerHTML = "";
            sub.appendChild(chunkRow(file, { root: true }));
            for (const f of addedSorted)
              sub.appendChild(chunkRow(f, { added: true }));
            if (sharedSorted.length) {
              sub.appendChild(
                el(
                  `<div class="pill" style="margin:10px 0 4px">Already in initial load (free): ${sharedSorted.length} files</div>`
                )
              );
              for (const f of sharedSorted) sub.appendChild(chunkRow(f));
            }
            sub.dataset.filled = "1";
          }
        });
        return card;
      }

      function renderInitial() {
        const base = [...baselineClosure()].sort((a, b) => sz(b) - sz(a));
        const t = totals(new Set(base));
        document.getElementById("initialCards").innerHTML = `
          <div class="card"><div class="k">Files</div><div class="v">${t.files}</div></div>
          <div class="card"><div class="k">Download (brotli)</div><div class="v">${fmt(t.brotli)}</div></div>
          <div class="card"><div class="k">Uncompressed</div><div class="v">${fmt(t.raw)}</div></div>
          <div class="card"><div class="k">Modules</div><div class="v">${base.reduce((n, f) => n + chunks[f].moduleCount, 0)}</div></div>`;
        const list = document.getElementById("initialList");
        list.innerHTML = "";
        const visible = base.filter(
          (f) =>
            matches(f) ||
            matches(chunks[f].name) ||
            chunks[f].modules.some((m) => matches(m.id))
        );
        if (!visible.length)
          list.innerHTML = '<div class="empty">No matches.</div>';
        for (const f of visible) list.appendChild(chunkRow(f));
      }

      function renderDynamic() {
        const list = document.getElementById("dynamicList");
        list.innerHTML = "";
        const dyn = D.dynamicEntrypoints
          .filter((f) => matches(f) || matches(chunks[f].name))
          .sort((a, b) => {
            const base = baselineClosure();
            const aa = [...staticClosure(a)]
              .filter((x) => !base.has(x))
              .reduce((n, x) => n + sz(x), 0);
            const bb = [...staticClosure(b)]
              .filter((x) => !base.has(x))
              .reduce((n, x) => n + sz(x), 0);
            return bb - aa;
          });
        if (!dyn.length)
          list.innerHTML = '<div class="empty">No dynamic entrypoints.</div>';
        for (const f of dyn) list.appendChild(dynamicCard(f));
      }

      function renderBaseline() {
        const wrap = document.getElementById("baseline");
        wrap.innerHTML = "";
        for (const f of D.entrypoints) {
          const c = chunks[f];
          const on = baselineSel.has(f);
          const label = el(`
            <label class="${on ? "on" : ""}">
              <input type="checkbox" ${on ? "checked" : ""} />
              ${c.name} <span class="pill">${fmt(c.brotliSize)}</span>
            </label>`);
          label.querySelector("input").addEventListener("change", (e) => {
            if (e.target.checked) baselineSel.add(f);
            else baselineSel.delete(f);
            renderAll();
          });
          wrap.appendChild(label);
        }
      }

      function renderAll() {
        renderBaseline();
        renderInitial();
        renderDynamic();
      }

      document.getElementById("meta").textContent = `${D.emberEnv} · ${
        Object.keys(chunks).length
      } chunks · generated ${D.generatedAt}`;
      document.getElementById("sizeToggle").addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        sizeKey = b.dataset.size;
        document
          .querySelectorAll("#sizeToggle button")
          .forEach((x) => x.classList.toggle("on", x === b));
        renderAll();
      });
      document.getElementById("search").addEventListener("input", (e) => {
        filter = e.target.value.trim().toLowerCase();
        renderInitial();
        renderDynamic();
      });
      renderAll();
    </script>
  </body>
</html>
