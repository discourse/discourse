- "plugins/live"
- "themes/horizon"
patchedDependencies:
  "babel-plugin-debug-macros@0.3.4": "patches/babel-plugin-debug-macros@0.3.4.patch"
  "licensee": "patches/licensee.patch"
  # https://github.com/warp-drive-data/warp-drive/pull/11037
  "@warp-drive/legacy@5.9.0-alpha.15": "patches/@warp-drive__legacy@5.9.0-alpha.15.patch"
  # https://github.com/warp-drive-data/warp-drive/pull/11499
  "@warp-drive/json-api@5.9.0-alpha.15": "patches/@warp-drive__json-api@5.9.0-alpha.15.patch"
  "ember-source@7.3.0": "patches/ember-source@7.3.0.patch"
  "http-proxy@1.18.1": "patches/http-proxy@1.18.1.patch"
  "pikaday": "patches/pikaday.patch"
  "xss@1.0.15": "patches/xss@1.0.15.patch"
peerDependencyRules:
  allowedVersions:
    "@mixer/parallel-prettier>prettier": "*"
    "@fullcalendar/moment-timezone>moment-timezone": "*"
  ignoreMissing:
    - "webpack"
    - "@types/react"
overrides:
  "tmp": "^0.2.7"
  "@glint/tsserver-plugin>typescript": "^6.0.3"
  "babel-plugin-ember-template-compilation@~2.3.0": "2.4.1"
  "broccoli-babel-transpiler@8.0.0": "^8.0.2"
allowedDeprecatedVersions:
  "@babel/plugin-proposal-class-properties": "*"
  "@babel/plugin-proposal-private-methods": "*"
  "@babel/plugin-proposal-private-property-in-object": "*"
  "@babel/polyfill": "*"
  "@types/glob": "*"
  "are-we-there-yet": "*"
  "consolidate": "*"
  "core-js": "*"
  "gauge": "*"
  "glob": "*"
  "inflight": "*"
  "lodash.omit": "*"
  "node-domexception": "*"
  "npmlog": "*"
  "raw-body": "*"
  "resolve-url": "*"
  "rimraf": "*"
  "sane": "*"
  "source-map-resolve": "*"
  "source-map-url": "*"
  "sourcemap-codec": "*"
  "urix": "*"
  "whatwg-encoding": "*"
