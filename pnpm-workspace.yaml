engineStrict: true
publicHoistPattern:
- playwright
- playwright-core
autoInstallPeers: false
ignoreWorkspaceCycles: true
updateNotifier: false
strictPeerDependencies: true
strictDepBuilds: true
allowBuilds:
  lefthook: true
  "@zoom/meetingsdk": false
  core-js: false
  rete: false
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
- "@discourse/*"
- discourse
- ember-eslint-parser@0.16.0
- ember-estree@0.9.0
- eslint-plugin-ember@13.8.0
packages:
- "docs/developer-guides"
- "frontend/deprecation-silencer"
- "frontend/discourse"
- "frontend/discourse-i18n"
- "frontend/discourse-markdown-it"
- "frontend/pretty-text"
- "frontend/pretty-text-processor"
- "frontend/asset-processor"
- "frontend/discourse-types"
- "frontend/playwright-runner"
- "plugins/automation"
- "plugins/boards"
- "plugins/chat"
- "plugins/checklist"
- "plugins/discourse-adplugin"
- "plugins/discourse-affiliate"
- "plugins/discourse-ai"
- "plugins/discourse-apple-auth"
- "plugins/discourse-assign"
- "plugins/discourse-cakeday"
- "plugins/discourse-events"
- "plugins/discourse-chat-integration"
- "plugins/discourse-data-explorer"
- "plugins/discourse-details"
- "plugins/discourse-gamification"
- "plugins/discourse-github"
- "plugins/discourse-graphviz"
- "plugins/discourse-captcha"
- "plugins/discourse-lazy-videos"
