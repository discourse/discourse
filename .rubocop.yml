inherit_gem:
  rubocop-discourse: stree-compat.yml

inherit_mode:
  merge:
    - Exclude

Layout/EmptyLineBetweenDefs:
  Enabled: true

# Still work to do in ensuring we don't link old files
Discourse/NoAddReferenceOrAliasesActiveRecordMigration:
  Enabled: false

Discourse/NoResetColumnInformationInMigrations:
  Enabled: true

Discourse/Plugins/CallRequiresPlugin:
  Include:
    - "plugins/*/app/controllers/**/*"

Discourse/Plugins/UsePluginInstanceOn:
  Include:
    - "plugins/**/*"

Discourse/Plugins/NamespaceMethods:
  Include:
    - "plugins/**/*"

Discourse/Plugins/NamespaceConstants:
  Include:
    - "plugins/**/*"

Discourse/Plugins/UseRequireRelative:
  Include:
    - "plugins/**/*"

Discourse/Plugins/NoMonkeyPatching:
  Include:
    - "plugins/**/*"

Lint/Debugger:
  Exclude:
    - script/**/*
  DebuggerMethods:
    SystemHelpers:
      - pause_test

RSpec/HooksBeforeExamples:
  Enabled: true

RSpec/InstanceVariable:
  Enabled: true
  AssignmentOnly: true

RSpec/LetBeforeExamples:
  Enabled: true

RSpec/MultipleDescribes:
  Enabled: true

RSpec/NestedGroups:
  Enabled: true
  Max: 4

RSpec/RepeatedExample:
  Enabled: true

RSpec/RepeatedExampleGroupBody:
  Enabled: true

RSpec/ScatteredSetup:
  Enabled: true

Style/AccessModifierDeclarations:
  Enabled: true
  AllowModifiersOnSymbols: false

Style/RedundantFreeze:
  Enabled: true

Style/RedundantConditional:
  Enabled: true

Lint/DuplicateMagicComment:
  Enabled: true

Lint/IdentityComparison:
  Enabled: true

Lint/SymbolConversion:
  Enabled: true

Style/RedundantParentheses:
  Enabled: true

Style/RedundantBegin:
  Enabled: true

Rails/FilePath:
  Enabled: true

Style/RedundantSelf:
  Enabled: true
