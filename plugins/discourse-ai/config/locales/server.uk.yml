    ai_bot_allowed_groups: "Учасники цих груп можуть спілкуватися з ботами на базі штучного інтелекту. Агенти, які дозволяють особисті повідомлення, використовують власні дозволені групи. Анонімні користувачі не можуть використовувати бота; після додавання до цього налаштування вони можуть лише переглядати сторінку розмов бота на базі штучного інтелекту та отримують запит на вхід, щоб поставити запитання."
    ai_bot_debugging_allowed_groups: "Дозвольте цим групам бачити кнопку налагодження в публікаціях, яка відображає необроблений запит і відповідь ШІ"
    ai_bot_public_sharing_allowed_groups: "Дозвольте цим групам ділитися особистими повідомленнями ШІ з громадськістю за унікальним загальнодоступним посиланням. Примітка: якщо ваш сайт вимагає входу, то для доступу до публікацій також потрібно буде ввійти."
    ai_bot_add_to_header: "Відобразити кнопку в заголовку, щоб розпочати особисте повідомлення з ботом зі штучним інтелектом"
    ai_bot_add_to_community_section: "Відображати посилання в розділі спільноти бічної панелі, щоб розпочати особисте повідомлення з ботом зі штучним інтелектом"
    ai_bot_github_access_token: "Токен доступу до GitHub для використання з інструментами штучного інтелекту GitHub (необхідний для підтримки пошуку)"
    ai_bot_enable_docked_composer: "Увімкнути закріплений редактор текстів у стилі чату для розмов зі штучним інтелектом-ботами замість стандартного плаваючого редактора текстів."
    ai_discover_enabled: "Увімкнути функцію пошуку виявлення"
