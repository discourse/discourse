    ai_reviewable_action_decision_model: "Надсилайте нові елементи, що очікують на перевірку, зокрема позначений приватний контент, до цієї моделі прийняття рішень для отримання пропозицій щодо дій. Залиште поле порожнім, щоб вимкнути."
