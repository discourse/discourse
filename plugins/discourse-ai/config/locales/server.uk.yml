    ai_translation_locale_detector_decision_model: "Модель прийняття рішень, яка визначає мову контенту перед його перекладом. Контент мовою, яку неможливо точно визначити, залишається на розгляд агента детектора локалізації. Залиште поле порожнім, щоб агент визначав усі мови."
    ai_translation_category_scope: "Виберіть, які категорії може використовувати система перекладу на основі штучного інтелекту. Для включення та виключення опцій скористайтеся посиланням {{setting:ai_translation_categories}}. Особисті повідомлення налаштовуються за посиланням {{setting:ai_translation_personal_messages}}."
    ai_translation_categories: "Категорії, що використовуються, коли для категорії штучного перекладу встановлено параметр <strong>«включити»</strong> або <strong>«виключити»</strong>."
    ai_translation_personal_messages: "Контролює, які особисті повідомлення перекладаються. «none» вимикає переклад особистих повідомлень. «group» перекладає лише групові особисті повідомлення. «all» перекладає всі особисті повідомлення."
    ai_translation_include_bot_content: "Якщо увімкнено, контент, написаний ботами (ідентифікатор користувача менше 0), також буде надіслано на переклад."
