    ai_ask_ai_related_count: "Встановіть максимальну кількість пов’язаних обговорень. Запитайте, як ШІ вибирає та показує кожну відповідь."
    enable_ai_combined_search: "Натискання Enter у заголовку пошуку відповідей за допомогою штучного інтелекту відображає результати ключових слів разом у вигляді вкладок, відкриваючи ту, яка найімовірніше потрібна для пошуку. Додаткові запитання продовжуються на повну сторінку."
    ai_ask_ai_search_intent_decision_model: "Експериментальна: модель прийняття рішень, яка визначає, чи потрібен пошуковий запит: відповідь штучного інтелекту чи результати за ключовими словами, щоб вибрати, на якій вкладці відкриватиметься об’єднаний пошуковий запит. Пошукові запити надсилаються постачальнику цієї моделі. Залиште поле порожнім, щоб судити за тим, як написаний запит."
    ai_ask_ai_agent: "Агент, який вибирає джерела та пише відповіді на запитання ШІ."
    ai_ask_ai_query_rewriter_agent: "Агент, який використовується для підготовки окремих ключових слів та семантичних запитів для Ask AI. Якщо цей агент або його модель недоступні, Ask AI шукає за оригінальним запитом користувача."
    ai_ask_ai_follow_up_agent: "Агент використовується, коли користувач хоче виконати подальші дії за результатом запиту Ask AI. Вибраний агент має бути ввімкнений, дозволяти особисті повідомлення та бути доступним для користувача."
    ai_ask_ai_keyword_search_enabled: "Шукайте відповіді на форумі за ключовим словом «Запитайте ШІ»."
    ai_ask_ai_semantic_search_enabled: "Семантично пошукайте відповіді на форумі за запитом «Запитай ШІ». Потрібні вбудовування."
    ai_ask_ai_search_categories: "Шукайте відповіді на запитання «Запитай ШІ» лише в цих категоріях та їхніх підкатегоріях. Особисті повідомлення все одно шукаються, коли їх запитують. Залиште поле порожнім, щоб шукати у всіх категоріях."
    ai_ask_ai_endorsed_reply_groups: "Також дайте опції «Запитайте ШІ» одну відповідь з кожної теми без прийнятної відповіді. Відповіді, які сподобалися автору теми, будуть першими, потім власні відповіді автора, які сподобалися іншим, а потім відповіді, які сподобалися учасникам цих груп. Співробітники спільнот, де вони вільно ставлять лайки публікаціям, можуть захотіти вужчу групу. Залиште це поле порожнім, щоб вимкнути цю функцію."
    ai_ask_ai_search_max_age_days: "Шукати відповіді на запитання ШІ лише в публікаціях, створених протягом певної кількості днів. Встановіть значення 0, щоб шукати публікації будь-якого віку."
    ai_ask_ai_external_sources: "Користувацькі інструменти Ask AI здійснюють пошук разом із форумом. Кожен з них викликається із запитом користувача та має повертати список результатів, кожен із заголовком, URL-адресою http(s) та, за бажанням, анотацією, вмістом та published_at. Запити надсилаються до будь-яких сервісів, які викликають інструменти."
    ai_ask_ai_external_sources_timeout: "Секунди, протягом яких Ask AI очікує на всі зовнішні джерела, які переглянуто одночасно, перш ніж відповісти, навіть якщо ті, що ще працюють, не використовуються. Враховується до 20 секунд, які може зайняти запит Ask AI, тому довше очікування залишає менше часу для написання відповіді."
    ai_ask_ai_allowed_groups: "Групи, яким дозволено використовувати Ask AI та його подальшу передачу. Дозволи агента Ask AI, дозволи агента подальшої роботи, а також звичайна видимість тем, категорій та особистих повідомлень все ще застосовуються. Семантичний пошук особистих повідомлень вимагає {{setting:ai_embeddings_generate_for_pms}}. Контент, видимий дозволеному користувачеві, включаючи обмежені теми та особисті повідомлення, може бути надісланий налаштованому постачальнику LLM."
    ai_google_custom_search_api_key: "Ключ API для Google Custom Search API див. за посиланням: https://developers.google.com/custom-search"
