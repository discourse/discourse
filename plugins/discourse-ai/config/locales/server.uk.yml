        pre_registered_only: "Програми можуть входити лише після того, як адміністратор зареєструє їх у клієнтах MCP: %{clients_url}"
      apps:
        claude:
          name: "Клод (веб-версія або настільна комп'ютерна версія)"
          steps: |-
            1. У Claude перейдіть до Налаштувань, потім до З’єднувачів, а потім до Додати користувацький з’єднувач.
            2. Назвіть його «%{name}» та вставте %{url}
            3. Натисніть Додати, а потім Підключитися. Відкриється ваш сайт; увійдіть, якщо буде запропоновано, і натисніть Схвалити.
            У плані Claude Team або Enterprise власник спочатку має додати з’єднувач для вашої організації.
        chatgpt:
          name: "ChatGPT"
          steps: |-
            1. У ChatGPT перейдіть до Налаштувань, потім до Безпеки та входу, і ввімкніть режим розробника.
            2. Додайте конектор під назвою "%{name}" з URL-адресою %{url}
            3. Підключіть його. Відкриється ваш сайт; увійдіть, якщо буде запропоновано, і натисніть "Схвалити".
            Адміністратор робочої області може вимкнути режим розробника для всіх.
        claude_code:
          name: "Claude Code"
          steps: |-
            1. Виконайте: claude mcp add --transport http my-community %{url}
            2. Виконайте: claude mcp login my-community
            3. Ваш сайт відкриється; увійдіть, якщо буде запропоновано, та натисніть «Схвалити».
        codex:
          name: "Кодекс"
          steps: |-
            1. Виконайте: codex mcp add my-community --url %{url} --oauth-client-registration cimd
            2. Ваш сайт відкриється; увійдіть, якщо буде запропоновано, та натисніть «Схвалити».
            Перевірте з’єднання за допомогою: codex mcp list
        cursor:
          name: "Курсор"
          steps: |-
            1. Додайте це до ~/.cursor/mcp.json: {"mcpServers": {"my-community": {"url": "%{url}"}}}
            2. Увімкніть сервер у налаштуваннях MCP Cursor.
            3. Відкриється ваш сайт; увійдіть, якщо буде запропоновано, та натисніть «Схвалити».
        vscode:
          name: "Visual Studio Code"
          steps: |-
            1. Відкрийте палітру команд і виконайте команду «MCP: Додати сервер».
            2. Виберіть HTTP та вставте %{url}
            3. Ваш сайт відкриється; увійдіть, якщо буде запропоновано, і натисніть «Схвалити».
