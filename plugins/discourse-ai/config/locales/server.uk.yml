    ai_translation_backfill_hourly_rate: "Кількість дописів і тем для перекладу на годину під час операцій заповнення. Встановіть значення 0, щоб вимкнути автоматичне заповнення перекладів для наявного вмісту."
    ai_translation_backfill_parallel_jobs: "Кількість паралельних завдань локалізації після виконання за цикл заповнення. Вищі значення збільшують пропускну здатність, але споживають більше ресурсів."
    ai_usage_rollup_after_days: "Кількість днів для зберігання статистики використання ШІ для кожного запиту перед її перетворенням на щоденні зведені дані. Встановіть значення 0, щоб вимкнути зведення."
    ai_audit_logs_detailed_retention_days: "Зберігати необроблені корисні навантаження запитів і відповідей ШІ протягом певної кількості днів. Встановіть значення 0, щоб зберігати корисні навантаження, доки журнал підсумків не буде видалено. Необроблені корисні навантаження можуть містити приватний або конфіденційний контент. Очищення триває, навіть якщо плагін ШІ вимкнено."
    ai_audit_logs_purge_after_days: "Зберігати зведені дані журналу аудиту AI API протягом заданої кількості днів, перш ніж видаляти весь журнал. Встановіть значення 0, щоб зберігати зведені дані назавжди. Очищення продовжується, навіть якщо плагін AI вимкнено."
