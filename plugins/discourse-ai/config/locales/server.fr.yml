        one: "<a href='%{base_path}/admin/plugins/discourse-ai/ai-llms/%{target}/edit'>%{model_name}</a> nécessite votre attention. Au cours de la dernière heure, il n'a pas répondu %{failed_calls} fois sur %{total_calls}."
