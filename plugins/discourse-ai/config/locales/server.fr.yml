        title: Action d'un outil d'IA
        description: Exécuter un outil d'IA lorsque l'automatisation se déclenche
      llm_agent_triage:
        title: Trier les publications à l'aide d'un agent d'IA
        description: "Répondre aux publications à l'aide d'un agent d'IA spécifique"
      llm_triage:
        title: Trier les publications à l'aide de l'IA
        description: "Triez les publications à l'aide d'un grand modèle linguistique"
        flagged_post: |
          %{score_reason}
          %{response}
        flagged_post_score_reason: |
          <b>Déclenché par la règle <a href="%{base_path}/admin/plugins/automation/%{automation_id}">%{automation_name}</a>.</b>
        notify_author_pm:
          subject: "Votre publication a été temporairement retirée pour vérification"
          body: |
            Bonjour @%{username},

            Votre publication dans « %{topic_title} » a été temporairement retirée et placée dans notre file d'attente de vérification afin d'être examinée par l'équipe de modération. Si elle est approuvée, elle sera automatiquement restaurée.

            Référence : %{post_url}
