        title: Rapport périodique utilisant l'IA
        description: "Rapport périodique basé sur un grand modèle linguistique"
      llm_tagger:
        title: Étiqueter les sujets à l'aide de l'IA
        description: "Étiqueter automatiquement les sujets à l'aide de l'IA"
