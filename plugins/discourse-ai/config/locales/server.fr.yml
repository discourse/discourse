      flag_types:
        review: "Ajouter une publication à la file d'attente de révision"
        review_hide: "Ajouter une publication à la file d'attente de révision et masquer la publication"
        review_delete: "Ajouter la publication à la file d'attente de vérification et la supprimer"
        review_delete_silence: "Ajouter la publication à la file d'attente de vérification, la supprimer et empêcher l'utilisateur de publier"
        spam: "Signaler comme contenu indésirable et masquer la publication"
        spam_silence: "Signaler comme contenu indésirable, masquer la publication et désactiver l'utilisateur"
