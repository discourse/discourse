      ai_image_caption_agent_reasons:
        agent_missing: "l'agent sélectionné n'existe pas"
        agent_vision_disabled: "l'agent ne peut pas inclure d'images téléversées"
        llm_missing: "l'agent ne correspond à aucun LLM"
        llm_vision_disabled: "le LLM obtenu ne prend pas en charge les images en entrée"
