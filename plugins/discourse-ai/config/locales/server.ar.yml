    ai_translation_backfill_start_date: "التاريخ بالتوقيت العالمي الموحَّد الذي سيبدأ منه إرسال المنشورات والموضوعات القديمة لترجمتها بالملء الرجعي. اترك الحقل فارغًا لتعطيل الملء الرجعي. ستستمر ترجمة المحتوى الجديد."
    ai_translation_backfill_hourly_rate: "عدد المنشورات والموضوعات التي تتم ترجمتها كل ساعة أثناء الملء الرجعي. اضبط القيمة على 0 لتعطيل الترجمة التلقائية للمحتوى الحالي."
    ai_translation_backfill_parallel_jobs: "عدد مهام توطين المنشورات التي يتم تنفيذها بالتوازي في كل دورة ملء رجعي. تزيد القيم الأعلى من معدَّل المعالجة لكنها تستهلك موارد أكثر."
    ai_usage_rollup_after_days: "المدة الزمنية بالأيام للاحتفاظ ببيانات استهلاك الذكاء الاصطناعي التفصيلية لكل طلب قبل تحويلها إلى ملخصات يومية مجمعة؛ علمًا بأن تعيين القيمة عند 0 سيؤدي إلى إيقاف ميزة التجميع."
