        help: |
          *新增規則：* `/discourse [thread|watch|follow|mute] [category] [tag:name]`
          （你必須指定規則類型，以及至少一個分類或標籤）
          - *thread* – 有新主題時通知此頻道，並盡可能以討論串回覆
          - *watch* – 有新主題與新回覆時通知此頻道
          - *follow* – 有新主題時通知此頻道
          - *mute* – 封鎖傳送至此頻道的通知

          *移除規則：* `/discourse remove [rule number]`
          （執行 `/discourse status` 可找到 `[rule number]`）

          *列出規則：* `/discourse status`

          *[實驗性] 發佈文字記錄：* `/discourse post [n]`
          在 Discourse 建立草稿主題，其中包含此頻道最近 `n` 則貼文

          *說明：* `/discourse help`
