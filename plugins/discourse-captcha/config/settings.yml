discourse_captcha:
  discourse_captcha_enabled:
    default: false
    client: true
  discourse_captcha_provider:
    default: "none"
    client: true
    type: enum
    choices:
      - hcaptcha
      - recaptcha
      - recaptcha_v3
      - none
  hcaptcha_site_key:
    default: ''
    client: true
  hcaptcha_secret_key:
    default: ''
    client: false
    secret: true
  recaptcha_site_key:
    default: ''
    client: true
  recaptcha_secret_key:
    default: ''
    client: false
    secret: true
  recaptcha_v3_site_key:
    default: ''
    client: true
  recaptcha_v3_secret_key:
    default: ''
    client: false
    secret: true
  recaptcha_v3_score_threshold:
    default: 0.5
    type: float
    min: 0.0
    max: 1.0
    client: false
