    recaptcha_v2_secret_key: "„ReCaptcha v2“ slaptasis raktas iš jūsų <a target='blank' href='https://www.google.com/recaptcha'>„ReCaptcha“</a> paskyros. Naudojamas tik tada, kai „captcha“ tiekėjas nustatytas kaip „reCaptcha v2“."
    recaptcha_v3_site_key: "„ReCaptcha v3“ svetainės raktas iš jūsų <a target='blank' href='https://www.google.com/recaptcha'>„ReCaptcha“</a> paskyros"
