        configuration_changed: "CAPTCHA nustatymai pasikeitė. Atnaujinkite šį puslapį ir bandykite dar kartą."
        invalid_secret: "CAPTCHA paslaugos teikėjas atmetė slaptąjį raktą. Patikrinkite nustatymuose išsaugotą slaptąjį raktą."
        key_mismatch: "Svetainės raktas ir slaptasis raktas nesutampa. Patikrinkite, ar abu raktai priklauso tai pačiai konfigūracijai pas jūsų paslaugų teikėją."
        invalid_response: "CAPTCHA atsakymas buvo neteisingas. Pradėkite naują testą ir bandykite dar kartą."
        expired: "Užklausos galiojimo laikas baigėsi arba jis jau patvirtintas. Pradėkite naują testą ir atlikite jį dar kartą."
        unavailable: "Nepavyko susisiekti su CAPTCHA paslaugos teikėju arba gautas netikėtas atsakymas. Bandykite vėliau."
        verification_failed: "CAPTCHA teikėjas atmetė užklausą. Patikrinkite išsaugotus raktus ir teikėjo konfigūraciją, tada bandykite dar kartą."
