    recaptcha_v3_score_threshold: "Mažiausias balas, kurį turi pasiekti „reCaptcha v3“ užklausa, kad registracija būtų patvirtinta. Mažesnės reikšmės reiškia lankstesnes sąlygas, o didesnės – stipresnę botų apsaugą."
