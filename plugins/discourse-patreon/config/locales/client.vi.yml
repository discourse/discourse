        body: "<h1>Xin chào bạn đọc!</h1>\n\n<p>Bạn có yêu thích trang web của chúng tôi? Bạn có muốn đóng góp cho một mục tiêu ý nghĩa?</p>\n\n<p>Nếu cảm thấy trang web hữu ích và yêu thích cộng đồng này, chúng tôi rất mong nhận được sự ủng hộ từ bạn. \nNhững khoản đóng góp giúp hệ thống vận hành ổn định và đảm bảo cộng đồng tiếp tục phát triển bền vững trong nhiều năm tới. \nMọi sự đóng góp đều vô cùng quý giá và sẽ được sử dụng đúng mục đích.</p>\n\n<p>Cảm ơn bạn đã đồng hành và ủng hộ!</p>\n\n<p>  \n<a class=\"btn btn-large btn-danger\" href=\"%{campaignUrl}\">Trở thành nhà tài trợ (Patron)</a>\n</p>\n"
