  default_category_template:
    name: 範本
    description: |
      此分類用於儲存範本。

      範本讓使用者可儲存經常重複使用的內容。

      此分類中的每個主題代表不同的範本。每個主題的**第一篇貼文**會作為範本的模型。

      請注意，所有可存取此分類的使用者都可使用範本。
