zh_TW:
  site_settings:
    discourse_templates_enabled: "允許可查看下方指定分類的使用者使用可用範本"
    discourse_templates_categories: "要從中取得範本的分類"
    discourse_templates_enable_private_templates: "啟用私人範本的使用"
    discourse_templates_groups_allowed_private_templates: "允許使用私人範本的群組。工作人員一律允許。"
