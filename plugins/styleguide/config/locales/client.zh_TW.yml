        shortcut:
          title: "快捷鍵"
          description: "這是一種顯示並朗讀鍵盤快捷鍵的方式。formatShortcut 會將按鍵綁定的拼法轉為繪製標籤與 aria-keyshortcuts 值；DShortcut 則將它繪製成標記，並在提供區塊時同時產生兩種格式，避免元素顯示一組快捷鍵卻朗讀另一組。"
          keycaps_example: "顯示快捷鍵"
          keycaps_description: "`<DShortcut @keys>` 會為每組快捷鍵顯示一個標記。請依按鍵綁定的方式拼寫按鍵：以 `+` 連接、不分大小寫，並以 `mod` 表示平台的主要修飾鍵。無論拼法如何，修飾鍵都會依平台本身的順序排列；圖示修飾鍵會連在一起，其他按鍵之間則保留間距。"
          keycaps_note: "在 Apple 平台上，修飾鍵會顯示為圖示（`⌘⇧ D`）；其他平台則顯示為文字（`Ctrl Shift D`）。每個圖示都包含視覺隱藏的口述名稱，因此當標記本身作為內容時，會被朗讀為「Command Shift D」。"
          block_example: "在會回應快捷鍵的元素上朗讀"
          block_description: "`aria-keyshortcuts` 應設在按鍵會啟用的元素上，而只有呼叫端知道是哪個元素。提供區塊時，`DShortcut` 不會自行呈現元素，而會產生 `aria`、`label`、`keys` 及已繫結的 `Kbd`，讓按鈕的朗讀內容與旁邊的標記源自同一種拼法。由於按鈕本身會朗讀快捷鍵，產生的標記會對輔助技術隱藏。"
          block_try_this: "在螢幕閱讀器執行時將焦點移至按鈕：它只會朗讀一次名稱，接著朗讀屬性中的快捷鍵，而不會朗讀標記。"
          block_note: "朗讀格式會本地化並以口語呈現，而不是 ARIA 權杖清單：閱讀器會逐字朗讀此屬性，因此在 Mac 上會說 `Command+B`，其他平台則說 `Ctrl+B`，也會唸出原本可能被忽略的標點名稱（`Period`、`Slash`）。"
          string_form_example: "只能使用字串的場合"
          string_form_description: "`title`、`aria-label` 或選取選項無法容納元素。請直接呼叫 `formatShortcut`，文字使用 `.label`，屬性使用 `.aria`；一次呼叫、同一種拼法，同時取得兩種格式。"
          string_form_try_this: "將游標停在按鈕上可查看工具提示；使用螢幕閱讀器將焦點移至按鈕則可聽取朗讀內容。"
          spellings_example: "各種拼法及其兩種格式"
          spellings_description: "每種輸入所解析出的結果。`mod`、`meta`、`command` 與 `cmd` 都代表主要修飾鍵；`ctrl` 在所有平台上仍是 Control 鍵；`plus` 代表 `+` 鍵；方向鍵文字及其 HTML 實體都會顯示為箭頭。"
          spellings_note: "只有朗讀欄會隨介面語言變更；顯示欄則會隨平台變更。"
          keyboard_gate_example: "僅在有鍵盤時"
          keyboard_gate_description: "在手機上顯示快捷鍵只是干擾。`capabilities.hasKeyboard` 會依精細的主要指標裝置，或螢幕鍵盤不會傳送的 keydown 事件推斷是否有實體鍵盤；若沒有鍵盤，`DShortcut` 不會顯示或朗讀任何內容。`@always` 可略過此限制，供專門記錄按鍵的介面使用。"
          keyboard_gate_try_this: "在手機上開啟此頁面：預設標記會消失，但 `@always` 標記仍會保留。配對鍵盤並按下修飾鍵後，預設標記會直接出現，不必重新載入。"
