        shortcut:
          title: "Shortcut"
          description: "One way to show a keyboard shortcut and announce it. formatShortcut turns the spelling key bindings use into a drawn label and an aria-keyshortcuts value; DShortcut draws it as a chip and, given a block, yields both forms so an element cannot draw one shortcut and announce another."
          keycaps_example: "Drawing a shortcut"
          keycaps_description: "`<DShortcut @keys>` draws one chip per shortcut. Spell the keys the way a binding does: `+`-joined, any case, with `mod` for the platform's primary modifier. Modifiers are listed in the platform's own order whatever the spelling, glyph modifiers run together, and every other key keeps a gap."
          keycaps_note: "On Apple platforms modifiers draw as glyphs (`⌘⇧ D`); elsewhere they draw as words (`Ctrl Shift D`). Each glyph carries a visually hidden spoken name, so the chip reads as \"Command Shift D\" when it is content in its own right."
          block_example: "Announcing on the element that reacts"
          block_description: "`aria-keyshortcuts` belongs on the element the keys activate, which only the caller knows. Given a block, `DShortcut` renders no element of its own and yields `aria`, `label`, `keys` and a bound `Kbd`, so the button's announcement and the chip beside it come from one spelling. The yielded chip is hidden from assistive technology, since the button announces the shortcut itself."
          block_try_this: "Focus the button with a screen reader running: it reads its name once, then the shortcut from the attribute, never the chip."
          block_note: "The announced form is localized and spoken, not the ARIA token list: readers speak the attribute verbatim, so it says `Command+B` on a Mac and `Ctrl+B` elsewhere, and names punctuation (`Period`, `Slash`) that readers would otherwise drop."
          string_form_example: "Where only a string fits"
          string_form_description: "A `title`, an `aria-label` or a select option cannot hold an element. Call `formatShortcut` directly and use `.label` for the text and `.aria` for the attribute; one call, one spelling, both forms."
          string_form_try_this: "Hover the button for the tooltip; focus it with a screen reader for the announcement."
          spellings_example: "Spellings and their two forms"
          spellings_description: "What each input resolves to. `mod`, `meta`, `command` and `cmd` all mean the primary modifier; `ctrl` stays the Control key on every platform; `plus` names the `+` key; arrow words and their HTML entities both draw as arrows."
          spellings_note: "Only the announced column changes with the interface language; the drawn column changes with the platform."
          keyboard_gate_example: "Only where there is a keyboard"
          keyboard_gate_description: "A shortcut is noise on a phone. `capabilities.hasKeyboard` infers a physical keyboard from a fine primary pointer, or from a keydown an on-screen keyboard never sends, and `DShortcut` draws and announces nothing without it. `@always` opts out, for surfaces that exist to document the keys."
          keyboard_gate_try_this: "Open this page on a phone: the default chip disappears while the `@always` one stays. Pair a keyboard and press a modifier key, and the default chip appears without a reload."
          keyboard_gate_note: "Every shortcut on the site is gated except the keyboard shortcuts help modal and this page."
