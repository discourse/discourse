          icon_only_example: "Icon-only trigger (icon reflects the selection)"
          icon_only_label: "Notification level"
          selection_example: "Custom selection markup (editable label on open)"
          empty_example: "Async empty results"
          error_example: "First-request error and retry"
          clearable_example: "Clearable single-select"
          clearable_multi_example: "Clearable multi-select"
          icon_example: "Leading icon"
          caret_example: "Custom caret pair"
          disabled_example: "Disabled"
          readonly_example: "Readonly"
          min_chars_example: "Minimum query length"
          custom_empty_example: "Custom empty block"
          custom_empty_body: "Nothing matches. Try another term."
          placement_example: "Placement and offset"
          debounce_example: "Debounced input"
          events_example: "Open and close callbacks"
          large_list_example: "Large virtualized list"
          paged_example: "Paginated server source"
          paged_note: "Pages of 50 from a deliberately slow source that reports a total. Scroll to fetch the next page and listen for the loading announcement while the listbox is busy."
          paged_cursor_example: "Paginated server source reporting only more-ness"
          paged_cursor_note: "The same source returning hasMore instead of a total, as a cursor-based API would. Rows report a size of -1 while pages remain, which is the only way a set size stays unknown. Filter to a narrow term so the source runs out within one page, and the size becomes the real count."
          large_list_note: "5000 options rendered in full. Only the rows in view are mounted; scroll all the way to the last option, and a screen reader still hears the true total of 5000."
          events_note: "Opened %{opened} times, closed %{closed} times."
          placeholder: "Choose an option"
          multi_placeholder: "Choose options"
          empty_label: "No matching options"
          request_error: "The first request failed."
          keyboard_walkthrough_example: "Keyboard walkthrough"
          keyboard_walkthrough_description: "The typeahead keeps focus in its input and moves a cursor through the list with aria-activedescendant, so the keys below are not the same set a listbox-focus widget would use."
          keyboard_step_open: "Down or Up arrow opens the list. Typing opens it too."
          keyboard_step_move: "Arrow keys move the cursor. Focus stays in the input the whole time."
          keyboard_step_page: "Page Down and Page Up jump a screenful, including past rows that are not mounted yet."
          keyboard_step_home_end: "Home and End move the text caret, not the cursor — the input is editable, so the caret wins. On the static variant, which has no input, they jump to the first and last option."
          keyboard_step_choose: "Enter chooses the row under the cursor. Space types a space; it does not choose."
          keyboard_step_escape: "Escape closes the list and resets the query, keeping the current value and focus."
          keyboard_step_tab: "Tab leaves the control entirely rather than moving into the list."
          keyboard_transcript_example: "What a screen reader hears"
          keyboard_transcript_description: "A mirror of the live region the control announces through. It is hidden from assistive technology itself, so nothing here is spoken twice, and it shows coalesced flushes rather than individual calls."
          keyboard_transcript_try_this: "Add and remove a few items and watch the transcript fill. A multi-select is used because single-select conveys its choice through aria-selected rather than an announcement."
          keyboard_transcript_title: "Live region transcript"
          keyboard_transcript_empty: "Nothing announced yet."
          keyboard_clearing_example: "Clearing without a mouse"
          keyboard_clearing_description: "The clear control is deliberately not a tab stop, so it is pointer-only. The keyboard path differs by arity: a single-select clears on Backspace or Delete over an empty query, while a multi-select removes one chip per Backspace and has no clear-all key at all."
          keyboard_clearing_try_this: "Focus the input, make sure the query is empty, then press Backspace."
          keyboard_mobile_example: "On a narrow viewport"
          keyboard_mobile_description: "Whether the overlay is a popover or a modal is a global decision made from the viewport width, not a per-control option, so this page cannot show both side by side. Narrow the window below 40rem and reopen any example to see it."
          keyboard_mobile_try_this: "Resize the window under 40rem, then reopen the first example in Start here."
          keyboard_mobile_note_input: "The typeahead's query input moves out of the trigger and into the modal, where it takes focus on open."
          keyboard_mobile_note_static: "The static variant switches from a cursor to real focus inside the list."
          keyboard_mobile_note_chips: "Chip arrow-roving is off, so each chip's remove button becomes an ordinary tab stop."
          default_description: "The baseline: a client-side array, a controlled value, and a typeahead trigger. The component never mutates @value — it emits the next one and the consumer applies it."
          default_try_this: "Type a few letters, then press Escape. The query resets but the selection does not."
          static_description: "The static variant has no query input at all, so the listbox itself takes focus. Use it when filtering would be noise on a short, fixed list."
          static_try_this: "Open it and press Home, then End. Unlike a typeahead, these jump to the first and last option rather than moving a text caret."
          multi_description: "With @multiple the value becomes an array and selections render as chips inside the trigger, sharing one tab stop with the query input."
          multi_try_this: "Add three items, then press Left arrow from the empty input to walk back through the chips."
          min_chars_description: "@minChars suppresses the request entirely below the threshold — no network call and no loading placeholder, only a hint."
          min_chars_try_this: "Type two characters and watch nothing load; the third triggers the first request."
          debounce_description: "@debounce collapses a burst of keystrokes into a single query. Async sources debounce by default; a number overrides the delay."
          debounce_try_this: "Type quickly and watch the list update once you stop, not on every keystroke."
          paged_description: "A source that reports {items, total} knows its own size, so every row can carry an honest position and the list stops fetching once the total is reached."
          paged_try_this: "Scroll to the bottom repeatedly and listen for the loading announcement between pages."
          paged_cursor_description: "The same source reporting hasMore instead of a total, as a cursor API would. Set size stays unknown while pages remain — a screen reader hears no total until the source is exhausted."
          paged_cursor_try_this: "Filter to a narrow term so the source completes within one page; the size becomes a real count."
          reload_description: "While a new query is in flight the previous rows are kept, so a source that answers quickly never blinks. Past a short threshold they give way to the skeleton instead: those rows no longer match what the input says, and they stay clickable, so an Enter would land on a row the query excludes. Fetching another page for the same query is unaffected."
          reload_try_this: "Type a few digits into each, then press backspace. The fast one swaps its rows in place; the slow one shows the skeleton first, and neither leaves a stale row you could select."
          reload_fast_label: "Fast source (120ms): rows are kept"
          reload_slow_label: "Slow source (900ms): skeleton takes over"
          async_button_description: "A source returning a bare array is asserting completeness, so the engine takes the first response as the whole set and never probes for a second page."
          async_button_try_this: "Open it and wait; exactly four options arrive and no further request follows."
          empty_description: "An async source that legitimately returns nothing. @noResultsLabel replaces the default wording without needing a block."
          empty_try_this: "Open it and wait for the request to settle."
          custom_empty_description: "The :empty block replaces the whole empty state, for when a sentence is not enough and the reader needs an action."
          custom_empty_try_this: "Open it and compare with the previous example's plain message."
          error_description: "A source that rejects. The failure is a muted, recoverable message rather than an error dump, and retrying re-runs the same query."
          error_try_this: "Open it, then press Retry — the second request succeeds."
          icon_description: "@icon puts a fixed decorative glyph in the trigger. It is presentational only and is not announced."
          icon_only_description: "@iconOnly drops the trigger label entirely, so @label becomes the accessible name and is required. Here the glyph itself is derived from the current value."
          icon_only_try_this: "Change the selection and watch the trigger icon follow it."
          caret_description: "@caretIcon accepts a pair so the indicator can express open and closed states rather than rotating one glyph."
          caret_try_this: "Open and close it, watching the caret swap rather than spin."
          selection_description: "On a typeahead the :selection block is a resting adornment, not a lock: focus reveals the plain editable label so the field stays typeable, and leaving restores the custom markup."
          selection_try_this: "Click into it — the rich row becomes an editable label, selected for overtype. Click outside to restore it."
          placement_description: "@placement and @offset are forwarded to the overlay, for triggers near a viewport edge where the default would be clipped."
          placement_try_this: "Open it and note the panel opens upward."
          events_description: "@onShow and @onClose compose with the component's own open and close handling rather than replacing it."
          events_try_this: "Open and close it a few times and watch the counters below."
          maximum_description: "@maximum is enforced at the engine's single selection chokepoint, so pointer, keyboard and programmatic paths are all capped by one guard. At the cap, unselected rows are disabled rather than silently ignoring clicks."
          maximum_try_this: "Open it at the cap — the remaining options are disabled and a limit message explains why."
          none_description: "@noneLabel adds a real selectable row that clears the value, counted in the ARIA positions so keyboard and screen-reader indexes stay in step. It hides under an active query so a non-matching search still reaches the empty state."
          none_try_this: "Choose None, then reopen and start typing — the None row is gone while filtering."
          clearable_description: "@clearable adds a pointer affordance. It is deliberately not a tab stop: keyboard users clear with Backspace or Delete on an empty query instead."
          clearable_try_this: "Clear it with the mouse, choose again, then clear it from the keyboard with Backspace."
          clearable_multi_description: "The same control on a multi-select clears every chip at once. Note there is no keyboard equivalent for clear-all here — Backspace removes one chip at a time."
          clearable_multi_try_this: "Remove one chip with Backspace, then clear the rest with the control."
          disabled_description: "@disabled removes the control from the tab order entirely and blocks every path that could open or mutate it."
          readonly_description: "@readonly differs from disabled by focus, not by appearance: the value stays reachable and readable by keyboard and screen reader, but cannot be changed."
          readonly_try_this: "Tab through both this and the disabled example above — only this one receives focus."
          large_list_description: "Five thousand client-side options rendered in full. Only the rows in view are mounted, and no render cap applies to a client source, so the last option is genuinely reachable."
          large_list_try_this: "Scroll to the very bottom — option 5000 exists, and a screen reader hears the true total throughout."
