        roving_focus:
          title: "Roving focus"
          description: "Keyboard navigation inside a composite widget, built from plain semantic HTML so that anything that misbehaves here is the modifier rather than a component wrapped around it. The patterns mirror the interactive examples in the WAI-ARIA Authoring Practices."
          groups:
            aria_label: "Roving focus patterns"
            toolbar:
              title: "Toolbar"
              description: "A single tab stop holding controls of mixed kinds, entered on the first one."
            listbox:
              title: "Listbox"
              description: "A vertical cursor with type-ahead, entered on the option already chosen."
            combobox:
              title: "Combobox"
              description: "A cursor that moves without focus moving, reported by aria-activedescendant."
            radio:
              title: "Radio group"
              description: "A group whose checked member is where the cursor starts, and follows."
            tree:
              title: "Tree"
              description: "A vertical cursor over the visible rows, with hierarchy left to the consumer."
            adjacent:
              title: "Beside a control"
              description: "A group that Tab never reaches, entered and left through its edges."
            components:
              title: "With components"
              description: "The same cursor over real buttons, where items are destroyed under it."
          toolbar:
            label: "Text formatting"
            example: "Toolbar"
            example_description: "The whole bar is one tab stop. Activation is left to the native buttons rather than routed through the modifier, so Enter and Space behave exactly as they would without it. Cut and Paste are disabled in the two different ways the practice page distinguishes, and the cursor treats them differently as a result."
            try_this: "Tab in, then arrow along the bar. Home and End reach the ends. Arrow past Cut and Paste: Cut is stepped over, while Paste can be reached and read out but does nothing when activated."
            bold: "Bold"
            italic: "Italic"
            underline: "Underline"
            copy: "Copy"
            cut: "Cut"
            paste: "Paste"
            docs: "Authoring practices"
          tags:
            label: "Applied tags"
            example: "Removing the item under the cursor"
            example_description: "Each tag is a real button, so removing one destroys the element holding the cursor and the button runs its action a tick later than the key that asked for it. The cursor moves to the next tag rather than letting focus fall to the page."
            try_this: "Arrow to a tag in the middle and press Enter to remove it, then check where the cursor went. Remove the last tag in the row and it moves backwards instead. Remove them all and it stops rather than guessing."
            remove: "Remove %{tag}"
            reset: "Start over"
            design: "Design"
            keyboard: "Keyboard"
            release: "Release"
            support: "Support"
          multi:
            label: "Accessibility checks"
            example: "Multi-select entry"
            example_description: "Entry lands on the first chosen row, returning the reader to their own selection rather than to the top. That knowingly starts the cursor where the next Space would remove something, which is the trade the pattern makes. Arrows wrap, so passing the last row returns to the first."
            try_this: "Note that the cursor starts on the chosen row rather than the first one, then arrow past the last row to come back around to the top."
            keyboard: "Keyboard navigable"
            contrast: "Sufficient contrast"
            captions: "Captions provided"
            motion: "Reduced motion honored"
            labels: "Fields are labelled"
          adjacent:
            label: "Filters"
            field: "Search"
            placeholder: "Search topics"
            example: "A group Tab does not reach"
            example_description: "The filters are not in the tab sequence, so Tab goes straight to the field and the pair counts as one component rather than two. The filters are reached with an arrow from the start of the field, and running off their end returns there. The modifier reports the edge and the direction; where to go next is this example's decision, because only it knows the field exists."
            try_this: "Tab in and notice you land on the field, not the filters. With the caret at the start, press the left arrow to step into them, arrow between them, then continue past the last to return to the field."
            open: "Open"
            mine: "Mine"
            recent: "Recent"
          listbox:
            label: "Fruit"
            example: "Listbox with type-ahead"
            example_description: "Typing moves the cursor to the option whose name starts with what was typed, which is what the practice page specifies and what a screen reader reads out. The count beside each option is decorative, so it belongs to the row's text but not to its name."
            try_this: "Arrow through the options, then type a letter such as b. Press a repeatedly to walk the options sharing that initial, then pause and type apr to land on Apricot directly. Typing a digit matches nothing, because the counts are not part of any name."
            apple: "Apple"
            apricot: "Apricot"
            banana: "Banana"
            blackberry: "Blackberry"
            cherry: "Cherry"
            coconut: "Coconut"
          combobox:
            label: "Email digest"
            example: "Cursor without focus"
            example_description: "The control keeps focus while the arrows move a highlight through the options, and the control reports where that highlight is rather than the browser moving to it. This is the second of the two strategies the practice page describes, and the one a combobox needs so the reader can keep typing."
            try_this: "Open the list and arrow through it while watching the focus ring: it stays on the button. Press Enter to choose, and Escape or another click to close."
            daily: "Daily"
            weekly: "Weekly"
            monthly: "Monthly"
            never: "Never"
          radio:
            label: "Alignment"
            example: "Radio group"
            example_description: "A radio group marks its choice with aria-checked rather than aria-selected, and entering the group lands on that member instead of the first one. Moving the cursor moves the choice with it, which is the one pattern where that is expected."
            try_this: "Tab into the group and notice it enters on the checked member. Arrow along it and watch the choice follow. Tab away and back to return to the new choice."
            left: "Left"
            center: "Center"
            right: "Right"
          tree:
            label: "Source tree"
            example: "Tree"
            example_description: "The cursor runs over the rows that are visible right now, so collapsing a parent removes its children from the sequence. Expand and collapse come from the cross-axis event, which reports the arrows this group does not navigate as a direction, leaving what that direction means to the example."
            try_this: "Arrow up and down the rows, then use the right and left arrows on a parent to open and close it. Collapse a parent and notice that its children leave the cursor with it."
            rtl_example: "Tree, right to left"
            rtl_description: "The same component under a right-to-left direction, from the same source. The arrows swap with the writing direction, so the one pointing at a row's children is still the one that opens them, and the example itself never mentions direction."
            rtl_try_this: "Open and close a parent, then compare with the copy above: the children sit on the other side, and the arrow that reaches them has swapped to match."
            components: "Components"
            button: "Button"
            select: "Select"
            modifiers: "Modifiers"
            roving_focus: "Roving focus"
            auto_focus: "Auto focus"
