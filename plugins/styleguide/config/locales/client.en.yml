        syntax: Syntax
        atoms: Atoms
        molecules: Molecules
        organisms: Organisms

      sections:
        bem:
          title: "BEM"
        typography:
          title: "Typography"
          example: "Welcome to Discourse"
          paragraph: "Lorem ipsum dolor sit amet, consectetur adipiscing elit, sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat. Duis aute irure dolor in reprehenderit in voluptate velit esse cillum dolore eu fugiat nulla pariatur. Excepteur sint occaecat cupidatat non proident, sunt in culpa qui officia deserunt mollit anim id est laborum."
        date_time_inputs:
          title: "Date/Time inputs"
        menus:
          title: "Menus"
        multi_select:
          title: "Multi select"
        select:
          title: "Select"
          hero:
            caption: "Three selects at composer density — a category chooser, a tag multi-select, and a notification level. This is the arrangement that shows whether they read as one system."
            category: "Category"
            tags: "Tags"
            notifications: "Notification level"
            tag_topics:
              one: "%{count} topic"
              other: "%{count} topics"
          groups:
            aria_label: "Select example groups"
            start:
              title: "Start here"
              description: "The three trigger variants, single versus multiple selection, and the controlled value contract every other example builds on."
            data:
              title: "Data and filtering"
              description: "Where options come from: a client array, an async source, pagination, and how a query reaches them."
            states:
              title: "Loading and empty states"
              description: "What the control shows on its own while it is waiting, when it finds nothing, and when its source fails. Replacing any of them is covered in Row content."
            appearance:
              title: "Appearance"
              description: "Trigger chrome: icons, carets, where the panel opens, and the open and close callbacks."
            content:
              title: "Row content"
              description: "A block replaces what the component renders inside a row; it does not replace the row. Supply one only when an argument cannot express the content — most rows correctly need none. These take the blocks one at a time, then show what changes when they are used together."
            selection:
              title: "Selection rules"
              description: "What the reader is allowed to pick, and how the control refuses: limits, a none row, clearing, and locked states."
            keyboard:
              title: "Keyboard and screen reader"
              description: "What the control does for someone who never touches a mouse, and what it says out loud while they use it."
            limits:
              title: "Limits and edge cases"
              description: "Where the control bends: very large lists, truncation, and sources that misbehave."
            pickers:
              title: "Real-world pickers"
              description: "The component doing jobs Discourse actually does. Each one names why its blocks exist and what they buy."
          description: "Interactive examples of the current DSelect family for visual, responsive, keyboard, screen-reader, asynchronous-state, and theme testing."
          mobile_guidance: "Resize to a mobile viewport to verify that the typeahead query input opens inside the modal."
          default_example: "Default synchronous typeahead"
          reload_example: "Reloading: a fast source and a slow one"
          async_button_example: "Async button with loading state"
          static_example: "Static select"
          multi_example: "Multi-select"
          maximum_example: "Multi-select with a maximum"
          toggle_example: "A dropdown of toggles"
          toggle_description: "A multi-select is already a panel of toggles: picking a row flips it in place and leaves the list open for the next one, and each row draws its own checked or unchecked box. Nothing configures this — it is what `@multiple` does. The empty box matters as much as the check: a row that shows nothing until it is chosen makes the list jump as you work down it, and gives a reader no way to tell an unselected row from one that cannot be selected."
          toggle_try_this: "Toggle three rows without closing the panel, then toggle one back off. The boxes change; the rows do not move."
          toggle_label: "Interface languages"
          toggle_note: "The trigger is `@variant=\"button\"` so the panel is a place you go to make several changes at once, rather than a field you are filling in."
          none_example: "Single-select with a none row"
          none_label: "None"
          icon_only_example: "Icon-only trigger (icon reflects the selection)"
          icon_only_label: "Notification level"
          empty_example: "Async empty results"
          error_example: "First-request error and retry"
          clearable_example: "Clearable single-select"
          clearable_multi_example: "Clearable multi-select"
          icon_example: "Leading icon"
          icon_follows_example: "Icon that follows the selection"
          caret_example: "Custom caret pair"
          disabled_example: "Disabled"
          readonly_example: "Readonly"
          min_chars_example: "Minimum query length"
          placement_example: "Placement and offset"
          debounce_example: "Debounced input"
          events_example: "Open and close callbacks"
          large_list_example: "Large virtualized list"
          paged_example: "Paginated server source"
          paged_note: "Pages of 50, from a deliberately slow source."
          paged_cursor_example: "Paginated server source reporting only more-ness"
          paged_cursor_note: "Rows report a set size of -1 while pages remain."
          large_list_note: "5000 options; only the rows in view are mounted."
          events_note: "Opened %{opened} times, closed %{closed} times."
          placeholder: "Choose an option"
          multi_placeholder: "Choose options"
          empty_label: "No matching options"
          request_error: "The first request failed."
          open_behaviour_example: "What is active when the list opens"
          open_behaviour_description: "The three variants do not agree on which option is active the moment the list appears, and the difference is deliberate. Open each one and watch the highlight before pressing anything."
          open_behaviour_try_this: "Open all six, first with the mouse and then with the keyboard. Note where the highlight sits before your first arrow key."
          open_behaviour_empty_label: "Nothing chosen yet"
          open_behaviour_filled_label: "Already holding a value"
          open_behaviour_typeahead: "Typeahead"
          open_behaviour_button: "Button"
          open_behaviour_static: "Static"
          open_behaviour_note_empty: "With nothing chosen, typeahead and static highlight the first option, so Enter takes it. Button highlights nothing and waits."
          open_behaviour_note_filled: "With a value held, all three restore it, so reopening points at what was already picked rather than an unrelated row."
          open_behaviour_note_rule: "One rule produces both: never pre-highlight a row the reader neither chose nor asked for. Typing is a request, clicking a button to open is not."
          keyboard_walkthrough_example: "Keyboard walkthrough"
          keyboard_walkthrough_description: "The typeahead keeps focus in its input and moves a cursor through the list with aria-activedescendant, so the keys below are not the same set a listbox-focus widget would use."
          keyboard_walkthrough_try_this: "Put the mouse down. Tab to it, then work through the keys below without touching the pointer once."
          keyboard_step_open: "Down or Up arrow opens the list. Typing opens it too."
          keyboard_step_move: "Arrow keys move the cursor. Focus stays in the input the whole time."
          keyboard_step_page: "Page Down and Page Up jump a screenful, including past rows that are not mounted yet."
          keyboard_step_home_end: "Home and End move the text caret, not the cursor — the input is editable, so the caret wins. On the static variant, which has no input, they jump to the first and last option."
          keyboard_step_choose: "Enter chooses the row under the cursor. Space types a space; it does not choose."
          keyboard_step_escape: "Escape closes the list and resets the query, keeping the current value and focus."
          keyboard_step_tab: "Tab leaves the control entirely. It never moves into the list, whose rows are the arrow keys' job — but a panel with controls of its own is a stop on the way out, as the next example shows."
          tab_order_example: "Where Tab goes"
          tab_order_description: "The panel is rendered near the end of the document rather than beside the field, so left alone, Tab would follow the panel's position instead of the field's: nothing would lead into the panel, and leaving it would drop you somewhere unrelated. Both directions are put back, so the panel behaves as if it sat inline under the trigger."
          tab_order_try_this: "Tab to the field, then keep pressing Tab. Then do it again with Shift held, and watch the same stops come back in reverse."
          tab_order_label: "Locale"
          tab_order_footer_action: "Browse all locales"
          tab_order_note_into: "From the closed field, Tab moves on as normal. Open it and Tab again, and the next stop is inside the panel — its filter, then its footer action."
          tab_order_note_out: "Tab off the last panel control and the panel closes, leaving you on whatever follows the field on the page — not on whatever happens to follow the panel in the document."
          tab_order_note_list: "The options are never a stop. They are reached with the arrow keys, and the list's scroll area is held out of the sequence on purpose, so Tab never lands on a container with nothing to do."
          keyboard_transcript_example: "What a screen reader hears"
          aria_probe_title: "Live ARIA readout"
          aria_probe_description: "Follows whichever control has focus and records every focus, key press and announcement, to the console as well. Use it to tell a cursor that never moved from one pointing at an id that does not resolve, and either from state that is exposed but never voiced."
          aria_probe_copy: "Copy trace"
          aria_probe_test_channel: "Test channel"
          aria_probe_clear: "Clear"
          keyboard_transcript_description: "A mirror of the live region the control announces through. It is hidden from assistive technology itself, so nothing here is spoken twice, and it shows coalesced flushes rather than individual calls."
          keyboard_transcript_try_this: "Add and remove a few items and watch the transcript fill. A multi-select is used because single-select conveys its choice through aria-selected rather than an announcement."
          keyboard_transcript_title: "Live region transcript"
          keyboard_transcript_empty: "Nothing announced yet."
          keyboard_clearing_example: "Clearing without a mouse"
          keyboard_clearing_description: "The clear control is deliberately not a tab stop, so it is pointer-only. The keyboard path differs by arity: a single-select clears on Backspace or Delete over an empty query, while a multi-select removes one chip per Backspace and has no clear-all key at all."
          keyboard_clearing_try_this: "Focus the input, make sure the query is empty, then press Backspace."
          keyboard_mobile_example: "On a narrow viewport"
          keyboard_mobile_description: "Whether the overlay is a popover or a modal is a global decision made from the viewport width, not a per-control option, so this page cannot show both side by side. Narrow the window below 40rem and reopen any example to see it."
          keyboard_mobile_try_this: "Resize the window under 40rem, then reopen the first example in Start here."
          keyboard_mobile_note_input: "The typeahead's query input moves out of the trigger and into the modal, where it takes focus on open."
          keyboard_mobile_note_static: "The static variant switches from a cursor to real focus inside the list."
          keyboard_mobile_note_chips: "Chip arrow-roving is off, so each chip's remove button becomes an ordinary tab stop."
          default_description: "The baseline: a client-side array, a controlled value, and a typeahead trigger. The component never mutates `@value` — it emits the next one and the consumer applies it."
          default_try_this: "Type a few letters, then press Escape. The query resets but the selection does not."
          static_description: "The static variant has no query input at all, so the listbox itself takes focus. Use it when filtering would be noise on a short, fixed list."
          static_try_this: "Open it and press Home, then End. Unlike a typeahead, these jump to the first and last option rather than moving a text caret."
          multi_description: "With `@multiple` the value becomes an array and selections render as chips inside the trigger, sharing one tab stop with the query input."
          multi_try_this: "Add three items, then press Left arrow from the empty input to walk back through the chips."
          min_chars_description: "`@minChars` suppresses the request entirely below the threshold — no network call and no loading placeholder, only a hint."
          min_chars_try_this: "Type `en` and watch nothing load — no request, no placeholder. The third character (`eng`) triggers the first one."
          debounce_description: "`@debounce` collapses a burst of keystrokes into a single query, so a source is asked once for what the reader meant rather than once per character. Async sources debounce by default; a number overrides the delay."
          debounce_try_this: "Type `english` quickly, then pause. The tally below counts every keystroke against the queries actually sent."
          debounce_result: "%{keystrokes} keystrokes typed, %{requests} queries dispatched. Everything else was collapsed before it reached the source."
          paged_description: "A source that reports {items, total} knows its own size, so every row can carry an honest position and the list stops fetching once the total is reached."
          paged_try_this: "Scroll to the bottom repeatedly and listen for the loading announcement between pages."
          paged_cursor_description: "The same source reporting hasMore instead of a total, as a cursor API would. Set size stays unknown while pages remain — a screen reader hears no total until the source is exhausted."
          paged_cursor_try_this: "Filter to a narrow term so the source completes within one page; the size becomes a real count."
          reload_description: "While a new query is in flight the previous rows are kept, so a source that answers quickly never blinks. Past a short threshold they give way to the skeleton instead: those rows no longer match what the input says, and they stay clickable, so an Enter would land on a row the query excludes. Fetching another page for the same query is unaffected."
          reload_try_this: "Type a few digits into each, then press backspace. The fast one swaps its rows in place; the slow one shows the skeleton first, and neither leaves a stale row you could select."
          reload_fast_label: "Fast source (120ms): rows are kept"
          reload_slow_label: "Slow source (900ms): skeleton takes over"
          async_button_description: "A source returning a bare array is asserting completeness, so the engine takes the first response as the whole set and never probes for a second page."
          async_button_try_this: "Open it and wait; exactly four options arrive and no further request follows."
          empty_description: "An async source that legitimately returns nothing. `@noResultsLabel` replaces the default wording without needing a block."
          empty_try_this: "Open it and wait for the request to settle."
          error_description: "A source that rejects. The failure is a muted, recoverable message rather than an error dump, and retrying re-runs the same query."
          error_try_this: "Open it, then press Retry — the second request succeeds."
          icon_description: "`@icon` puts a fixed decorative glyph in the trigger. It is presentational only and is not announced."
          icon_try_this: "Choose a different language. The globe never changes: it names the field, not the value — unlike the icon-only trigger beside it, whose glyph follows the selection."
          icon_follows_description: "The same `@icon` argument, driven by `@value` instead of fixed. The component never derives a glyph: the consumer owns the value, so it owns what the trigger shows."
          icon_follows_try_this: "Change the level and watch the trigger glyph change with it, unlike the globe above."
          icon_only_description: "`@iconOnly` drops the trigger label entirely, so `@label` becomes the accessible name and is required. Here the glyph itself is derived from the current value."
          icon_only_try_this: "Change the selection and watch the trigger icon follow it."
          caret_description: "`@caretIcon` accepts a pair so the indicator can express open and closed states rather than rotating one glyph."
          caret_try_this: "Open and close it, watching the caret swap rather than spin."
          placement_description: "`@placement` and `@offset` are forwarded to the overlay, for triggers near a viewport edge where the default would be clipped."
          placement_try_this: "Open it and note the panel opens upward."
          events_description: "`@onShow` and `@onClose` compose with the component's own open and close handling rather than replacing it."
          events_try_this: "Open and close it a few times and watch the counters below."
          maximum_description: "`@maximum` is enforced at the engine's single selection chokepoint, so pointer, keyboard and programmatic paths are all capped by one guard. At the cap, unselected rows are disabled rather than silently ignoring clicks."
          maximum_try_this: "Open it at the cap — the remaining options are disabled and a limit message explains why."
          none_description: "`@noneLabel` adds a real selectable row that clears the value, counted in the ARIA positions so keyboard and screen-reader indexes stay in step. It hides under an active query so a non-matching search still reaches the empty state."
          none_try_this: "Choose None, then reopen and start typing — the None row is gone while filtering."
          clearable_description: "`@clearable` adds a pointer affordance. It is deliberately not a tab stop: keyboard users clear with Backspace or Delete on an empty query instead."
          clearable_try_this: "Clear it with the mouse, choose again, then clear it from the keyboard with Backspace."
          clearable_multi_description: "The same control on a multi-select clears every chip at once. Note there is no keyboard equivalent for clear-all here — Backspace removes one chip at a time."
          clearable_multi_try_this: "Remove one chip with Backspace, then clear the rest with the control."
          disabled_description: "`@disabled` removes the control from the tab order entirely and blocks every path that could open or mutate it."
          disabled_try_this: "Tab towards it and watch it be skipped, then click it and watch nothing open. Readonly, beside it, does the opposite."
          readonly_description: "`@readonly` differs from disabled by focus, not by appearance: the value stays reachable and readable by keyboard and screen reader, but cannot be changed."
          readonly_try_this: "Tab through both this and the disabled example above — only this one receives focus."
          large_list_description: "Five thousand client-side options rendered in full. Only the rows in view are mounted, and no render cap applies to a client source, so the last option is genuinely reachable."
          large_list_try_this: "Scroll to the very bottom — option 5000 exists, and a screen reader hears the true total throughout."
          teams:
            design: "Design"
            engineering: "Engineering"
            support: "Support"
          notification_levels:
            muted: "Muted"
            muted_description: "Never notify me about this topic."
            normal: "Normal"
            normal_description: "Notify me only when someone mentions me."
            tracking: "Tracking"
            tracking_description: "Show a count of new replies."
            watching: "Watching"
            watching_description: "Notify me about every new reply."
            mentions: "Mentions only"
            mentions_description: "Unavailable while digest mode is enabled."
            manage: "Manage notification settings"
            manage_description: "Open the full notification preferences."
          content:
            defaults_example: "Rows without a block"
            defaults_description: "`@labelField` picks the field to display and `@selectedIcon` marks the chosen row. Between them they cover most lists, and a block that reproduces this is pure cost: it drops the unresolved-value treatment and, on a typeahead, changes how the trigger behaves."
            defaults_try_this: "Open it. Every row here is the component's own rendering, with no block involved."
            glyph_example: "Glyph rows"
            glyph_description: "The most-copied shape: a leading mark, a label, and a trailing count. Only `:item` is supplied — the trigger is a single line, so it keeps the default label rather than repeating the row."
            glyph_try_this: "Open it and choose a topic. The row is rich; the trigger stays one line."
            glyph_placeholder: "Choose a topic"
            row_icon_example: "Rows that carry their own icon"
            row_icon_description: "Each option supplies its glyph, so `:item` renders from the data rather than adding a fixed adornment. The name already carries the meaning, so the icon sits beside it as decoration rather than as a second label."
            row_icon_try_this: "Open it and read a row: the icon is never announced, because the title beside it already says the same thing."
            chip_icon_example: "Chips that keep their icon"
            chip_icon_description: "`:item` and `:selection` render the same glyph, so a chip looks like the row it came from. The text has to stay in `:selection`, because a chip's accessible name is built from whatever that block renders."
            chip_icon_try_this: "Remove a chip with the keyboard and listen. The name comes from this block, so an icon-only chip would be announced as a bare remove button."
            status_icon_example: "Trailing status icon"
            status_icon_description: "A glyph at the END of a row states something the text does not, so unlike a leading decoration it needs a name of its own. A `title` will not do it: focus sits on the option, never on the icon inside it."
            status_icon_try_this: "Arrow through the list and notice which rows announce that they are managed automatically."
            status_icon_automatic: "Managed automatically"
            glyph_replies:
              one: "%{count} reply"
              other: "%{count} replies"
            computed_example: "Rows that compute"
            computed_description: "A block runs when the row renders, so it can derive rather than read. Nothing on the item carries the local time — it is computed per row, which no field mapping could do."
            computed_try_this: "Open it and leave it open through a minute boundary. The local times update without reopening the menu."
            computed_placeholder: "Choose a timezone"
            empty_example: "Custom empty"
            empty_description: "The `:empty` block replaces the message, not the container: the component keeps the wrapper and its status role, so the state is still announced without you doing anything."
            empty_try_this: "Open it and wait for the request to settle."
            empty_body: "Nothing matches that yet. Try a shorter term."
            error_example: "Custom error"
            error_description: "Like `:empty`, `:error` replaces the message rather than the container: the wrapper and its alert role stay, so the failure is announced whatever you render. The block is handed the retry action too, for a recovery control of your own."
            error_try_this: "Open it to see the failure, press Retry to recover, then close and reopen to fail again."
            error_retry: "Retry"
            selection_example: "One block, two surfaces"
            selection_description: "The same `:selection` block lands in a single-select's resting trigger and in each chip of a multi-select. It is not the same as `:item`, and it should not be: the list has room for two lines, the trigger has one. A chip's accessible name is built from what this renders, so it has to contain text."
            selection_try_this: "Click into the single-select — the rich resting markup becomes an editable label. Then remove a chip from the multi-select with the keyboard and listen to how it is named."
            selection_single_label: "Single-select: the resting trigger"
            selection_multi_label: "Multi-select: one chip each"
            divided_example: "Rules between timezone offsets"
            divided_description: "`@groupBy` with no `@groupLabel` draws a non-interactive rule at each group boundary — here the group key is the UTC offset, so a rule lands wherever the offset changes. Adding `@groupLabel` turns the same boundaries into labeled headers. Keyboard navigation skips each rule and leaves it out of the ARIA positions, so the count a reader hears is still the number of options."
            divided_try_this: "Arrow from one UTC offset into the next. The cursor steps straight over the rule, and the positions stay contiguous. Then type a query: the rules are recomputed from the surviving rows instead of vanishing."
            divided_placeholder: "Choose a time zone"
            divided_note: "Boundaries are derived after filtering on every render, so a query keeps exactly the rules that still separate two surviving groups — none is ever orphaned."
            grouped_example: "Rows and their header"
            grouped_description: "A custom header has to share a rhythm with the rows beneath it, and it is coupled to them: every option is described by its header, so whatever the header renders is announced again after each row in the group. That is why this one is an icon and a name, and nothing else."
            grouped_try_this: "Arrow down through a group and notice the headers are skipped by navigation while still naming the section."
            grouped_placeholder: "Assign to a teammate"
            footer_example: "A footer outlives the list"
            footer_description: "The footer is a sibling of the list, not part of it, so it renders in every panel state — while loading, when populated, when empty, and when the source has failed. Gate its contents on what it is handed rather than assuming there are rows. Three controls rather than one with a switch, because a select captures its source when it is built and cannot have it swapped underneath."
            footer_try_this: "Open all three. The footer is present in every one of them; only its contents change."
            footer_state_items: "Populated"
            footer_state_empty: "Empty source"
            footer_state_error: "Failing source"
            footer_view_all: "View directory"
            footer_nothing: "Nothing to show"
            footer_count:
              one: "%{count} teammate"
              other: "%{count} teammates"
            picker_example: "The whole picker"
            picker_description: "No new mechanism — the synthesis. Rows, a compact chip, section headers and a footer in one control, which is the only place on the page they can be judged against each other."
            picker_try_this: "Pick a few teammates and watch the footer count follow while the headers stay in place."
            picker_placeholder: "Assign reviewers"
            picker_selected:
              one: "%{count} selected"
              other: "%{count} selected"
          pickers:
            reviewers:
              title: "Assign reviewers"
              description: "Asynchronous search, values resolved separately from the list, and a held id that no longer exists. The avatar and role are what tell two similar names apart, so the row earns its block; the chip stays one line because the trigger is one line."
              try_this: "Remove a chip, then search for someone by their role rather than their name."
              placeholder: "Search for reviewers"
              deleted_name: "Deleted account"
              deleted_description: "This reviewer is no longer available"
              deleted_username: "deleted-user"
            categories:
              title: "Choose a category"
              description: "A category is a badge, not a string, and the badge carries its own topic count and restricted lock. The description sits on a second line and is hidden from assistive technology, because the badge already names the option and repeating a sentence after every row makes the list slower by ear than by eye."
              try_this: "Open it and find the restricted category — the lock is part of the badge, not something the example added."
              placeholder: "Choose a category"
              uncategorized: "Uncategorized"
              uncategorized_description: "Topics without a category"
            tags:
              title: "Add or create tags"
              description: "The block exists for exactly one row: the create affordance, which swaps the tag icon for a plus so it reads as an action rather than an existing tag. Every other row is the default label plus its count."
              try_this: "Type a tag that does not exist yet, such as “architecture”, and choose the create row."
              placeholder: "Choose tags"
              search_placeholder: "Search or create a tag"
              create: "Create “%{tag}”"
            notifications:
              title: "Choose a notification level"
              description: "Each level needs a sentence to be chosen correctly, so the list is two lines per row; the icon is how the choice is recognized again in the trigger. One row is disabled and one is an action that runs without changing the selection."
              try_this: "Choose Manage notification settings — the counter below moves but the selection does not."
              event_idle: "The action row has not been used."
              action_count:
                one: "The action row was used %{count} time without changing the selection."
                other: "The action row was used %{count} times without changing the selection."
            colors:
              title: "Pick a color palette"
              description: "The clearest case for a block on the page: the value is a color, and no argument can render one. The swatches are hidden from assistive technology because unnamed colors convey nothing, while the palette's name already identifies it."
              try_this: "Open it and compare the palettes rather than the names."
            emoji:
              title: "Pick an emoji"
              description: "The glyph is the point, and the shortcode is what a reader will actually type, so it belongs in the row rather than in a tooltip. Grouping keeps a long list navigable."
              try_this: "Type part of a name to filter across every group at once."
            groups:
              title: "Choose groups"
              description: "A trailing pill rather than trailing text: whether a group is automatic is a property of it, not a measurement, so it should not read as another number."
              try_this: "Open it and compare the automatic groups with the ones a site admin created."
              placeholder: "Choose groups"
              automatic: "Automatic"
              members:
                one: "%{count} member"
                other: "%{count} members"
            badges:
              title: "Choose a badge"
              description: "A badge already knows how to draw itself, so the row hands it straight to the icon-or-image helper and only supplies the rarity color and the grant count around it."
              try_this: "Open it and note the gold, silver and bronze tiers are color plus position, never color alone."
              granted:
                one: "Granted %{count} time"
                other: "Granted %{count} times"
