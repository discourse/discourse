        drag_and_drop:
          title: "Drag and drop"
          description: "The shared drag, drop, resize and gesture primitives, one capability per card."
          groups:
            aria_label: "Drag and drop groups"
            basics:
              title: "Basics"
              description: "The matching vocabulary, and the positions a target reports."
            sources:
              title: "Sources"
              description: "What a draggable element attaches, shows, and permits."
            targets:
              title: "Targets"
              description: "How a target decides whether a drop belongs to it."
            outside:
              title: "From outside"
              description: "Content the browser started dragging, from this page or another window."
            reacting:
              title: "Reacting"
              description: "Responding to a drag without owning the drop."
            resize:
              title: "Resizing"
              description: "Letting someone change a size, by keyboard as well as pointer."
            gestures:
              title: "Other gestures"
              description: "Pointer and touch gestures that transfer nothing."
          nothing_yet: "Nothing yet."
          drag_me: "Drag me"
          drop_here: "Drop here"
          a_card: "A card"
          a_note: "A note"
          cards_only: "Accepts cards only"
          landed: "Dropped: %{label}"
          reported_position: "Reported position: %{position}"
          positions:
            above: "Above"
            below: "Below"
            left: "Left"
            right: "Right"
            inside: "Inside"
          types_title: "Matching by type"
          types_description: "`dDragAndDropSource` names a type and `dDragAndDropTarget` filters on it. A target engages only for the types in its accepts list; everything else drags straight over it."
          types_try_this: "Drag each chip onto the zone. Only the card is taken."
          types_note: "Omitting accepts accepts every registered source, which is rarely what a real surface wants."
          positions_title: "Drop positions"
          positions_description: "`dDragAndDropTarget` paints exactly one of these classes while a compatible drag is over it: four sibling positions plus one container position."
          positions_note: "Positions are logical. In a right-to-left row, before still means the reading-order start and the class flips to --drag-right, so the indicator stays under the pointer."
          axis_title: "Measuring across"
          axis_description: "`dDragAndDropTarget` takes an axis, which chooses the midpoint that decides before from after. A row of columns measures horizontally."
          axis_try_this: "Drop on the left and right halves of one column and compare the reported position."
          fixed_position_title: "A fixed position"
          fixed_position_description: "`dDragAndDropTarget` given a position skips the midpoint entirely and always reports that one."
          fixed_position_try_this: "Drop on the bottom edge. It still reports before."
          always_before: "Always reports before"
          handle_title: "Dragging by a handle"
          handle_description: "`dDragAndDropSource` takes a dragHandle, which confines where a drag may begin so the rest of the element stays selectable and a touch press meant to scroll still scrolls."
          handle_try_this: "Select the text with the pointer, then drag the grip."
          handle_note: "The row stays the drag body: it keeps data-drag-source, it is the target's source.element, and it is what the preview photographs. Style and assert on data-drag-source, never on draggable."
          handle_landed: "The row landed, not the grip."
          selectable_text: "Selectable text"
          preview_title: "A custom preview"
          preview_description: "`dDragAndDropSource` takes a dragPreview render function, which mounts a preview into an isolated offscreen container so nothing around the source bleeds into the drag image."
          preview_try_this: "Drag the chip and watch what follows the pointer."
          preview_badge: "Custom preview"
          disabled_title: "Detaching a source"
          disabled_description: "`dDragAndDropSource` takes disabled, which detaches the registration. This, not a handle, is how to stop an element being dragged."
          disabled_try_this: "Switch it off, try to drag, then switch it back on."
          draggable: "Draggable"
          effect_title: "Declaring the effect"
          effect_description: "`dDragAndDropTarget` names the operation it would perform through getDropEffect, and the drag carries that effect on its record of the target."
          effect_try_this: "Drop on each zone and compare the recorded effect."
          effect_note: "The source's effectAllowed declares what it permits, but nothing here enforces the pair: a target may ask for an effect the source never permitted and no refusal follows. Keep the two consistent yourself."
          asks_for_copy: "Asks for copy"
          asks_for_move: "Asks for move"
          recorded_effect: "Recorded effect: %{effect}"
          nesting_title: "Nested targets"
          nesting_description: "`dDragAndDropTarget` hands the callbacks to the deepest accepted target under the pointer, so one drop is never handled twice."
          nesting_try_this: "Drop on the inner zone, then on the outer one around it."
          nesting_note: "The cost is that an ancestor stops indicating as soon as a descendant claims the drag. A container that must stay lit should render from the service instead."
          outer: "Outer"
          inner: "Inner"
          received_by: "Received by: %{name}"
          accepts_self_title: "Refusing itself"
          accepts_self_description: "`dDragAndDropTarget` takes acceptsSelf. An element that is both a source and a target accepts its own drop by default, since that is often meaningful."
          accepts_self_try_this: "Drop a card onto itself, then onto the other one."
          accepts_self_note: "The comparison is against the drag body, so a row dragged by a handle is still recognised as itself."
          card_a: "Card A"
          card_b: "Card B"
          dropped_card: "Dropped card %{name}"
          can_drop_title: "Refusing by payload"
          can_drop_description: "`dDragAndDropTarget` takes canDrop, a synchronous gate that inspects the payload and refuses the drop before it lands."
          can_drop_try_this: "Drag each chip over the zone. The locked one is never accepted."
          unlocked: "Unlocked"
          locked: "Locked"
          unlocked_only: "Unlocked only"
          adoption_title: "Adopting page content"
          adoption_description: "`dDragAndDropTarget` takes adopts. The browser starts drags on ordinary content such as a link, which registers no source, and an adoption lets a target take those too."
          adoption_try_this: "Drag the link above into the zone."
          adoption_note: "Adoption is resolved once for the page, not per target: the first live adoption whose predicate matches names the drag. Two adoptions sharing a name must share a predicate."
          a_link: "A link on this page"
          drop_a_link: "Drop a link here"
          external_title: "A drop from outside"
          external_description: "`dDragAndDropExternalTarget` takes payloads dragged in from another window or application. It never sees a drag that began on this page."
          external_try_this: "Drag a link from another tab, or a file from your desktop, into the zone."
          external_note: "This is not the upload path. A file dropped here does not enter upload validation, progress, or the upload record."
          from_outside: "Drop from outside the window"
          external_axis_title: "An external slot"
          external_axis_description: "`dDragAndDropExternalTarget` given an axis resolves a position from the pointer, just as an element target does."
          external_axis_try_this: "Drop something near the top edge, then near the bottom."
          external_axis_note: "Without a position or an axis the target is one destination rather than a slot: callbacks receive a null position and the indicator is the single --drag-over-external class."
          a_slot: "A slot, not a destination"
          monitor_title: "Watching every drag"
          monitor_description: "`dDragAndDropMonitor` reacts to a drag happening anywhere, without becoming a drop target itself."
          monitor_try_this: "Drag the chip and watch the log, whether or not you drop it on the zone."
          monitor_note: "The element only anchors the modifier's lifecycle. A monitor is global."
          service_title: "Rendering from state"
          service_description: "The `dragAndDrop` service exposes the in-flight drag as tracked state, so a surface can arm itself without wiring a single callback."
          service_try_this: "Start dragging the chip and watch the panel, without dropping."
          service_note: "The service reads the other way from a target: an empty or missing filter matches nothing, because a caller that has not decided should not light up for every drag."
          armed: "A card is in flight"
          idle: "Idle"
          auto_scroll_title: "Scrolling while dragging"
          auto_scroll_description: "`dDragAndDropAutoScroll` scrolls a container while a drag hovers near its edge, so a row below the fold stays reachable."
          auto_scroll_try_this: "Drag the chip to the bottom edge of the list and hold it there."
          dwell_title: "Dwelling to reveal"
          dwell_description: "`dDragDwell` fires a callback once a drag has hovered its element for a delay, without making the element a drop target."
          dwell_try_this: "Drag the chip over the collapsed folder and hold it there until it opens, then drop it inside. Or drag away and watch it close again."
          dwell_note: "The dwell fires once per hover and opens the folder. Dropping the chip inside keeps it open; dragging away or letting the drag end closes a folder the dwell opened."
          dwell_filed:
            one: "Filed %{count} chip"
            other: "Filed %{count} chips"
          dwell_expand: "Show rows"
          dwell_collapse: "Hide rows"
          row: "Row %{number}"
          separator_title: "Resizing between regions"
          separator_description: "`DResizeSeparator` is the component to reach for first. It wraps the `dResizeEdge` modifier and adds the separator contract: the role, one tab stop, and live announced values."
          separator_try_this: "Drag the divider, then focus it and use the arrow keys."
          separator_note: "A label is required: a focusable separator with no accessible name is announced as a bare splitter, which says nothing about what it resizes."
          separator_label: "Resize the panes"
          left_pane: "Left"
          right_pane: "Right"
          edge_title: "Resizing with your own element"
          edge_description: "`dResizeEdge` is the modifier underneath `DResizeSeparator`. It owns the interaction and nothing else, so the role, the tab stop and the announced values are yours to supply."
          edge_try_this: "Drag the divider, then focus it and use the arrow keys. It behaves the same; the difference is what the markup owes."
          edge_note: "Reach for it only when the element and its semantics are already yours to provide. Everything spelled out in this example is what the component would have given you."
          edge_label: "Resize the panes"
          handles_title: "Resizing a box"
          handles_description: "`DResizeHandles` is a component that renders the edges and corners of a box and reports pointer geometry for the consumer to turn into a size."
          handles_try_this: "Drag any edge or corner."
          handles_note: "Do not give a two-dimensional resize the separator role. It has no single value to announce, so the role would describe a control that does not exist."
          pointer_drag_title: "Tracking the pointer"
          pointer_drag_description: "`dPointerDrag` presses, moves and releases on one element. It transfers nothing and has no targets."
          pointer_drag_try_this: "Drag the knob along the track."
          pointer_drag_note: "Always handle the cancel callback. A gesture the browser interrupts otherwise leaves whatever the start opened still open."
          knob: "Knob"
          swipe_title: "Detecting a flick"
          swipe_description: "`dSwipe` reports one discrete direction with velocity, rather than a value that follows the pointer."
          swipe_try_this: "Swipe across the panel on a touch screen."
          swipe_note: "Reach for a pointer drag instead when a value must track the pointer continuously."
          swipe_here: "Swipe across me"
          swiped: "Swiped %{direction}"
