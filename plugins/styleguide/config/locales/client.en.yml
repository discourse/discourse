          tree:
            label: "Source tree"
            example: "Tree"
            example_description: "The cursor runs over the rows that are visible right now, so collapsing a parent removes its children from the sequence. Expand and collapse are handled beside the modifier, not by it."
            try_this: "Arrow up and down the rows, then use the right and left arrows on a parent to open and close it. Collapse a parent and notice that its children leave the cursor with it."
            rtl_example: "Tree, right to left"
            rtl_description: "The same component under a right-to-left direction. Expand and collapse are read as physical keys here, so the arrow that points at a row's children is no longer the one that opens them. Resolving the direction logically instead would swap the two."
            rtl_try_this: "Open and close a parent with the right and left arrows, and compare which side the children appear on with which arrow revealed them."
