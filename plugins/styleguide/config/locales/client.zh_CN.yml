        shortcut:
          title: "快捷键"
          description: "一种显示和播报键盘快捷键的方法。`formatShortcut` 将拼写键绑定转换为绘制的标签和 `aria-keyshortcuts` 值；`DShortcut` 将其绘制为芯片，并且给定一个块，会生成这两种形式，因此一个元素不能绘制一种快捷键并播报另一种。"
          keycaps_example: "绘制快捷键"
          keycaps_description: "`<DShortcut @keys>` 会为每个快捷键绘制一个芯片。按键的拼写方式与绑定键相同：`+`-连接，大小写均可，`mod` 表示平台的主要修饰键。修饰键的排列顺序与平台的顺序一致，字形修饰键会连在一起，并且每隔一个键会留出一个空隙。"
          keycaps_note: "在苹果平台上，修饰键以字形显示（例如 `⌘⇧ D`）；在其他平台上，它们则以文字显示（例如 `Ctrl Shift D`）。每个字形都隐藏着一个语音名称，因此当芯片本身显示完整功能时，它会显示为“Command Shift D”。"
          block_example: "在响应元素上播报"
          block_description: "`aria-keyshortcuts` 属性位于按键激活的元素上，只有调用者知道该元素。给定一个代码块，`DShortcut` 不会渲染任何自身元素，而是生成 `aria`、`label`、`keys` 和一个绑定的 `Kbd` 对象，因此按钮的语音提示和旁边的芯片都来自同一个拼写。由于按钮本身会提示快捷键，因此生成的芯片对辅助技术是隐藏的。"
          block_try_this: "屏幕阅读器运行时，将焦点对准按钮：它会读出按钮的名称一次，然后读出属性中的快捷方式，但永远不会读出芯片。"
          block_note: "宣布的形式是本地化的，并且是口语化的，而不是 ARIA 标记列表：读者逐字逐句地读出属性，因此在 Mac 上是“Command+B”，在其他地方是“Ctrl+B”，并且会说出读者通常会省略的标点符号（“句号”、“斜杠”）。"
          string_form_example: "仅支持字符串的场景"
          string_form_description: "`title`、`aria-label` 或下拉列表选项不能包含元素。直接调用 `formatShortcut`，并使用 `.label` 作为文本，`.aria` 作为属性；一次调用，一种拼写方式，两种形式都适用。"
          string_form_try_this: "将鼠标悬停在按钮上可查看工具提示；使用屏幕阅读器聚焦按钮可查看公告。"
          spellings_example: "拼写及其两种形式"
          spellings_description: "每个输入项解析为什么。`mod`、`meta`、`command` 和 `cmd` 都表示主要修饰符；`ctrl` 在所有平台上都对应 Control 键；`plus` 表示 `+` 键；箭头词及其 HTML 实体都绘制成箭头。"
          spellings_note: "只有显示的列会随界面语言而变化；绘制的列会随平台而变化。"
          keyboard_gate_example: "只有在有键盘的地方"
          keyboard_gate_description: "在手机上，快捷键只是噪音。`capabilities.hasKeyboard` 会根据精细的主指针或屏幕键盘从未发送过的按键事件来推断是否存在物理键盘，而如果没有它，`DShortcut` 就不会绘制或播报任何内容。`@always` 则选择不执行此操作，因为该表面仅用于记录按键信息。"
          keyboard_gate_try_this: "在手机上打开此页面：默认芯片会消失，而 `@always` 芯片会保留。配对键盘并按下修饰键，默认芯片就会出现，无需重新加载页面。"
          keyboard_gate_note: "除了键盘快捷键帮助模态框和此页面之外，网站上的所有快捷方式都受到限制。"
