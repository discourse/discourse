          dwell_try_this: "将标签拖到折叠的文件夹上方并按住，直到文件夹打开，然后将其放入其中。或者将其拖开，然后看着它再次关闭。"
          dwell_note: "每次鼠标悬停时，该功能都会触发一次并打开文件夹。将芯片放入文件夹内即可保持文件夹打开状态；拖动或松开鼠标即可关闭该文件夹。"
          dwell_filed:
            other: "归档 %{count} 标签"
          dwell_expand: "显示行"
          dwell_collapse: "隐藏行"
          row: "行 %{number}"
          separator_title: "调整区域间大小"
          separator_description: "`DResizeSeparator` 组件是首先需要用到的。它封装了 `dResizeEdge` 修饰符，并添加了分隔符契约：角色、一个制表位和实时公布的值。"
          separator_try_this: "拖动分隔线，然后选中它并使用方向键。"
          separator_note: "必须添加标签：没有可访问名称的可聚焦分隔符会被标记为裸分隔符，这并没有说明它会调整什么大小。"
          separator_label: "调整窗格大小"
          left_pane: "左"
          right_pane: "右"
          edge_title: "使用您自己的元素调整大小"
          edge_description: "`dResizeEdge` 是 `DResizeSeparator` 下的修饰符。它负责交互，除此之外别无其他，因此角色、制表位和声明的值都由您自行设定。"
          edge_try_this: "拖动分隔线，然后选中它并使用方向键。操作方式相同；区别在于标记的格式。"
          edge_note: "只有当你已经完全掌握了元素及其语义时，才应该使用它。本例中列出的所有内容，都是组件本身能够提供的。"
          edge_label: "调整窗格大小"
          handles_title: "调整盒子大小"
          handles_description: "`DResizeHandles` 是一个组件，用于渲染盒子的边缘和角，并报告指针几何形状，供用户转换为尺寸。"
          handles_try_this: "拖动任意边或角。"
          handles_note: "不要将二维调整大小控件设置为分隔符角色。它没有具体的值需要声明，因此该角色描述的是一个不存在的控件。"
          pointer_drag_title: "追踪指针"
          pointer_drag_description: "`dPointerDrag` 会按下、移动并释放一个元素。它不会传递任何内容，也没有目标。"
          pointer_drag_try_this: "沿着轨道拖动旋钮。"
          pointer_drag_note: "务必处理取消回调。否则，浏览器中断的操作会导致之前打开的页面仍然保持打开状态。"
          knob: "旋钮"
          swipe_title: "检测到轻微晃动"
          swipe_description: "`dSwipe` 报告的是一个离散的方向和速度，而不是跟随指针的值。"
          swipe_try_this: "在触摸屏上滑动面板。"
          swipe_note: "当需要持续跟踪指针时，请使用指针拖动。"
          swipe_here: "向我滑动"
          swiped: "滑动 %{direction}"
