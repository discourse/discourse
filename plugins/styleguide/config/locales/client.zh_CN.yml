            try_this: "切换到地图后，你会发现自己进入了地图区域，而不是筛选器区域。将光标移到地图起点，然后按左箭头键进入筛选器区域，在筛选器之间来回移动，最后越过最后一个筛选器区域即可返回地图区域。"
            open: "已打开"
            mine: "我的"
            recent: "最近"
          listbox:
            label: "水果"
            example: "带自动补全功能的列表框"
            example_description: "输入内容后，光标会移动到名称以所输入内容开头的选项上，这与练习页面指定的选项名称以及屏幕阅读器朗读的内容一致。每个选项旁边的计数仅供参考，它属于该行的文本，但不属于该选项的名称。"
            try_this: "使用方向键浏览选项，然后输入字母，例如 b。反复按 a 键浏览所有首字母相同的选项，然后暂停并输入 apr，即可直接找到 Apricot。输入数字不会匹配任何选项，因为数字计数不属于任何名称的一部分。"
            apple: "Apple"
            apricot: "杏"
            banana: "香蕉"
            blackberry: "黑莓"
            cherry: "樱桃"
            coconut: "椰子"
          combobox:
            label: "电子邮件摘要"
            example: "光标未聚焦"
            example_description: "控件在箭头移动选项时保持焦点，并且控件会报告高亮显示的位置，而不是浏览器自动移动到该位置。这是练习页面描述的两种策略中的第二种，也是组合框所需要的策略，以便读者可以继续输入。"
            try_this: "打开列表，用方向键浏览，同时注意对焦环：它会始终停留在按钮上。按 Enter 键选择，按 Esc 键或再次单击关闭。"
            daily: "每天"
            weekly: "每周"
            monthly: "每月"
            never: "从不"
          radio:
            label: "对齐"
            example: "单选组"
            example_description: "单选按钮组使用 aria-checked 而非 aria-selected 标记其选中状态，进入该组后会跳转到选中的项，而不是第一个项。移动光标也会移动选中的项，这是唯一符合预期的情况。"
            try_this: "切换到该组，你会发现它出现在已选中的成员身上。沿着它移动光标，你会看到选项随之变化。切换出去再切换回来，即可回到新的选项。"
            left: "左"
