            right: "右"
            inside: "里面"
          types_title: "按类型匹配"
          types_description: "`dDragAndDropSource` 指定拖放源类型，`dDragAndDropTarget` 则根据该类型进行筛选。目标对象仅对接受列表中的类型有效；其他类型的拖放操作会直接覆盖目标对象。"
          types_try_this: "将每个筹码拖到指定区域。只取走对应的牌。"
          types_note: "省略“接受”会接受所有已注册的源，但这很少是真实表面所需要的。"
          positions_title: "空位"
          positions_description: "`dDragAndDropTarget` 在兼容的拖拽操作覆盖目标时，会绘制以下类之一：四个同级位置和一个容器位置。"
          positions_note: "位置设置符合逻辑。在从右到左的行中，“之前”仍然表示阅读顺序的开始，并且类会切换到“--drag-right”，因此指示器会保持在指针下方。"
          axis_title: "跨度测量"
          axis_description: "`dDragAndDropTarget` 接受一个轴参数，该轴选择中点来区分前后。一行列用于水平测量。"
          axis_try_this: "将光标分别拖放到一列的左右两半，并比较所显示的位置。"
          fixed_position_title: "固定位置"
          fixed_position_description: "`dDragAndDropTarget` 给定一个位置时会完全跳过中点，并始终报告该位置。"
          fixed_position_try_this: "底部边缘掉落。之前仍然会报告。"
          always_before: "总是先汇报"
          handle_title: "用把手拖拽"
          handle_description: "`dDragAndDropSource` 接受一个 dragHandle，它限制了拖动的起始位置，以便元素的其余部分保持可选状态，并且旨在滚动的触摸按压仍然可以滚动。"
          handle_try_this: "用指针选中文本，然后拖动控制点。"
          handle_note: "该行始终是拖拽对象：它保留了 data-drag-source 属性，是目标元素的源元素，也是预览所拍摄的对象。样式和断言应基于 data-drag-source 属性，切勿基于 draggable 属性。"
          handle_landed: "落位的是整行元素，而非拖拽把手"
          selectable_text: "可选文本"
          preview_title: "自定义预览"
          preview_description: "`dDragAndDropSource` 接受一个 dragPreview 渲染函数，该函数将预览挂载到一个隔离的屏幕外容器中，这样源周围的任何内容都不会渗入到拖动图像中。"
          preview_try_this: "拖动芯片，观察指针后方发生的变化。"
          preview_badge: "自定义预览"
          disabled_title: "分离源"
          disabled_description: "`dDragAndDropSource` 接受 disabled 参数，该参数会解除注册。只有这样才能阻止元素被拖动，而不是通过句柄。"
          disabled_try_this: "关闭电源，尝试拖动，然后再打开电源。"
          draggable: "可拖动"
          effect_title: "宣布效果"
          effect_description: "`dDragAndDropTarget` 指定了它将通过 dropEffect 执行的操作，拖拽操作会将该效果应用到目标记录中。"
          effect_try_this: "在每个区域上拖放并比较录制的效果。"
          effect_note: "源的 effectAllowed 声明了它允许什么，但这里没有任何机制强制执行：目标可以请求源从未允许的效果，并且不会遭到拒绝。请自行确保两者的一致性。"
          asks_for_copy: "要求复制"
          asks_for_move: "要求移动"
          recorded_effect: "记录效果： %{effect}"
          nesting_title: "嵌套目标"
          nesting_description: "`dDragAndDropTarget` 将回调传递给指针下最深的已接受目标，因此一个拖放操作永远不会被处理两次。"
          nesting_try_this: "落在内部区域，然后放在周围的外部区域。"
          nesting_note: "代价是，一旦后代元素获取了拖拽权限，祖先元素就会停止指示。需要保持点亮状态的容器应该改为从服务中渲染。"
          outer: "外部"
          inner: "内部"
          received_by: "收件人： %{name}"
          accepts_self_title: "拒绝自身"
          accepts_self_description: "`dDragAndDropTarget` 接受 acceptsSelf 参数。默认情况下，既是源又是目标的元素会接受自身的拖放请求，因为这通常更有意义。"
          accepts_self_try_this: "将一张卡片先叠在自己上面，再叠在另一张卡片上。"
          accepts_self_note: "比较对象是拖拽主体，因此由手柄拖拽的行仍然会被识别为它本身。"
          card_a: "卡片 A"
          card_b: "卡片 B"
          dropped_card: "掉落的卡片 %{name}"
          can_drop_title: "因有效载荷而拒绝"
          can_drop_description: "`dDragAndDropTarget` 接受 canDrop 参数，这是一个同步门，用于检查有效负载并在其落地前拒绝放置操作。"
          can_drop_try_this: "将每枚筹码拖动到相应区域。被锁定的筹码绝不会被接受。"
          unlocked: "已解锁"
          locked: "已锁定"
          unlocked_only: "仅解锁"
          adoption_title: "采用页面内容"
          adoption_description: "`dDragAndDropTarget` 接受引用。浏览器开始拖拽普通内容（例如链接），这些内容没有注册来源，而引用机制允许目标也接受这些内容。"
          adoption_try_this: "将上方链接拖入该区域。"
          adoption_note: "页面采用该属性只需解析一次，而非针对每个目标：第一个生效且谓词匹配的采用属性会命名拖拽对象。两个名称相同的采用属性必须具有相同的谓词。"
          a_link: "本页上的链接"
          drop_a_link: "在这里留下链接"
          external_title: "从外面掉下来"
          external_description: "`dDragAndDropExternalTarget` 接收从其他窗口或应用程序拖入的有效负载。它不会接收从当前页面开始的拖放操作。"
          external_try_this: "将其他标签页中的链接或桌面上的文件拖到该区域。"
          external_note: "这不是上传路径。拖放到这里的文件不会进入上传验证、进度跟踪或上传记录。"
          from_outside: "从窗外掉下来"
          external_axis_title: "外部插槽"
          external_axis_description: "`dDragAndDropExternalTarget` 给定一个轴，会根据指针解析出一个位置，就像元素目标一样。"
          external_axis_try_this: "在靠近顶部边缘的地方丢一些东西，然后在靠近底部的地方丢一些东西。"
          external_axis_note: "未指定位置或坐标轴时，目标为单一放置点而非插槽：回调函数将收到空位置值，拖放指示仅使用--drag-over-external这一类名。"
          a_slot: "插槽，不是目的地"
          monitor_title: "观看每一次拖拽"
          monitor_description: "`dDragAndDropMonitor` 会对任何位置发生的拖拽操作做出反应，但自身不会成为放置目标。"
          monitor_try_this: "拖动标签并观察日志，无论是否将其放置到投放区域内。"
          monitor_note: "该元素仅锚定修饰符的生命周期。监视器是全局的。"
          service_title: "从状态渲染"
          service_description: "`dragAndDrop` 服务将正在拖动的操作作为跟踪状态公开，因此表面无需连接任何回调即可自行启动。"
          service_try_this: "开始拖动标签并观察面板，不要松手。"
          service_note: "该服务从目标的角度读取信息：空的或缺失的过滤器不会匹配任何内容，因为尚未做出决定的调用者不应该在每次拖动时都点亮。"
          armed: "卡片正在拖拽中"
          idle: "空闲的"
          auto_scroll_title: "拖动时滚动"
          auto_scroll_description: "`dDragAndDropAutoScroll` 会在拖动操作悬停在容器边缘附近时滚动容器，以便保持首屏下方的行可访问。"
          auto_scroll_try_this: "将标签拖到列表的底部边缘并按住不放。"
          dwell_title: "悬停停留以展开"
