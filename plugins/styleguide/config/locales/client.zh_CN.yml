            example_description: "光标会移动到当前可见的行上，因此折叠父级会将其子级从序列中移除。展开和折叠操作来自交叉轴事件，该事件会将此组未导航的箭头作为方向报告，至于该方向的具体含义，则留给示例说明。"
            try_this: "使用上下箭头键浏览行，然后使用左右箭头键展开和折叠父级元素。折叠父级元素时，你会发现它的子级元素会跟随光标一起离开。"
            rtl_example: "树，从右到左"
