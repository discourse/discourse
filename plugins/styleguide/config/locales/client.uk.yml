          dwell_try_this: "Перетягніть фішку на згорнуту папку й утримуйте її там, доки папка не відкриється, а потім відпустіть її всередині. Або відтягніть фішку, і папка знову закриється."
          dwell_note: "При наведенні курсора на папку вона активується один раз і відкривається. Якщо кинути чіп всередину, папка залишиться відкритою; якщо перетягнути курсор або припинити перетягування, папка, відкрита таким чином, закриється."
