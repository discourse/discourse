          preview_description: "`dDragAndDropSource` приймає функцію візуалізації dragPreview, яка розміщує попередній перегляд в ізольованому позаекранному контейнері, щоб ніщо з оточення джерела не потрапляло на зображення, що перетягується."
          preview_try_this: "Перетягніть фішку і подивіться, що рухається слідом за курсором."
          preview_badge: "Користувацький попередній перегляд"
