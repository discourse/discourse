          fixed_position_title: "Фіксована позиція"
          fixed_position_description: "`DDragAndDropTarget`, коли задана позиція, повністю пропускає середню точку і завжди повідомляє цю позицію."
          fixed_position_try_this: "Скидання на нижню сторону. Вона завжди означає донизу."
          always_before: "Завжди означає до"
          handle_title: "Перетягування за ручку"
          handle_description: "`dDragAndDropSource` приймає параметр dragHandle, який обмежує область, з якої може починатися перетягування, завдяки чому решта елемента залишається доступною для виділення, а натискання пальцем, призначене для прокрутки, як і раніше, забезпечує прокрутку."
          handle_try_this: "Виділіть текст за допомогою вказівника, а потім перетягніть ручку."
          handle_note: "Рядок залишається об’єктом перетягування: він містить атрибут data-drag-source, є element джерела для цільового елемента та відображається у попередньому перегляді. Застосовуйте стилі та перевіряйте наявність атрибута data-drag-source, а не атрибута draggable."
