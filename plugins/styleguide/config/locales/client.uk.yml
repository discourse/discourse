        shortcut:
          title: "Гарячі клавіші"
          description: "Один зі способів показати комбінацію клавіш та оголошувати її. formatShortcut перетворює використані прив'язки клавіш для перевірки правопису на намальовану мітку та значення aria-keyshortcuts; DShortcut малює її як чіп і, якщо задано блок, повертає обидві форми, тому елемент не може відображати одну комбінацію клавіш та оголошувати іншу."
          keycaps_example: "Нанесення ярлика"
          keycaps_description: "`<DShortcut @keys>` малює по одній фішці на ярлик. Пишіть ключі так, як це робить прив'язка: `+`-jointed, у будь-якому випадку, з `mod` для основного модифікатора платформи. Модифікатори перераховані у власному порядку платформи незалежно від написання, модифікатори гліфів працюють разом, а кожен інший ключ зберігає пробіл."
          keycaps_note: "На платформах Apple модифікатори малюють як гліфи (`⌘⇧ D`); в інших випадках вони малюють як слова (`Ctrl Shift D`). Кожен гліф містить візуально приховану вимовлену назву, тому чіп читається як \"Command Shift D\", коли він є самостійним контентом."
          block_example: "Оголошення про елемент, який реагує"
          block_description: "`aria-keyshortcuts` належить елементу, який активують клавіші, і який знає лише той, хто викликає. Враховуючи блок, `DShortcut` не відтворює власних елементів і повертає `aria`, `label`, `keys` та зв'язаний `Kbd`, тому оголошення кнопки та чіп поруч із нею походять з одного написання. Отриманий чіп прихований від допоміжних технологій, оскільки кнопка сама оголошує про комбінацію клавіш."
          block_try_this: "Фокусуйте кнопку, коли запущено програму зчитування з екрана: вона зчитує її назву один раз, потім комбінацію клавіш з атрибута, але ніколи сам чіп."
          block_note: "Оголошена форма локалізована та озвучена, а не список токенів ARIA: читачі вимовляють атрибут дослівно, тому на Mac відображається `Command+B`, а в інших місцях — `Ctrl+B`, а також називаються розділові знаки (`Крапка`, `Слеш`), які читачі інакше пропустили б."
          string_form_example: "Де лише рядок відповідає"
          string_form_description: "`title`, `aria-label` або параметр select не можуть містити елемент. Викличте `formatShortcut` безпосередньо та використовуйте `.label` для тексту та `.aria` для атрибута; один виклик, одне написання, обидві форми."
          string_form_try_this: "Наведіть курсор на кнопку, щоб побачити підказку; сфокусуйте її за допомогою програми зчитування з екрана для оголошення."
          spellings_example: "Орфографія та її дві форми"
          spellings_description: "Те, до чого призводить кожен вхідний сигнал. `mod`, `meta`, `command` та `cmd` означають основний модифікатор; `ctrl` залишається клавішею Control на кожній платформі; `plus` називає клавішу `+`; слова зі стрілками та їхні HTML-сутності малюються як стрілки."
          spellings_note: "Тільки оголошений стовпець змінюється залежно від мови інтерфейсу; намальований стовпець змінюється залежно від платформи."
          keyboard_gate_example: "Тільки там, де є клавіатура"
          keyboard_gate_description: "Ярлик - це шум на телефоні. `Capabilities.hasKeyboard` робить висновок про фізичну клавіатуру з тонкого основного вказівника або з клавіатури, яку екранна клавіатура ніколи не надсилає, а `dShortcut` нічого не малює і не повідомляє без неї. `@always` відмовляється, для поверхонь, які існують для документування ключів."
          keyboard_gate_try_this: "Відкрийте цю сторінку на телефоні: чіп за замовчуванням зникає, а чіп `@always` залишається. Підключіть клавіатуру та натисніть клавішу-модифікатор, і чіп за замовчуванням з’являється без перезавантаження."
