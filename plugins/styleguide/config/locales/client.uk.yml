          positions_title: "Зниження позицій"
          positions_description: "`dDragAndDropTarget` відображає саме один із цих класів, коли над ним знаходиться сумісний об’єкт, що перетягується: чотири позиції рівноправних елементів плюс одна позиція контейнера."
          positions_note: "Розташування є логічним. У рядку, що читається справа наліво, «before still» означає початок порядку читання, і клас змінюється на --drag-right, тому індикатор залишається під курсором."
          axis_title: "Вимірювання по ширині"
          axis_description: "`DDragAndDropTarget` приймає вісь, яка вибирає середню точку, яка визначає до та після. Рядок стовпців вимірюється горизонтально."
