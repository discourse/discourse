            labels: "Pola są oznaczone etykietami"
          adjacent:
            label: "Filtry"
            field: "Szukaj"
            placeholder: "Szukaj tematów"
            example: "Grupa Tab nie dociera"
            example_description: "Filtry nie znajdują się w sekwencji tabulacji, więc klawisz Tab prowadzi bezpośrednio do pola, a para liczy się jako jeden komponent, a nie dwa. Do filtrów dociera się strzałką od początku pola, a po wyjściu z ich końca wraca się do niego. Modyfikator zgłasza krawędź i kierunek; to, dokąd dalej pójść, zależy od tego przykładu, ponieważ tylko on wie, że pole istnieje."
            try_this: "Wejdź i zauważ, że lądujesz na polu, a nie filtry. Z karetką na początku naciśnij strzałkę w lewo, aby wejść w nie, strzałkę między nimi, a następnie przejdź obok ostatniej, aby wrócić do pola."
            open: "Otwórz"
            mine: "Kopalnia"
            recent: "Ostatnie"
          listbox:
            label: "Owoc"
            example: "Lista rozwijana z funkcją wpisywania z wyprzedzeniem"
            example_description: "Wpisywanie przenosi kursor do opcji, której nazwa zaczyna się od wpisanego tekstu, czyli tego, co określa strona ćwiczeń i co odczytuje czytnik ekranu. Liczba obok każdej opcji ma charakter dekoracyjny, więc należy do tekstu wiersza, a nie do jego nazwy."
            try_this: "Przewiń opcje strzałką, a następnie wpisz literę, taką jak b. Naciskaj a kilkakrotnie, aby przejść do opcji z tym samym inicjałem, a następnie zatrzymaj się i wpisz apr, aby przejść bezpośrednio do Apricot. Wpisanie cyfry nic nie da, ponieważ liczby nie są częścią żadnej nazwy."
            apple: "Jabłko"
