          description: "Nawigacja za pomocą klawiatury w złożonym widżecie, zbudowana z prostego, semantycznego kodu HTML, dzięki czemu wszelkie nieprawidłowości są modyfikatorem, a nie komponentem go otaczającym. Wzorce odzwierciedlają interaktywne przykłady z podręcznika WAI-ARIA Authoring Practices."
