            example: "Usuwanie elementu znajdującego się pod kursorem"
            example_description: "Każdy znacznik to prawdziwy przycisk, więc usunięcie go niszczy element, na którym znajduje się kursor, a przycisk wykonuje swoją akcję o jeden punkt później niż klawisz, który go wywołał. Kursor przesuwa się do następnego znacznika, zamiast pozwolić, aby fokus spadł na stronę."
            try_this: "Przesuń kursor do znacznika w środku i naciśnij Enter, aby go usunąć, a następnie sprawdź, gdzie przesunął się kursor. Usuń ostatni znacznik w wierszu, a kursor przesunie się do tyłu. Usuń wszystkie znaczniki, a kursor zatrzyma się, zamiast zgadywać."
