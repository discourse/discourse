              description: "Ten sam kursor nad prawdziwymi przyciskami, pod którymi niszczone są przedmioty."
          toolbar:
            label: "Formatowanie tekstu"
            example: "Pasek narzędzi"
            example_description: "Cały pasek to jeden tabulator. Aktywacja jest przypisana do przycisków natywnych, a nie do modyfikatora, więc Enter i Spacja zachowują się dokładnie tak samo, jak bez niego. Kopiowanie i wklejanie są wyłączone na dwa różne sposoby, które rozróżnia strona ćwiczeń, a kursor traktuje je w związku z tym inaczej."
            try_this: "Wciśnij Tab, a następnie strzałkę wzdłuż paska. Home i End docierają do końców. Strzałka obok Wytnij i Wklej: Wytnij jest pomijane, podczas gdy Wklej można odczytać i odczytać, ale po aktywacji nic się nie dzieje."
