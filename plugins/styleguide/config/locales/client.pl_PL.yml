            banana: "Banan"
            blackberry: "Jeżyna"
            cherry: "Wiśnia"
            coconut: "Kokos"
          combobox:
            label: "Podsumowanie wiadomości e-mail"
            example: "Kursor bez skupienia"
            example_description: "Kontrolka utrzymuje fokus, podczas gdy strzałki przesuwają podświetlenie między opcjami, a kontrolka raportuje położenie tego podświetlenia, zamiast przesuwać przeglądarkę do niego. To druga z dwóch strategii opisanych na stronie ćwiczeń, a także ta, której potrzebuje pole kombi, aby czytelnik mógł kontynuować pisanie."
            try_this: "Otwórz listę i przeglądaj ją, obserwując pierścień ostrości: pozostaje on na przycisku. Naciśnij Enter, aby wybrać, i Esc lub inne kliknięcie, aby zamknąć."
