          landed: "Upuszczono: %{label}"
          reported_position: "Zgłoszona pozycja: %{position}"
          positions:
            above: "Powyżej"
            below: "Poniżej"
            left: "Po lewej"
            right: "Po prawej"
            inside: "Wewnątrz"
          types_title: "Dopasowanie według typu"
          types_description: "`dDragAndDropSource` nadaje nazwę typowi, a `dDragAndDropTarget` filtruje go. Cel jest aktywowany tylko dla typów z listy akceptowanych; wszystkie inne są przeciągane bezpośrednio nad nim."
          types_try_this: "Przeciągnij każdy żeton na strefę. Zabrana zostanie tylko karta."
          types_note: "Pominięcie opcji „akceptuje” powoduje zaakceptowanie każdego zarejestrowanego źródła, co rzadko jest tym, czego potrzebuje prawdziwa powierzchnia."
          positions_title: "Pozycje upuszczania"
          positions_description: "`dDragAndDropTarget` rysuje dokładnie jedną z tych klas, gdy przeciągany jest nad nią zgodny obiekt: cztery pozycje siostrzane plus jedna pozycja kontenera."
          positions_note: "Pozycje są logiczne. W wierszu od prawej do lewej, „przed” nadal oznacza początek kolejności czytania, a klasa zmienia się na „--drag-right”, więc wskaźnik pozostaje pod kursorem."
          axis_title: "Pomiar poprzeczny"
          axis_description: "`dDragAndDropTarget` przyjmuje oś, która wybiera punkt środkowy decydujący o tym, czy obiekt znajduje się przed, czy po. Rząd kolumn mierzy poziomo."
          axis_try_this: "Upuść lewą i prawą połowę jednej kolumny i porównaj podane pozycje."
          fixed_position_title: "Stała pozycja"
          fixed_position_description: "`dDragAndDropTarget` biorąc pod uwagę pozycję całkowicie pomija punkt środkowy i zawsze go raportuje."
          fixed_position_try_this: "Upuść na dolną krawędź. Nadal zgłasza się wcześniej."
          always_before: "Zawsze zgłasza to wcześniej"
          handle_title: "Przeciąganie za uchwyt"
          handle_description: "`dDragAndDropSource` przyjmuje dragHandle, który ogranicza miejsce rozpoczęcia przeciągania, dzięki czemu reszta elementu pozostaje możliwa do wybrania, a naciśnięcie dotykowe mające na celu przewijanie nadal powoduje przewijanie."
          handle_try_this: "Zaznacz tekst za pomocą wskaźnika i przeciągnij uchwyt."
          handle_note: "Wiersz pozostaje elementem przeciągania: zachowuje dane-przeciąganie-źródło, jest elementem źródłowym celu i jest tym, co pokazuje podgląd. Styl i potwierdzenie są na danych-przeciąganie-źródło, a nie na przeciąganym."
          handle_landed: "Rząd wylądował, nie chwyt."
          selectable_text: "Tekst do zaznaczenia"
          preview_title: "Niestandardowy podgląd"
          preview_description: "`dDragAndDropSource` przyjmuje funkcję renderowania dragPreview, która montuje podgląd w odizolowanym kontenerze poza ekranem, tak aby nic wokół źródła nie przenikało do obrazu przeciągania."
          preview_try_this: "Przeciągnij chip i obserwuj, co podąża za wskaźnikiem."
          preview_badge: "Podgląd niestandardowy"
          disabled_title: "Odłączanie źródła"
          disabled_description: "`dDragAndDropSource` przyjmuje wartość disabled, która odłącza rejestrację. To, a nie uchwyt, służy do zatrzymania przeciągania elementu."
          disabled_try_this: "Wyłącz go, spróbuj przeciągnąć, a następnie włącz go ponownie."
          draggable: "Przeciągany"
          effect_title: "Deklarowanie efektu"
          effect_description: "`dDragAndDropTarget` określa operację, która zostanie wykonana za pomocą dropEffect, a przeciągnięcie przenosi ten efekt na rekord docelowy."
          effect_try_this: "Spuść na każdą strefę i porównaj zarejestrowany efekt."
          effect_note: "Zmienna effectAllowed źródła deklaruje, na co zezwala, ale nic tutaj nie egzekwuje tej pary: cel może poprosić o efekt, na który źródło nigdy nie zezwoliło, i nie następuje żadna odmowa. Sam zachowaj spójność tych dwóch elementów."
          asks_for_copy: "Prosi o kopię"
          asks_for_move: "Prosi o przeniesienie"
          recorded_effect: "Nagrano efekt: %{effect}"
          nesting_title: "Zagnieżdżone cele"
          nesting_description: "`dDragAndDropTarget` przekazuje wywołania zwrotne do najgłębszego akceptowanego celu pod wskaźnikiem, więc jedno upuszczenie nigdy nie jest obsługiwane dwa razy."
          nesting_try_this: "Upuść na strefę wewnętrzną, a następnie na strefę zewnętrzną dookoła niej."
          nesting_note: "Kosztem jest to, że przodek przestaje wskazywać, gdy tylko potomek zgłasza przeciągnięcie. Pojemnik, który musi pozostać zapalony, powinien zostać wycofany z usługi."
          outer: "Zewnętrzny"
          inner: "Wewnętrzny"
          received_by: "Odbiorca: %{name}"
          accepts_self_title: "Odmawia sobie"
          accepts_self_description: "`dDragAndDropTarget` przyjmuje acceptsSelf. Element, który jest zarówno źródłem, jak i celem, domyślnie akceptuje własne upuszczenie, ponieważ często ma to sens."
          accepts_self_try_this: "Połóż jedną kartę na drugiej, a następnie na drugiej."
          accepts_self_note: "Porównanie jest wykonane w odniesieniu do przeciąganego obiektu, więc wiersz przeciągany za uchwyt jest nadal rozpoznawany jako ten sam."
          card_a: "Karta A"
          card_b: "Karta B"
          dropped_card: "Upuszczona karta %{name}"
          can_drop_title: "Odmowa przez ładunek"
          can_drop_description: "`dDragAndDropTarget` korzysta z canDrop, bramki synchronicznej, która sprawdza ładunek i odmawia jego zrzucenia przed lądowaniem."
          can_drop_try_this: "Przeciągnij każdy żeton nad strefą. Zablokowany żeton nigdy nie zostanie zaakceptowany."
          unlocked: "Odblokowany"
          locked: "Zablokowano"
          unlocked_only: "Tylko odblokowane"
          adoption_title: "Przyjmowanie treści strony"
          adoption_description: "`dDragAndDropTarget` przyjmuje adopcje. Przeglądarka rozpoczyna przeciąganie zwykłej zawartości, takiej jak link, która nie rejestruje źródła, a adopcja pozwala obiektowi docelowemu również na jej przyjęcie."
          adoption_try_this: "Przeciągnij powyższy link do strefy."
          adoption_note: "Adopcja jest rozstrzygana jednorazowo dla strony, a nie dla każdego celu: pierwsza aktywna adopcja, której predykat pasuje do nazwy, jest przeciągana. Dwie adopcje o tej samej nazwie muszą mieć wspólny predykat."
          a_link: "Link na tej stronie"
          drop_a_link: "Upuść tutaj link"
          external_title: "Opuszczenie z zewnątrz"
          external_description: "`dDragAndDropExternalTarget` pobiera ładunki przeciągnięte z innego okna lub aplikacji. Nigdy nie widzi przeciągania rozpoczętego na tej stronie."
          external_try_this: "Przeciągnij do strefy łącze z innej karty lub plik z pulpitu."
          external_note: "To nie jest ścieżka przesyłania. Plik przeniesiony tutaj nie zostanie zapisany w procesie walidacji przesyłania, w trakcie przesyłania ani w rekordzie przesyłania."
          from_outside: "Upuść spoza okna"
          external_axis_title: "Zewnętrzny slot"
          external_axis_description: "`dDragAndDropExternalTarget` mając daną oś ustala położenie na podstawie wskaźnika, tak jak robi to element docelowy."
          external_axis_try_this: "Upuść coś blisko górnej krawędzi, a następnie blisko dolnej."
          external_axis_note: "Bez pozycji lub osi celem jest jeden punkt docelowy, a nie slot: wywołania zwrotne otrzymują pustą pozycję, a wskaźnikiem jest pojedyncza klasa --drag-over-external."
          a_slot: "Miejsce docelowe, nie cel"
          monitor_title: "Oglądanie każdego przeciągnięcia"
          monitor_description: "`dDragAndDropMonitor` reaguje na przeciągnięcie w dowolnym miejscu, nie stając się jednocześnie celem upuszczenia."
          monitor_try_this: "Przeciągnij żeton i obserwuj dziennik, niezależnie od tego, czy upuścisz go w strefie, czy nie."
          monitor_note: "Element ten jedynie zakotwicza cykl życia modyfikatora. Monitor jest globalny."
          service_title: "Renderowanie ze stanu"
          service_description: "Usługa `dragAndDrop` udostępnia przeciąganie w trakcie lotu jako śledzony stan, dzięki czemu powierzchnia może uzbroić się sama bez konieczności podłączania żadnego wywołania zwrotnego."
          service_try_this: "Zacznij przeciągać układ i obserwuj panel, nie upuszczając go."
          service_note: "Usługa działa w odwrotny sposób: pusty lub brakujący filtr nie pasuje do niczego, ponieważ obiekt wywołujący, który nie podjął jeszcze decyzji, nie powinien świecić się przy każdym przeciągnięciu."
          armed: "Karta jest w locie"
          idle: "Bezczynny"
          auto_scroll_title: "Przewijanie podczas przeciągania"
          auto_scroll_description: "`dDragAndDropAutoScroll` przewija kontener, gdy przeciągany obiekt znajduje się w pobliżu jego krawędzi, dzięki czemu wiersz poniżej zagięcia pozostaje dostępny."
          auto_scroll_try_this: "Przeciągnij żeton na dolną krawędź listy i przytrzymaj go tam."
          dwell_title: "Przebywanie, aby ujawnić"
          dwell_description: "`dDragDwell` wywołuje funkcję zwrotną, gdy przeciągnięcie zatrzyma element na chwilę, nie czyniąc elementu celem upuszczenia."
          dwell_try_this: "Przeciągnij żeton nad zwinięty folder i przytrzymaj go, aż się otworzy, a następnie upuść go w środku. Możesz też przeciągnąć go dalej i zobaczyć, jak się zamyka."
          dwell_note: "Przesunięcie kursora uruchamia się raz po najechaniu kursorem i otwiera folder. Upuszczenie żetonu do środka utrzymuje go otwartym; przeciągnięcie lub zakończenie przeciągania zamyka folder otwarty przez przesunięcie kursora."
          dwell_filed:
            one: "Złożono %{count} żeton"
            few: "Złożono %{count} żetony"
            many: "Złożono %{count} żetonów"
            other: "Złożono %{count} żetonów"
          dwell_expand: "Pokaż wiersze"
          dwell_collapse: "Ukryj wiersze"
          row: "Wiersz %{number}"
          separator_title: "Zmiana rozmiaru między regionami"
          separator_description: "Komponent `DResizeSeparator` to pierwszy komponent, po który należy sięgnąć. Opakowuje on modyfikator `dResizeEdge` i dodaje kontrakt separatora: rolę, jeden tabulator i wartości ogłaszane na żywo."
          separator_try_this: "Przeciągnij separator, ustaw na nim ostrość i użyj klawiszy strzałek."
          separator_note: "Wymagana jest etykieta: separator, który można ustawić w pozycji fokusu i nie ma dostępnej nazwy, jest ogłaszany jako pusty dzielnik, który nie mówi nic o tym, co zmienia rozmiar."
          separator_label: "Zmień rozmiar paneli"
          left_pane: "Po lewej"
          right_pane: "Po prawej"
          edge_title: "Zmiana rozmiaru za pomocą własnego elementu"
          edge_description: "`dResizeEdge` to modyfikator pod `DResizeSeparator`. Jest właścicielem interakcji i niczego więcej, więc rolę, tabulator i ogłaszane wartości możesz podać sam."
          edge_try_this: "Przeciągnij separator, ustaw na nim fokus i użyj klawiszy strzałek. Działa tak samo; różnica polega na tym, co jest w znaczniku."
          edge_note: "Sięgnij po niego tylko wtedy, gdy element i jego semantyka są już gotowe do udostępnienia. Wszystko, co zostało opisane w tym przykładzie, to to, co dałby Ci komponent."
          edge_label: "Zmień rozmiar paneli"
          handles_title: "Zmiana rozmiaru pola"
          handles_description: "`DResizeHandles` to komponent, który renderuje krawędzie i rogi pola oraz raportuje geometrię wskaźnika, którą użytkownik może przekształcić w rozmiar."
          handles_try_this: "Przeciągnij dowolną krawędź lub róg."
          handles_note: "Nie przypisuj roli separatora do dwuwymiarowej zmiany rozmiaru. Nie ma ona pojedynczej wartości do ogłoszenia, więc rola opisywałaby kontrolkę, która nie istnieje."
          pointer_drag_title: "Śledzenie wskaźnika"
          pointer_drag_description: "`dPointerDrag` naciska, przesuwa i zwalnia jeden element. Nie przenosi niczego i nie ma żadnych celów."
          pointer_drag_try_this: "Przeciągnij pokrętło wzdłuż ścieżki."
          pointer_drag_note: "Zawsze obsługuj wywołanie zwrotne anulowania. Gest przerwany przez przeglądarkę w przeciwnym razie pozostawi otwarty element początkowy."
          knob: "Pokrętło"
          swipe_title: "Wykrywanie ruchu"
          swipe_description: "`dSwipe` raportuje jeden dyskretny kierunek wraz z prędkością, a nie wartość podążającą za wskaźnikiem."
          swipe_try_this: "Przesuń palcem po panelu na ekranie dotykowym."
          swipe_note: "Jeśli wartość musi stale śledzić wskaźnik, należy zamiast tego zastosować przeciąganie wskaźnika."
          swipe_here: "Przesuń po mnie"
          swiped: "Przesunięto %{direction}"
