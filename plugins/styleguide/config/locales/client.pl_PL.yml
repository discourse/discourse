        shortcut:
          title: "Skrót"
          description: "Jednym ze sposobów pokazania skrótu klawiaturowego i ogłoszenia go jest formatShortcut, który zamienia używane skróty klawiszowe do pisania na narysowaną etykietę i wartość aria-keyshortcuts; DShortcut rysuje go jako układ i, biorąc pod uwagę blok, udostępnia obie formy, więc element nie może narysować jednego skrótu i ogłosić innego."
          keycaps_example: "Tworzenie skrótu"
          keycaps_description: "`<DShortcut @keys>` rysuje jeden chip na skrót. Klawisze należy pisać tak, jak w powiązaniu: `+`-joined, w dowolnym przypadku, z `mod` jako głównym modyfikatorem platformy. Modyfikatory są wymienione w kolejności zgodnej z platformą, niezależnie od pisowni, modyfikatory glifów są ze sobą połączone, a każdy kolejny klawisz zachowuje odstęp."
          keycaps_note: "Na platformach Apple modyfikatory są wyświetlane jako glify (`⌘⇧ D`); w innych miejscach są wyświetlane jako słowa (`Ctrl Shift D`). Każdy glif ma wizualnie ukrytą nazwę mówioną, więc chip odczytuje się jako „Command Shift D”, gdy jest on samodzielnym elementem."
          block_example: "Ogłaszanie elementu, który reaguje"
          block_description: "`aria-keyshortcuts` należy do elementu aktywowanego klawiszami, o którym wie tylko wywołujący. Biorąc pod uwagę blok, `DShortcut` nie renderuje żadnego własnego elementu i zwraca `aria`, `label`, `keys` oraz powiązany `Kbd`, więc ogłoszenie przycisku i symbol obok niego pochodzą z jednej pisowni. Otrzymany symbol jest ukryty przed technologiami wspomagającymi, ponieważ przycisk sam ogłasza skrót."
          block_try_this: "Ustaw przycisk w trybie czuwania, gdy uruchomiony jest czytnik ekranu: odczyta on jego nazwę raz, a następnie skrót z atrybutu, nigdy z układu."
          block_note: "Ogłoszony formularz jest zlokalizowany i wymawiany, a nie lista tokenów ARIA: czytelnicy wymawiają atrybut dosłownie, więc na komputerach Mac jest napisane `Command+B`, a w innych miejscach `Ctrl+B`, a także nazwy znaków interpunkcyjnych (`kropka`, `ukośnik`), które czytelnicy w przeciwnym razie by pominęli."
          string_form_example: "Gdzie pasuje tylko do ciągu"
          string_form_description: "`title`, `aria-label` ani opcja SELECT nie mogą zawierać elementu. Wywołaj `formatShortcut` bezpośrednio i użyj `.label` dla tekstu i `.aria` dla atrybutu; jedno wywołanie, jedna pisownia, obie formy."
          string_form_try_this: "Najedź kursorem na przycisk, aby wyświetlić podpowiedź; skup go za pomocą czytnika ekranu, aby wyświetlić ogłoszenie."
          spellings_example: "Pisownia i jej dwie formy"
          spellings_description: "Do czego odnosi się każde wejście. `mod`, `meta`, `command` i `cmd` oznaczają główny modyfikator; `ctrl` pozostaje klawiszem Control na każdej platformie; `plus` określa klawisz `+`; słowa ze strzałkami i odpowiadające im jednostki HTML rysują się jako strzałki."
          spellings_note: "W zależności od języka interfejsu zmianie ulega tylko zapowiadana kolumna; w zależności od platformy zmienia się kolumna rysowana."
          keyboard_gate_example: "Tylko tam, gdzie jest klawiatura"
          keyboard_gate_description: "Skrót to szum w telefonie. `capabilities.hasKeyboard` wnioskuje o fizycznej klawiaturze na podstawie precyzyjnego wskaźnika głównego lub naciśnięcia klawisza, którego klawiatura ekranowa nigdy nie wysyła, a `DShortcut` bez tego nie rysuje i nie ogłasza niczego. `@always` rezygnuje w przypadku powierzchni, które istnieją w celu udokumentowania klawiszy."
          keyboard_gate_try_this: "Otwórz tę stronę na telefonie: domyślny układ znika, a układ `@always` pozostaje. Sparuj klawiaturę i naciśnij klawisz modyfikujący, a domyślny układ pojawi się bez przeładowywania."
          keyboard_gate_note: "Wszystkie skróty na stronie są chronione, z wyjątkiem skrótów klawiaturowych pomocnych w oknie modalnym i na tej stronie."
