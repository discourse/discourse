          multi:
            label: "Kontrole dostępności"
            example: "Wpis wielokrotnego wyboru"
            example_description: "Wpis trafia do pierwszego wybranego wiersza, co powoduje powrót czytelnika do jego własnego wyboru, a nie na górę. To świadomie umieszcza kursor w miejscu, w którym kolejna spacja usunęłaby coś, co jest właśnie wymianą dokonywaną przez wzorzec. Strzałki zawijają się, więc przejście przez ostatni wiersz powoduje powrót do pierwszego."
            try_this: "Należy pamiętać, że kursor zaczyna się w wybranym wierszu, a nie w pierwszym, a następnie strzałka przechodzi obok ostatniego wiersza, aby powrócić na górę."
