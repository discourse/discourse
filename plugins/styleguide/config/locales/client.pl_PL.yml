            weekly: "Tygodniowo"
            monthly: "Miesięcznie"
            never: "Nigdy"
          radio:
            label: "Wyrównanie"
            example: "Grupa radiowa"
            example_description: "Grupa radiowa oznacza swój wybór jako „aria-checked” zamiast „aria-selected”, a wejście do grupy powoduje dotarcie do tego członka zamiast do pierwszego. Przesunięcie kursora powoduje przeniesienie wyboru, co jest jedynym wzorcem, w którym jest to oczekiwane."
            try_this: "Przejdź do grupy i zauważ, że wchodzi na zaznaczonego członka. Strzałka wzdłuż niego i obserwuj, jak następuje wybór. Odsuń się i wróć, aby powrócić do nowego wyboru."
            left: "Po lewej"
            center: "Środek"
            right: "Po prawej"
          tree:
            label: "Drzewo źródłowe"
            example: "Drzewo"
            example_description: "Kursor porusza się po wierszach widocznych w danej chwili, więc zwinięcie elementu nadrzędnego usuwa jego elementy podrzędne z sekwencji. Rozwijanie i zwijanie odbywa się za pomocą zdarzenia osi poprzecznej, które raportuje strzałki, po których ta grupa nie nawiguje, jako kierunek, pozostawiając znaczenie tego kierunku przykładowi."
            try_this: "Przesuwaj się w górę i w dół po wierszach, a następnie użyj strzałek w prawo i w lewo na elemencie nadrzędnym, aby go otworzyć i zamknąć. Zwiń element nadrzędny i zauważ, że jego elementy podrzędne pozostawiają kursor razem z nim."
            rtl_example: "Drzewo, od prawej do lewej"
            rtl_description: "Ten sam komponent w kierunku od prawej do lewej, z tego samego źródła. Strzałki zamieniają się miejscami z kierunkiem pisania, więc ta wskazująca na elementy potomne wiersza nadal je otwiera, a sam przykład nie wspomina o kierunku."
            rtl_try_this: "Otwórz i zamknij rodzica, a następnie porównaj z kopią powyżej: dzieci siedzą po drugiej stronie, a strzałka, która do nich dociera, została zamieniona, aby pasować."
