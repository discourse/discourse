plugins:
  styleguide_enabled:
    default: false
  styleguide_admin_only:
    default: true
    hidden: true
  styleguide_allowed_groups:
    default: "admins"
    type: group_list
    client: false
    allow_any: false
    refresh: true
    constraints:
      at_least_one: true
    area: "group_permissions"
