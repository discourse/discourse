en:
  site_settings:
    live_verbose_logging: "Log Live diagnostic information and warnings in server logs and browser consoles. Disabled by default. Logs exclude credentials, transcripts, signaling payloads, and raw error details."
    live_enabled: "Live brings integrated voice and video rooms to Discourse, with screen sharing, background blur, noise suppression, live subtitles, direct calls, room chat, and group-based permissions. Members can keep browsing while they talk, with no external app required."
    live_allowed_groups: "Groups that can access live rooms."
    live_create_room_allowed_groups: "Groups that can create new live rooms."
    live_direct_calls_allowed_groups: "Groups that can start a direct call with another user from their user card or profile. Empty disables direct calls. Callers also need to be in {{setting:live_allowed_groups}}; anyone with live room access can receive a call."
    live_max_rooms_per_user: "Maximum number of live rooms a single user can own. Temporary rooms created automatically by other features do not count."
    live_max_invites_per_day: "Maximum number of live room invite notifications a single user can send per day. Repeated invites to the same person in the same room don't notify again (and don't count) until a day has passed."
    live_ephemeral_room_ttl_minutes: "Minutes a temporary room (created automatically by another feature, such as a direct call) can sit empty before it is deleted. Rooms with people in them are never deleted."
    live_participant_ttl_seconds: "Seconds to keep active speaker presence in Redis before automatic cleanup. Client heartbeat refreshes every 10 seconds."
    live_max_room_participants: "Maximum number of people who can be in a live room at the same time. A room's own participant limit can lower this, but never raise it."
    live_auto_status_enabled: "Automatically set user status when they join a live room (e.g. '🎙️ In Watercooler'). Requires the 'enable user status' site setting."
    live_mesh_privacy_warning_enabled: "Warn users before they join a peer-to-peer live room that other participants may be able to see their IP address, with an option to not show the warning again on that device. Calls hosted on a LiveKit server never show the warning."
    live_badges_enabled: "Enable Live badges when {{setting:live_enabled}} is enabled. Grants badges for live room milestones like time spent, rooms visited, and connections made. Toggling this enables or disables every badge in the Live group at once. Requires {{setting:live_analytics_enabled}}, which records the sessions the badges are computed from."
    live_analytics_enabled: "Record who joined which live room and when, and how long people spent in a room together. Powers the admin Live statistics, the contacts and companions suggestions, and every Live badge."
    live_session_retention_days: "Days to keep live session and time-together history before it is deleted. Badges already earned are never taken away, but progress toward badges that accumulate over time (hours in Live, days in a room, people met) only counts history within this window."
    live_idle_threshold_minutes: "Minutes of inactivity before a live room participant is marked as idle. Set to 0 to disable."
    live_afk_auto_mute_threshold_minutes: "Minutes of inactivity before a live room participant is automatically muted. Set to 0 to disable."
    live_afk_disconnect_threshold_minutes: "Minutes of inactivity before a live room participant is automatically disconnected. Set to 0 to disable."
    live_video_allowed_groups: "Groups whose members can share their camera in live rooms. Leave empty to turn camera video off site-wide. Rooms can individually opt out of all media via their room settings, and stage room listeners can never publish."
    live_screen_share_allowed_groups: "Groups whose members can share their screen in live rooms. Leave empty to turn screen sharing off site-wide. Rooms can individually opt out of all media via their room settings, and stage room listeners can never publish."
    live_video_max_publishers: "Maximum number of participants who can share video or their screen at the same time in a room. On peer-to-peer rooms, higher values increase CPU and bandwidth load for everyone watching; on rooms using a LiveKit media server, they mainly increase load on that server."
    live_video_background_blur_enabled: "Allow participants to blur their camera background. Segmentation runs on the publisher's device via MediaPipe, which increases CPU/GPU load while their camera is on."
    live_subtitles_enabled: "Allow participants to turn on live subtitles for other people's speech. Transcription runs entirely on the viewer's device via an NVIDIA Parakeet speech-to-text model (less than 0.5 GB, downloaded on first use, WebGPU required); no audio leaves the browser."
    live_stt_model_base_url: "Optional base URL for a self-hosted mirror of the subtitles models. When blank, the model files are downloaded on first use from Discourse's HuggingFace repository (Discourse/Discourse-STT). A mirror must keep that repository's folder layout and file names, reachable by browsers with CORS allowed — see docs/subtitles-model-mirror.md in the plugin."
    live_max_voice_quality: "Highest microphone audio quality participants may choose in their voice settings. Standard is the browser's speech default (~32 kbps); high (~64 kbps) and maximum (~128 kbps) improve fidelity for good microphones at the cost of bandwidth."
    live_max_camera_quality: "Highest camera quality participants may choose in their video settings. Standard captures at 720p; high captures at 1080p; maximum additionally stops automatic quality reduction as viewer count grows on peer-to-peer rooms, which multiplies the sender's upload bandwidth and CPU use."
    live_max_screen_share_quality: "Highest screen share quality participants may choose in their video settings. Standard targets 15 fps at a modest bitrate; high allows 30 fps at a higher bitrate; maximum allows 60 fps at a very high bitrate ceiling, letting fast connections share high-resolution screens at full quality."
    live_chat_enabled: "Allow live rooms to be linked to a chat channel. Each chat session opens a thread in that channel; messages are real chat messages, so participants can also follow along in the chat UI."
    live_stun_servers: "STUN server URIs (stun:host:port), separated by |, used by peer-to-peer live rooms for NAT traversal. Can be left empty when {{setting:live_turn_secret_servers}} is configured — clients then discover their public address through the TURN server itself."
    live_turn_servers: "TURN server URIs (turn:host:port or turns:host:port), separated by |, used to relay call traffic when a direct connection cannot be established. Authenticated with {{setting:live_turn_username}} and {{setting:live_turn_credential}}; for servers supporting short-lived credentials, use {{setting:live_turn_secret_servers}} instead."
    live_turn_username: "Static username for the TURN servers in {{setting:live_turn_servers}}."
    live_turn_credential: "Static password for the TURN servers in {{setting:live_turn_servers}}."
    live_turn_secret: "Shared secret used to mint short-lived TURN credentials for the servers in {{setting:live_turn_secret_servers}} (TURN REST API, coturn's use-auth-secret mode). Must match the secret configured on those TURN servers."
    live_turn_secret_servers: "TURN server URIs (turn:host:port or turns:host:port), separated by |, that authenticate with short-lived per-user credentials derived from {{setting:live_turn_secret}} instead of a static username and password, so credentials cannot be reused by third parties."
    live_livekit_agent_enabled: "Allow members of {{setting:live_livekit_agent_invite_allowed_groups}} to invite a LiveKit Cloud agent to public live rooms. Creates the livekit_agent_bot account. Requires configured LiveKit Cloud credentials."
    live_livekit_agent_invite_allowed_groups: "Groups that can invite a LiveKit Cloud agent to a public live room they can join. Admins are always included. Members also need to be in {{setting:live_allowed_groups}}; room managers can kick an agent regardless of this setting."
    live_livekit_url: "WebSocket URL (wss://, or ws:// outside production) of a self-hosted LiveKit server. Together with the API key and secret, lets live rooms use it as their media server (SFU) instead of the peer-to-peer mesh. The server must be reachable at a public address."
    live_livekit_api_key: "API key of the LiveKit server."
    live_livekit_api_secret: "API secret of the LiveKit server, used to sign short-lived room access tokens."
    live_livekit_room_policy: "Which rooms use the LiveKit media server instead of the peer-to-peer mesh. Changes never affect calls already in progress — each room switches when its next call starts."
    live_livekit_room_prefix: "Namespace prefix for room names on the LiveKit server. Leave empty to use the site's database name."
    live_livekit_mesh_fallback: "When a LiveKit access token cannot be issued and the room is empty, start the call on the peer-to-peer mesh instead of failing the join. Off by default because silent degradation can hide a LiveKit outage."
    live_livekit_recording_enabled: "Allow room moderators to record calls that run on the LiveKit media server. LiveKit Cloud requires {{setting:live_livekit_recording_s3_bucket}}. Self-hosted Egress can use its own storage configuration. Recordings are not Discourse uploads.<br><br>Configure a webhook in LiveKit pointing to <code>https://YOUR-FORUM/live/livekit/webhook</code>, replacing YOUR-FORUM with this site's hostname. Use the same API key as {{setting:live_livekit_api_key}} and include <code>egress_ended</code> events so recording statuses and download notifications update when recordings finish."
    live_livekit_recording_filepath: "Filepath passed to LiveKit Egress for recordings. Supports LiveKit's template placeholders such as {room_name}, {room_id}, {time} and {utc}; the file extension is added automatically."
    live_livekit_recording_s3_bucket: "Dedicated S3 bucket for live recordings, without a path. Set the recording credentials and region before saving this setting. Use {{setting:live_livekit_recording_filepath}} for a folder prefix. Leave empty to use self-hosted Egress storage. Discourse upload storage settings are not used."
    live_livekit_recording_s3_region: "AWS region of the recording bucket, such as us-east-1. Required unless {{setting:live_livekit_recording_s3_endpoint}} is set."
    live_livekit_recording_s3_access_key_id: "S3 access key for the recording bucket. Sent to the configured LiveKit server over HTTPS when starting a recording. Use credentials with write access limited to the recording location."
    live_livekit_recording_s3_secret_access_key: "S3 secret key for the recording bucket. Sent only to the configured LiveKit server over HTTPS, never to participants."
    live_livekit_recording_s3_endpoint: "Optional HTTPS endpoint for S3-compatible recording storage, without a path or trailing slash. Leave empty for AWS S3. Custom endpoints use path-style bucket addressing."
    errors:
      live_livekit_agent_requires_cloud: "Configure a LiveKit Cloud URL, API key, and API secret before enabling the agent."
      live_livekit_agent_username_taken: "The username livekit_agent_bot is already in use. Rename that account before enabling the agent."
      live_livekit_recording_s3_requires_credentials: "Set the recording S3 access key and secret key before setting a recording bucket."
      live_livekit_recording_s3_requires_region: "Set the recording S3 region or a custom endpoint before setting a recording bucket."
      live_livekit_recording_s3_requires_wss: "Use a wss:// LiveKit URL before configuring S3 recording storage so storage credentials are sent over HTTPS."
      live_turn_secret_servers_requires_secret: "Set live_turn_secret before adding TURN servers that use short-lived credentials."
      live_livekit_policy_requires_url: "Set live_livekit_url to a valid wss:// URL before enabling a LiveKit room policy."
      live_livekit_url_invalid: "The LiveKit URL must be a ws:// or wss:// URL with a hostname and no embedded credentials."
      live_livekit_url_requires_wss: "The LiveKit URL must use wss:// in production."
      live_livekit_policy_requires_api_key: "Set live_livekit_api_key before enabling a LiveKit room policy."
      live_livekit_policy_requires_api_secret: "Set live_livekit_api_secret before enabling a LiveKit room policy."
  live:
    defaults:
      watercooler_description: "Join for casual drop-in voice chats with other community members."
    chat:
      default_thread_title: "Voice chat in %{room}"
      default_thread_opener: "In %{room} - %{message}"
    onebox:
      inline_to_room: "Live: %{room_name}"
      room_type:
        open: "Live room"
        stage: "Live stage"
    user_status:
      in_room: "In %{room_name}"
      in_private_room: "In a live room"
      afk_in_room: "AFK in %{room_name}"
      afk_in_private_room: "AFK in a live room"
    errors:
      not_enabled: "Live rooms are disabled."
      not_authorized: "You are not allowed to perform that action for this room."
      room_limit: "You reached the maximum number of rooms you can create."
      missing_payload: "Signal payload is required."
      participant_session_required: "Your call session has expired. Rejoin the room to start a new one."
      room_full: "This room is full."
      invalid_signal: "The signal payload is malformed or exceeds the allowed size."
      state_change_required: "A state change is required."
      ephemeral_room_limit: "You have too many ongoing calls. End one before starting another."
      cannot_call_user: "Sorry, you cannot call that user."
      cannot_kick_self: "You cannot kick yourself from the room."
      cannot_kick_creator: "You cannot kick the room creator."
      listeners_cannot_unmute: "Listeners cannot unmute in a Stage room."
      video_not_allowed: "You are not allowed to share your camera in this room."
      screen_share_not_allowed: "You are not allowed to share your screen in this room."
      video_publisher_limit: "The maximum number of simultaneous video streams for this room has been reached."
      chat_unavailable: "Chat is not available for this room."
      chat_requires_presence: "Join the live room to use its chat."
      flag_target_never_joined: "That user has not joined this room."
      flag_already_handled: "Thanks, we have already been notified about this user and are looking into it."
      chat_threading_disabled: "The linked chat channel no longer has threading enabled, so a chat session can't be started."
      livekit_unavailable: "The live server is unavailable. Contact your site administrator."
      agent_dispatch_forbidden: "The agent can only join an ongoing LiveKit call in a public room. Check the agent settings and make sure a human is present."
      agent_dispatch_failed: "LiveKit could not confirm the agent invitation. Check the agent's deployment and the server logs before trying again."
      agent_list_failed: "LiveKit could not list the deployed agents. Enter the agent's dispatch name instead."
      livekit_room_instance_ended: "This call has ended. Rejoin the room to start a new one."
      livekit_no_signaling: "This room's call uses a media server; peer-to-peer signaling is disabled."
      recording_unavailable: "Recording is not available for this call."
      recording_already_active: "This call is already being recorded."
      recording_not_active: "This call is not being recorded."
      recording_failed: "The recording could not be started. Contact your site administrator."
      recording_stop_failed: "The recording could not be stopped. Please try again."
    reviewable_score_types:
      notify_moderators:
        pm_title: "A live room participant requires staff attention"
        pm_body: "@%{username} in the live room [%{room_name}](%{link}) requires staff attention:\n\n%{message}"
    reviewables:
      actions:
        agree_and_keep:
          title: "Agree"
          description: "Agree with the flag."
        agree_and_suspend:
          title: "Suspend user"
          description: "Agree with the flag and suspend the user."
        agree_and_silence:
          title: "Silence user"
          description: "Agree with the flag and silence the user."
        disagree:
          title: "Disagree"
          description: "Disagree with the flag."
        ignore:
          title: "Ignore flag"
          description: "Remove the flag from the queue without taking action."
    invite_notification:
      title: "%{username} invited you to %{room_name}"
      excerpt: "Join the live room %{room_name}"
    call_notification:
      title: "%{username} is calling you"
      excerpt: "Join %{room_name} to answer"
    call:
      room_name: "📞 %{caller} + %{callee}"
    recording_ready_pm:
      title: "Your recording of %{room_name} is ready"
      body_with_link: |
        Your recording of the live room **%{room_name}** (%{duration}) is ready:

        [Download the recording](%{link})

        Anyone with this link can access the recording — share it carefully.
      body_with_path: |
        Your recording of the live room **%{room_name}** (%{duration}) has finished.

        It is stored on the recording server at:

        `%{filepath}`

        Ask your site administrator for access.
      unknown_duration: "unknown duration"
