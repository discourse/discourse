blog:
  blog_enabled:
    default: false
    client: true
    hidden: true
    upcoming_change:
      status: "conceptual"
      impact: "feature,all_members"
      allow_enabled_for:
        - "everyone"
      requires_plugin_enabled: false
      permanent_warning: false
  blog_drafts_category:
    type: category
    default: ""
    client: true
    hidden: true
  blog_custom_domains_enabled:
    default: true
    client: true
    hidden: true
  blog_max_instances:
    type: integer
    default: 10
    min: 1
    client: true
    hidden: true
  blog_contributor_groups:
    type: group_list
    default: "3"
    disallowed_groups: "0"
    refresh: true
  blog_editor_groups:
    type: group_list
    default: "3"
    disallowed_groups: "0"
    refresh: true
  blog_publisher_groups:
    type: group_list
    default: "3"
    disallowed_groups: "0"
    refresh: true
