      limit: Możesz zapisać do 30 motywów bloga. Najpierw usuń nieużywany motyw.
      stale: Ten motyw został zmieniony. Odśwież go i sprawdź najnowszy szkic, zanim przejdziesz dalej.
      active_delete: Przed usunięciem tego motywu aktywuj inny.
