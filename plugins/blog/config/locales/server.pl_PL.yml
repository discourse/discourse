pl_PL:
  site_settings:
    blog_contributor_groups: Grupy, które mogą pisać i przesyłać własne szkice blogów. Udziel tym grupom również dostępu do kategorii prywatnych wersji roboczych. Nie daje to uprawnień pracownikom forum.
    blog_editor_groups: Grupy, które mogą edytować i przesyłać dowolne widoczne dla nich szkice bloga. Udzielają również dostępu do kategorii prywatnych szkiców. Publikacja wymaga roli publikującego.
    blog_publisher_groups: Grupy, które mogą zatwierdzać, publikować, wycofywać i planować poprawki bloga, widzą je. Wydawcy mogą zatwierdzać własne prace. Mogą również udzielać dostępu do kategorii prywatnych szkiców i uprawnień do tworzenia tematów w publicznej kategorii bloga. Administratorzy zawsze zachowują dostęp.
    blog_enabled: "Blog zbudowany na Twojej społeczności. Pisz i recenzuj artykuły z zespołem redakcyjnym, publikuj je w /blog z własnym projektem i pozwól czytelnikom dyskutować o każdym artykule w powiązanym temacie. Skonfiguruj kategorie bloga i szkiców po ich włączeniu."
    blog_url: Obsługuj bloga z własnego źródła HTTPS, bez ukośnika ani ścieżki, zamiast /blog na tej stronie. Nazwa musi różnić się od nazwy hosta dyskusji. Skonfiguruj tę nazwę hosta jako alias tej strony w połączeniu z serwerem proxy i bazą danych.
    blog_category: Pojedyncza kategoria publiczna, której wyraźnie opublikowane tematy pojawiają się na blogu. Podkategorie nie są uwzględniane. Temat nigdy nie jest publikowany wyłącznie z powodu przynależności do tej kategorii.
    blog_drafts_category: Osobna, prywatna kategoria dla szkiców redakcyjnych. Ogranicz członkostwo do redaktorów. Publikowanie powoduje skopiowanie tylko zatwierdzonego artykułu do osobnej dyskusji w {{setting:blog_category}}. Tematy redakcyjne i odpowiedzi pozostają prywatne. Adresy URL do przesyłania nie są prywatne, gdy wyłączone jest bezpieczne przesyłanie.
    blog_title: Nazwa bloga wyświetlana w nawigacji, tytułach stron i kanałach.
    blog_description: Krótki opis strony głównej, kanału informacyjnego i wyszukiwarek.
    blog_about: Treść w formacie Markdown dla strony „O mnie” na blogu.
    blog_posts_per_page: Liczba artykułów wyświetlanych na każdej stronie głównej lub stronie archiwum.
