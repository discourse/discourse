      feedback_limit: Ta recenzja osiągnęła limit opinii. Skontaktuj się z redaktorem, aby uzyskać link do nowej recenzji.
    editorial:
      access_lost: Zaplanowana publikacja została wstrzymana, bo zmieniły się uprawnienia wydawcy albo kryteria kwalifikacyjne artykułu. Sprawdź uprawnienia i prywatne źródło, a potem zaplanuj publikację od nowa.
      private_source: Tematy redakcyjne muszą pozostać w kategorii „prywatne szkice”. Zamiast tego opublikuj zatwierdzoną wersję.
      stale: Ta wersja nie jest już aktualnie przesłaną lub zatwierdzoną wersją. Załaduj ją ponownie i sprawdź ponownie.
      approval_required: Zatwierdź przesłaną wersję przed jej opublikowaniem lub zaplanowaniem.
      schedule_time: Wybierz termin publikacji, który jest co najmniej o minutę do przodu i przypada w ciągu najbliższego roku.
