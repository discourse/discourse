  site_settings:
    blog_custom_themes_enabled: Zezwól witrynie na tworzenie, dostosowywanie i importowanie szablonów blogów. Gdy ta opcja jest wyłączona, blogi korzystają z wbudowanych szablonów.
    blog_max_instances: Największa liczba blogów, jaką ta strona może mieć.
    blog_custom_domains_enabled: Zezwól na serwowanie bloga z jego własnej domeny, a nie z adresu społeczności.
    blog_role_groups_enabled: Pozwól witrynie wybrać, które grupy mają role autora bloga, redaktora i wydawcy. Gdy ta opcja jest wyłączona, role te ma tylko personel.
    blog_contributor_groups: Grupy, które mogą pisać i przesyłać własne wersje robocze bloga. Grupy te widzą kategorię „prywatne szkice”. Nie daje to uprawnień pracownikom forum.
    blog_editor_groups: Grupy, które mogą edytować i przesyłać dowolne szkice bloga, które widzą. Grupy te widzą kategorię szkiców prywatnych. Publikacja wymaga roli publikującego.
    blog_publisher_groups: Grupy, które mogą zatwierdzać, publikować, wycofywać i planować poprawki bloga, widzą je. Wydawcy mogą zatwierdzać swoje własne prace. Grupy te widzą kategorię prywatnych szkiców i mogą rozpoczynać tematy w publicznej kategorii bloga. Administratorzy zawsze zachowują dostęp.
    blog_enabled: "Blog zbudowany na Twojej społeczności. Pisz i recenzuj artykuły z zespołem redakcyjnym, publikuj je w serwisie /blog z własnym projektem i pozwól czytelnikom dyskutować na temat każdego artykułu w powiązanym temacie."
    blog_drafts_category: Prywatna kategoria dla szkiców. Jest tworzona i zarządzana przez bloga, a dostęp do niej mają tylko grupy ról bloga. Adresy URL do przesyłania nie są prywatne, gdy wyłączone jest bezpieczne przesyłanie.
