      path_format: "Start the format with / and include {slug} or {id}. Only {year}, {month}, {day}, {slug} and {id} can be used, and the first segment cannot be a reserved blog address such as /tag."
      future_date:
        must be today or earlier. Use the schedule controls to release
        an article in the future.
      color: "Use exactly six hexadecimal digits, without a # prefix."
