      page_title: Draft review
      javascript_required: Enable JavaScript to read this shared draft and leave feedback.
      unavailable: This review link has expired, was revoked, or is no longer available.
      limit: This draft already has 20 active review links. Revoke one before creating another.
      feedback_limit: This review has reached its feedback limit. Contact the editor for a new review link.
    editorial:
      access_lost: Scheduled publication stopped because publisher access or article eligibility changed. Check permissions and the private source, then schedule again.
      private_source: Editorial topics must stay in their private drafts category. Publish an approved revision instead.
      stale: This revision is no longer the current submitted or approved revision. Reload and review it again.
      approval_required: Approve a submitted revision before publishing or scheduling it.
      schedule_time: Choose a publication time at least one minute ahead and within the next year.
