    errors:
      private_site:
        The blog requires a public site with secure uploads disabled.
        Draft text stays private, but uploaded files are not access-controlled without
        secure uploads.
      anonymous_uploads: "The blog requires anonymous upload downloads. Disable prevent_anons_from_downloading_files before publishing or sharing reviews."
      category: The blog category must be public. Choose a public category in the blog settings, or clear the setting to have one created when the first article is published.
      category_unavailable: The public blog category could not be created. Try again, or choose one in the blog settings.
      drafts_category_unavailable: The private drafts category could not be prepared. Try again.
      drafts_category_public: The blog drafts category is open to everyone, so editorial work is paused. Remove the “everyone” group in that category's security settings.
      blog_category_is_drafts: The drafts category is private, so it cannot hold a blog's discussions. Choose another category.
      blog_fixed: An article stays on the blog it was published on.
      blog_slug_locked: This blog has published articles, so its slug cannot change.
      blog_category_locked: This blog has published articles, so its discussion category cannot change.
