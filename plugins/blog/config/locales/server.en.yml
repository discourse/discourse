      blog_slug_reserved: That address is used by the blog itself. Choose another one.
      blog_slug_taken: An article on the main blog already starts with that address. Choose another one.
      blog_url_unavailable: Blogs cannot use their own domain on this site.
      blog_url_forum_host: A blog's own domain must differ from the community's.
