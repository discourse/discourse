en:
  dashboard:
    problem:
      blog_not_ready: "The blog cannot publish articles. %{reason} <a href='%{base_path}/admin/site_settings/category/all_results?filter=%{setting}'>Review the setting</a>"
      blog_not_ready_without_setting: "The blog cannot publish articles. %{reason}"
      blog_not_ready_for_blog: "“%{blog_name}” cannot publish articles. %{reason} <a href='%{base_path}/admin/plugins/blog/blogs/%{blog_id}/settings'>Review the blog</a>"
  site_settings:
    blog_custom_themes_enabled: Allow the site to create, customize and import blog themes. When disabled, blogs use the built-in designs.
    blog_max_instances: The most blogs this site can have.
    blog_custom_domains_enabled: Allow a blog to be served from its own domain instead of the community's address.
    blog_contributor_groups: Groups that can write and submit their own blog drafts. These groups can see the private drafts category. This does not grant forum staff privileges.
    blog_editor_groups: Groups that can edit and submit any blog draft they can see. These groups can see the private drafts category. Publication requires the publisher role.
    blog_publisher_groups: Groups that can approve, publish, withdraw, and schedule blog revisions they can see. Publishers may approve their own work. These groups can see the private drafts category and start topics in the public blog category. Administrators always retain access.
    blog_enabled: "A blog built on your community. Write and review articles with your editorial team, publish them under /blog with their own design, and let readers discuss each article in a linked topic."
    blog_drafts_category:
      The private category for editorial drafts. It is created and managed by the blog,
      and only the blog role groups can see it. Upload URLs are not private when secure uploads are disabled.
