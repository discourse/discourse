en:
  site_settings:
    blog_contributor_groups: Groups that can write and submit their own blog drafts. Also grant these groups access to the private drafts category. This does not grant forum staff privileges.
    blog_editor_groups: Groups that can edit and submit any blog draft they can see. Also grant access to the private drafts category. Publication requires the publisher role.
    blog_publisher_groups: Groups that can approve, publish, withdraw, and schedule blog revisions they can see. Publishers may approve their own work. Also grant access to the private drafts category and permission to create topics in the public blog category. Administrators always retain access.
    blog_enabled:
      Enable the blog publication and staff editorial dashboard.
      Configure both category settings and a dedicated blog URL first.
    blog_url:
      The public HTTPS origin of the blog, without a trailing slash
      or path. It must differ from the discussion hostname. Configure this hostname
      as an alias of this site at the proxy and database connection.
    blog_category:
      The single public category whose explicitly published
      topics appear on the blog. Subcategories are not included. A topic is never
      published merely by being in this category.
    blog_drafts_category:
      A separate private category for editorial drafts.
      Restrict membership to editors. Publishing copies only the approved article into a separate discussion in {{setting:blog_category}}. Editorial topics and replies stay private.
      Upload URLs are not private when secure uploads are disabled.
    blog_title:
      The blog name displayed in navigation, page titles, and
      feeds.
    blog_description:
      A short description for the homepage, feed, and search
      engines.
    blog_about: Markdown content for the blog About page.
    blog_posts_per_page:
      Number of articles shown on each homepage or archive
      page.
