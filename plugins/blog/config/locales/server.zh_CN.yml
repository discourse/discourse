zh_CN:
  site_settings:
    blog_contributor_groups: 允许群组撰写并提交自己的博客草稿。同时，授予这些群组访问私有草稿分类的权限。此操作不会授予论坛工作人员任何权限。
    blog_editor_groups: 允许群组编辑和提交他们能看到的任何博客草稿。同时授予对私有草稿类别的访问权限。发布内容需要发布者角色。
    blog_publisher_groups: 拥有审批、发布、撤回和安排博客修订权限的群组可以查看这些内容。发布者可以审批自己的作品。此外，还需授予对私有草稿类别的访问权限，以及在公共博客类别中创建主题的权限。管理员始终保留访问权限。
    blog_enabled: "一个建立在社区基础上的博客。与您的编辑团队一起撰写和审核文章，以自定义设计发布在 /blog 目录下，并允许读者在链接主题中讨论每篇文章。启用后，即可配置博客和草稿分类。"
    blog_url: 使用独立的 HTTPS 源提供博客服务，源地址不带尾部斜杠或路径，而不是使用本站的 /blog 路径。博客主机名必须与讨论区主机名不同。在代理和数据库连接中，将此主机名配置为本站的别名。
    blog_category: 博客上仅显示一个公开的分类，该分类下的主题均已明确列出。子分类不包含在内。主题不会仅仅因为属于此分类就被发布。
    blog_drafts_category: 为编辑草稿设立单独的私有类别。仅限编辑人员访问。发布时，仅将已批准的文章复制到 {{setting:blog_category}}中的单独讨论区。编辑主题和回复保持私密。禁用安全上传后，上传链接将不再私密。
    blog_title: 博客名称显示在导航栏、页面标题和订阅源中。
    blog_description: 首页、信息流和搜索引擎的简短描述。
    blog_about: 博客“关于”页面的 Markdown 内容。
    blog_posts_per_page: 每个首页或存档页面上显示的文章数量。
