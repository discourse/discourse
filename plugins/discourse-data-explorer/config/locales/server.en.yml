en:
  site_settings:
    data_explorer_enabled: "Enable data explorer"
    data_explorer_ai_queries_enabled: "Enable AI query generation in Data Explorer"
  discourse_ai:
    ai_bot:
      agents:
        ai_query_generator:
          name: "Data Explorer Query Generator"
          description: "Generates SQL queries for Data Explorer from natural language"
      tool_help:
        find_queries: "Finds existing Data Explorer queries that may be useful examples"
        run_sql: "Runs a SQL query and returns results"
        submit_query: "Submits the final generated query"
      tool_summary:
        find_queries: "Finding example queries"
        run_sql: "Running SQL query"
        submit_query: "Submitting generated query"
      tool_description:
        find_queries: "Found example queries for %{search}"
        run_sql: "Ran SQL query"
        submit_query: "Submitted generated query %{name}"
  discourse_data_explorer:
    admin_assistant:
      generating: "Generating and testing a query draft"
      create_summary: "Save this Data Explorer query?"
      not_allowed: "Only administrators can create Data Explorer queries."
      invalid_request: "The query request is empty or too long. Please provide a shorter description."
      invalid_draft: "This query draft reference is invalid, unavailable, or expired. Please generate a new draft."
      incomplete_draft: "The generated query draft is missing its name or SQL. Please generate a new draft."
      requester_not_admin: "The administrator who requested this query no longer has admin access. Please request a new draft from an admin account."
      approval_required: "Saving this query requires human approval."
      draft_used: "This query draft has already been used or is being saved. Please generate a new draft."
      generation_failed: "The query could not be generated. Please try again or refine your request."
      creation_failed: "The query could not be saved. No query was created."
      availability:
        available: "Data Explorer query creation is available. Saving requires explicit approval."
        restricted: "Data Explorer query creation is unavailable on this site."
        disabled: "Data Explorer or Discourse AI is disabled. An administrator needs to enable the required plugins before creating queries."
        generation_disabled: "AI query generation is disabled. An administrator needs to enable it before creating queries through chat."
        unconfigured: "Data Explorer's query-generation AI model is not configured or usable."
    mcp:
      query_failed: "The query could not be run: %{message}"
      query_not_found: "Query not found"
    ai:
      error_agent_not_configured: "AI agent is not configured. Please check the AI features settings."
      error_no_sql_returned: "AI did not return a valid SQL query. Please try again or write the query manually."
    errors:
      default_tag_reserved: "The default tag is reserved for system queries."
      custom_tag_reserved: "The custom tag is reserved for user-created queries."
      tag_contains_comma: "Tags cannot contain commas."
      tag_too_long: "A tag can have at most %{max} characters."
      tool_not_allowed: "You are not allowed to use this tool"
      too_many_tags: "A query can have at most %{max} tags, not counting automatic tags."
    discourse_workflows:
      sql_action:
        no_query_selected: "No query selected."
        no_sql_provided: "No SQL query provided."
  discourse_automation:
    scriptables:
      recurring_data_explorer_result_pm:
        title: Schedule a PM with Data Explorer results
        description: Get scheduled reports sent to your messages
        no_csv_allowed: "When using `attach_csv` field, `csv` must be added to the list of authorized extensions in the site settings."
      recurring_data_explorer_result_topic:
        title: Schedule a post in a topic with Data Explorer results
        description: Get scheduled reports posted to a specific topic
  data_explorer:
    admin_dashboard_label: "Data Explorer"
    report_generator:
      private_message:
        title: "Scheduled report for %{query_name}"
        body: |
          Hi %{recipient_name}, your Data Explorer report is ready.

          Query name:
          %{query_name}

          Here are the results:
          %{table}

          <a href='%{base_url}/admin/plugins/discourse-data-explorer/queries/%{query_id}'>View query in Data Explorer</a>

          Report created at %{created_at} (%{timezone})
      post:
        body: |
          ### Scheduled report for %{query_name}

          Here are the results:
          %{table}

          <a href='%{base_url}/admin/plugins/discourse-data-explorer/queries/%{query_id}'>View query in Data Explorer</a>

          Report created at %{created_at} (%{timezone})
      upload_appendix: "Appendix: [%{filename}|attachment](%{short_url})"
