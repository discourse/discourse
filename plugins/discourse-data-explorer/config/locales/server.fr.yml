  data_explorer:
    admin_dashboard_label: "Explorateur de données"
    report_generator:
      private_message:
        title: "Rapport planifié pour %{query_name}"
        body: |
          Bonjour %{recipient_name},

          Votre rapport Data Explorer est prêt.

          Nom de la requête :
          %{query_name}

          Voici les résultats :
          %{table}

          <a href='%{base_url}/admin/plugins/discourse-data-explorer/queries/%{query_id}'>Afficher la requête dans Data Explorer</a>

          Rapport créé le %{created_at} (%{timezone})
