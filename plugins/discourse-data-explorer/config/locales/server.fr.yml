        body: |
          ### Rapport planifié pour %{query_name}

          Voici les résultats :
          %{table}

          <a href='%{base_url}/admin/plugins/discourse-data-explorer/queries/%{query_id}'>Afficher la requête dans Data Explorer</a>

          Rapport créé le %{created_at} (%{timezone})
      upload_appendix: "Annexe : [%{filename}|pièce jointe](%{short_url})"
