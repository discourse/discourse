<!doctype html>
<html>
  <head>
    <title>Discourse JSON:API documentation</title>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        margin: 0;
        padding: 0;
      }
      #pickers {
        position: fixed;
        top: 12px;
        right: 16px;
        z-index: 100;
        font: 14px sans-serif;
        display: flex;
        gap: 12px;
      }
    </style>
  </head>
  <body>
    <!-- Same rendering setup as docs.discourse.org (Redoc standalone), plus the
         global docs structure (docs/api-docs-generation.md §8): the core
         document with a Stripe-style version picker over its core-timeline
         versions, and one document per plugin (own timeline — its versions live
         in its own changelog, so the version picker hides). Serve this
         directory statically to view, e.g.
         `ruby -run -e httpd plugins/discourse-data-explorer -p 8080` -->
    <div id="pickers">
      <label id="document-picker">
        Document
        <select></select>
      </label>
      <label id="version-picker">
        API version
        <select></select>
      </label>
    </div>
    <div id="redoc"></div>
    <script src="https://cdn.jsdelivr.net/npm/redoc/bundles/redoc.standalone.js"></script>
    <script>
      const documentSelect = document.querySelector("#document-picker select");
      const versionPicker = document.querySelector("#version-picker");
      const versionSelect = versionPicker.querySelector("select");
      const render = (file) => Redoc.init(file, {}, document.getElementById("redoc"));

      const renderSelection = () => {
        const plugin = documentSelect.value !== "core";
        versionPicker.hidden = plugin;
        render(
          plugin
            ? `openapi-jsonapi-plugin-${documentSelect.value}.json`
            : `openapi-jsonapi-${versionSelect.value}.json`,
        );
      };

      fetch("openapi-versions.json")
        .then((response) => response.json())
        .then(({ versions, plugins }) => {
          const coreOption = document.createElement("option");
          coreOption.value = "core";
          coreOption.textContent = "Core API";
          documentSelect.append(coreOption);
          plugins.forEach((namespace) => {
            const option = document.createElement("option");
            option.value = namespace;
            option.textContent = `${namespace} plugin`;
            documentSelect.append(option);
          });

          versions.forEach((version, index) => {
            const option = document.createElement("option");
            option.value = version;
            option.textContent = index === 0 ? `${version} (latest)` : version;
            versionSelect.append(option);
          });

          documentSelect.addEventListener("change", renderSelection);
          versionSelect.addEventListener("change", renderSelection);
          renderSelection();
        });
    </script>
  </body>
</html>
