services:
  controller:
    build:
      context: .
      dockerfile: Dockerfile.controller
    image: discourse-board-controller:local
    container_name: discourse-board-controller
    restart: unless-stopped
    init: true
    environment:
      BOARD_API: ${BOARD_API:-https://joffrey.ngrok.dev/codex-board-bot}
      BOARD_ID: "1"
      SEED_HOST_PATH: ${SEED_HOST_PATH:-/Users/joffreyjaffeux/Code/discourse}
      WORKER_IMAGE: discourse-codex-worker:local
      NGROK_API: http://host.docker.internal:4040
      BOARD_BOOTSTRAP_HOST_PATH: /Users/joffreyjaffeux/Documents/Codex/2026-10-19/ok/work/board-bootstrap
      BASE_BRANCH: capybara
      MAX_CONCURRENCY: "1"
      RUN_TIMEOUT_SECONDS: "3600"
    ports:
      - "127.0.0.1:8099:8099"
    volumes:
      - controller-state:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ${CODEX_AUTH_HOST_PATH:-/Users/joffreyjaffeux/.codex/auth.json}:/run/secrets/codex-auth.json:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8099/health', timeout=5)"]
      interval: 30s
      timeout: 6s
      retries: 3
volumes:
  controller-state:
