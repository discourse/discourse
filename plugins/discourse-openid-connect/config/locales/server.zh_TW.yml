    openid_connect_error_redirects: "若回呼的 error_reason 包含第一個參數，系統會將使用者重新導向至第二個參數中的 URL"
    openid_connect_allow_association_change: "允許使用者中斷 Discourse 帳號與 OpenID Connect 提供者的連結，並重新連結"
