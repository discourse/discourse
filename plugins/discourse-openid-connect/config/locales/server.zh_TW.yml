    openid_connect_match_by_email: "使用電子郵件地址，將 OpenID Connect 驗證與現有的 Discourse 使用者帳號配對。"
    openid_connect_use_pkce: "為 OpenID Connect 驗證啟用代碼交換證明金鑰（Proof Key for Code Exchange，PKCE）。"
