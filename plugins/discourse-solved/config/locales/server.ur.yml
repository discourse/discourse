  education:
    topic_is_solved: |
      ### یہ موضوع حل ہوگیا ہے

      صرف تب ہی یہاں جواب دیں اگر:

      - آپ کے پاس اضافی تفصیلات ہیں

      - یہ حل آپ کے لئے کام نہیں آتا

      اس کی بجائے اگر آپ کو کوئی غیر متعلقہ مسئلہ ہے تو، براہ کرم [نیا موضوع شروع کریں] (%{base_url}/new-topic).
