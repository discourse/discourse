      site_settings:
        categories:
          discourse_subscriptions: "Discourse 訂閱"
  site_settings:
    discourse_subscriptions_enabled: 啟用 Discourse 訂閱外掛。
    discourse_subscriptions_extra_nav_subscribe: 在主要導覽中顯示訂閱按鈕
    discourse_subscriptions_pricing_table_id: 在此加入定價表嵌入程式碼中的 pricing-table-id。
    discourse_subscriptions_pricing_table_enabled: 訂閱按鈕會顯示嵌入的定價表，並使用 Stripe Checkout。
    discourse_subscriptions_public_key: Stripe 可公開金鑰
    discourse_subscriptions_secret_key: Stripe 私密金鑰
    discourse_subscriptions_webhook_secret: Stripe Webhook 密鑰
    discourse_subscriptions_currency: 預設貨幣代碼。建立訂閱方案時可以覆寫。
    discourse_subscriptions_campaign_enabled: 啟用宣傳橫幅，鼓勵以財務方式支持此社群。
    discourse_subscriptions_campaign_goal: 支持活動的數值目標（訂閱者人數或募集金額）。
    discourse_subscriptions_campaign_type: 選擇要執行的活動類型（訂閱者或每月募集金額）。
    discourse_subscriptions_campaign_banner_location: 選擇活動橫幅的位置（頂端或側邊欄）。
    discourse_subscriptions_campaign_banner_shadow_color: 選擇活動橫幅陰影的顏色。
    discourse_subscriptions_campaign_banner_bg_image: 上傳自訂圖片，作為活動橫幅的背景。
    discourse_subscriptions_campaign_show_contributors: 顯示最近購買訂閱產品者的頭像。
    discourse_subscriptions_campaign_product: 支持者點選活動按鈕時要前往的 Stripe 產品 ID。若此設定留白，支持者將前往主要產品頁面。
    discourse_subscriptions_enable_automatic_tax: 啟用自動稅額計算，會自動計算訂閱所產生的所有發票稅率。
    discourse_subscriptions_enable_verbose_logging: 啟用更詳細的記錄以協助除錯。請勿在正式環境中永久啟用。
    errors:
      discourse_patrons_amount_must_be_currency: "貨幣金額必須是不含貨幣符號的數字（例如 1.50）"
