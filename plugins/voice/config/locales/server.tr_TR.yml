        [Kaydı indir](%{link})

        Bu bağlantıya sahip olan herkes kayda erişebilir; dikkatli paylaşın.
      body_with_path: |
        **%{room_name}** sesli odasının kaydı (%{duration}) tamamlandı.

        Kayıt sunucusunda şu konumda saklanıyor:

        `%{filepath}`

        Erişim için site yöneticinize başvurun.
      unknown_duration: "bilinmeyen süre"
