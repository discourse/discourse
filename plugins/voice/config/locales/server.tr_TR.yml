      room_limit: "Oluşturabileceğiniz en fazla oda sayısına ulaştınız."
      missing_payload: "Sinyal verisi gereklidir."
      cannot_call_user: "Üzgünüz, bu kullanıcıyı arayamazsınız."
      cannot_kick_self: "Kendinizi odadan çıkaramazsınız."
      cannot_kick_creator: "Odayı oluşturan kişiyi odadan çıkaramazsınız."
      listeners_cannot_unmute: "Dinleyiciler Sahne odasında mikrofonlarını açamaz."
      video_not_allowed: "Bu odada video etkin değil."
      video_publisher_limit: "Bu odada aynı anda yayınlanabilecek en yüksek video akışı sayısına ulaşıldı."
      chat_unavailable: "Bu oda için sohbet kullanılamıyor."
      chat_requires_presence: "Sohbeti kullanmak için sesli odaya katılın."
      flag_target_never_joined: "Bu kullanıcı odaya katılmadı."
      flag_already_handled: "Teşekkürler, bu kullanıcı hakkında daha önce bilgilendirildik ve durumu inceliyoruz."
      chat_threading_disabled: "Bağlı sohbet kanalında konu özelliği artık etkin değil, bu nedenle sohbet oturumu başlatılamıyor."
      livekit_unavailable: "Ses sunucusu kullanılamıyor. Site yöneticinizle iletişime geçin."
      livekit_room_instance_ended: "Bu görüşme sona erdi. Yeni bir görüşme başlatmak için odaya yeniden katılın."
      livekit_no_signaling: "Bu odadaki görüşme bir medya sunucusu kullanıyor; eşler arası sinyalleşme devre dışı."
      recording_unavailable: "Bu görüşmede kayıt kullanılamıyor."
      recording_already_active: "Bu görüşme zaten kaydediliyor."
      recording_not_active: "Bu görüşme kaydedilmiyor."
      recording_failed: "Kayıt başlatılamadı. Site yöneticinizle iletişime geçin."
      recording_stop_failed: "Kayıt durdurulamadı. Lütfen yeniden deneyin."
    reviewable_score_types:
      notify_moderators:
        pm_title: "Bir sesli oda katılımcısı yetkililerin ilgisini gerektiriyor"
        pm_body: "[%{room_name}](%{link}) sesli odasındaki @%{username} adlı kullanıcı yetkililerin ilgisini gerektiriyor:\n\n%{message}"
    reviewables:
