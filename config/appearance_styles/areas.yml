# Named parts of the forum that generated theme styles may restyle, with the
# selector each one stands for. Styles name an area and never write selectors,
# so only what is listed here can be reached.
#
# Critical UI is deliberately absent: header controls and the user menu, the
# sidebar toggle, the composer, login, modals, chat and admin links.
#
# - selector: "&" means the page body itself
# - states: the extra states a rule may target (hover, odd, even)
# - hideable: allows `display: none`, only on non-essential areas
# - sizeable: allows bounded width and height, for media
# - text_color: the color core gives the area's text, so a new background can
#   be checked against it when a rule doesn't set the text color too; "none"
#   for areas that only show images. Every area has to say.
# - icon: the area's text is icons, which need 3:1 rather than 4.5:1
# - background: the color core paints behind the area's text, so a new text
#   color can be checked against it when a rule doesn't set a background too
#   (var(--secondary), the page background, when not listed)
# - hover_background: the background on hover, when it differs
# - within: the areas this one sits inside, innermost first (every area is
#   within the page), so its text is checked against their backgrounds
# - inherits_color: core doesn't color the area's text itself, so it takes
#   the text color a rule gives an area around it

page:
  label: Page background
  selector: "&"
  text_color: "var(--primary)"
header:
  label: Header bar
  selector: ".d-header"
  text_color: "var(--header_primary)"
  background: "var(--header_background)"
logo:
  label: Site logo
  selector: ".d-header .title"
  within: [header]
  text_color: "var(--header_primary)"
  background: "var(--header_background)"
nav_pills:
  label: Navigation tabs (Latest, New, Top)
  selector: ".nav-pills"
  text_color: "var(--d-nav-color)"
  background: "var(--d-nav-bg-color)"
  hover_background: "var(--d-nav-bg-color--hover)"
welcome_banner:
  label: Welcome banner
  selector: ".welcome-banner"
  text_color: "var(--primary)"
welcome_banner_title:
  label: Welcome banner title
  selector: ".welcome-banner__title"
  inherits_color: true
  within: [welcome_banner]
  text_color: "var(--primary)"
topic_list:
  label: Topic list
  selector: ".topic-list"
  text_color: "var(--primary)"
topic_list_header:
  label: Topic list column headings
  selector: ".topic-list-header"
  within: [topic_list]
  text_color: "var(--d-topic-list-header-text-color)"
  background: "var(--d-topic-list-header-background-color)"
topic_list_item:
  label: Topic list rows
  selector: ".topic-list-item"
  inherits_color: true
  within: [topic_list]
  text_color: "var(--primary)"
  states: [hover, odd, even]
topic_list_title:
  label: Topic titles in lists
  selector: ".topic-list-item .raw-topic-link"
  within: [topic_list_item, topic_list]
  text_color: "var(--primary)"
  states: [hover]
category_box:
  label: Category boxes on the categories page
  selector: ".category-box"
  text_color: "var(--primary)"
  states: [hover, odd, even]
category_logo:
  label: Category logos
  selector: ".category-logo img"
  within: [category_box]
  text_color: none
  sizeable: true
category_title:
  label: Category headings on the categories page
  selector: ".category-title-link"
  within: [category_box]
  text_color: "var(--primary-medium)"
category_description:
  label: Category descriptions on the categories page
  selector: ".category-description"
  within: [category_box]
  text_color: "var(--primary-high)"
  hideable: true
category_badge:
  label: Category names, shown as badges in topic lists and on topics
  selector: ".badge-category__wrapper"
  within: [topic_list_item, topic_list]
  text_color: "var(--primary)"
tag:
  label: Tags
  selector: ".discourse-tag"
  within: [topic_list_item, topic_list]
  text_color: "var(--primary)"
topic_title:
  label: Topic title on the topic page
  selector: "#topic-title .fancy-title"
  text_color: "var(--primary)"
post:
  label: Posts
  selector: ".topic-post"
  inherits_color: true
  text_color: "var(--primary)"
post_body:
  label: Post text
  selector: ".cooked"
  inherits_color: true
  within: [post]
  text_color: "var(--primary)"
post_headings:
  label: Headings in posts
  selector: ".cooked h1, .cooked h2, .cooked h3"
  inherits_color: true
  within: [post_body, post]
  text_color: "var(--primary)"
post_links:
  label: Links in posts
  selector: ".cooked a"
  within: [post_body, post]
  text_color: "var(--d-link-color)"
  states: [hover]
post_quotes:
  label: Quotes in posts
  selector: ".cooked aside.quote, .cooked blockquote"
  inherits_color: true
  within: [post_body, post]
  text_color: "var(--primary)"
post_code:
  label: Code in posts
  selector: ".cooked pre, .cooked code"
  within: [post_body, post]
  text_color: "var(--primary)"
  background: "var(--primary-very-low)"
post_images:
  label: Images in posts
  selector: ".cooked img:not(.emoji)"
  within: [post_body, post]
  text_color: none
  sizeable: true
post_avatar:
  label: Post avatars
  selector: ".topic-avatar"
  within: [post]
  text_color: none
post_author:
  label: Post author names
  selector: ".topic-meta-data .names"
  within: [post]
  text_color: "var(--primary-high-or-secondary-low)"
mention:
  label: Mentions
  selector: ".mention"
  within: [post_body, post]
  text_color: "var(--primary)"
  background: "var(--primary-low)"
user_badge:
  label: User badges
  selector: ".user-badge"
  text_color: "var(--primary)"
small_actions:
  label: Notices in topics (pinned, closed, moved)
  selector: ".small-action"
  text_color: "var(--primary-medium)"
  hideable: true
primary_button:
  label: Primary buttons
  selector: ".btn-primary"
  text_color: "var(--d-button-primary-text-color)"
  states: [hover]
  background: "var(--d-button-primary-bg-color)"
  hover_background: "var(--d-button-primary-bg-color--hover)"
default_button:
  label: Default buttons
  selector: ".btn-default"
  text_color: "var(--d-button-default-text-color)"
  states: [hover]
  background: "var(--d-button-default-bg-color)"
  hover_background: "var(--d-button-default-bg-color--hover)"
create_topic_button:
  label: New Topic button
  selector: "#create-topic"
  text_color: "var(--d-button-default-text-color)"
  states: [hover]
  background: "var(--d-button-default-bg-color)"
  hover_background: "var(--d-button-default-bg-color--hover)"
signup_button:
  label: Sign up button
  selector: ".sign-up-button"
  within: [header]
  text_color: "var(--d-button-primary-text-color)"
  states: [hover]
  background: "var(--d-button-primary-bg-color)"
  hover_background: "var(--d-button-primary-bg-color--hover)"
invite_button:
  label: Invite button on topics
  selector: ".invite-topic"
  text_color: "var(--d-button-default-text-color)"
  hideable: true
  background: "var(--d-button-default-bg-color)"
  hover_background: "var(--d-button-default-bg-color--hover)"
sidebar:
  label: Sidebar
  selector: ".sidebar-wrapper"
  text_color: "var(--d-sidebar-link-color)"
  background: "var(--d-sidebar-background)"
sidebar_section_header:
  label: Sidebar section headers
  selector: ".sidebar-section-header"
  within: [sidebar]
  text_color: "var(--d-sidebar-header-color)"
  background: "var(--d-sidebar-background)"
sidebar_link:
  label: Sidebar links
  selector: ".sidebar-section-link"
  within: [sidebar]
  text_color: "var(--d-sidebar-link-color)"
  states: [hover]
  background: "var(--d-sidebar-background)"
  hover_background: "var(--d-sidebar-highlight-hover-background)"
user_card:
  label: User cards
  selector: ".user-card"
  text_color: "var(--primary)"
topic_map:
  label: Topic summary box
  selector: ".topic-map"
  text_color: "var(--primary)"
  hideable: true
suggested_topics:
  label: Suggested and related topics
  selector: ".more-topics__container"
  text_color: "var(--primary)"
  hideable: true
share_button:
  label: Share button on posts
  selector: ".post-action-menu__share"
  within: [post]
  text_color: "var(--primary-low-mid)"
  icon: true
  hideable: true
bookmark_button:
  label: Bookmark button on posts
  selector: ".post-action-menu__bookmark"
  within: [post]
  text_color: "var(--primary-low-mid)"
  icon: true
  hideable: true
powered_by:
  label: Powered by Discourse
  selector: ".powered-by-discourse"
  text_color: "var(--primary)"
  hideable: true
