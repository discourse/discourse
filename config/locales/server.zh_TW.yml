      description: 有 100 個被贊的貼文，并送出了 100 個贊
      long_description: |
        當您有 100 篇獲讚的貼文，並回饋 100 個以上的讚時會獲得此徽章。感謝您將這份鼓勵傳遞下去！
    empathetic:
      name: 善解人意
      description: 有 500 個被贊的貼文，并送出了 1000 個贊
      long_description: |
        當您有 500 篇獲讚的貼文，並回饋 1,000 個以上的讚時會獲得此徽章。太棒了！您是慷慨與彼此欣賞的典範 :two_hearts:。
    first_emoji:
      name: 第一個表情符號
      description: 在貼文中使用表情符號
      long_description: |
        第一次在貼文中加入表情符號時會獲得此徽章 :thumbsup:。表情符號能讓您在貼文中表達各種情緒，從開心 :smiley:、難過 :anguished:、生氣 :angry: 到介於其間的任何心情 :sunglasses:。只要輸入 :（冒號），或按下編輯器工具列上的表情符號按鈕，就能從數百種選項中挑選 :ok_hand:
    first_mention:
      name: 首次提及
      description: 在貼文中提及使用者
      long_description: |
        第一次在貼文中提及某人的 @username 時會獲得此徽章。每次提及都會向該使用者發出通知，讓對方知道您的貼文。只要開始輸入 @（小老鼠符號），即可提及任何使用者；若設定允許，也能提及群組。這是吸引對方注意某件事的便利方式。
    first_onebox:
      name: 首個 Onebox
      description: 發布了一個 Onebox 連結
      long_description: |
        第一次在獨立一行中發佈連結時會獲得此徽章；該連結會自動展開為包含摘要、標題，以及可用時顯示圖片的 Onebox 預覽。
    first_reply_by_email:
      name: 第一次通過電子郵件回復
      description: 通過電子郵件回復貼文
      long_description: |
        第一次透過電子郵件回覆貼文時會獲得此徽章 :e-mail:。
    new_user_of_the_month:
      name: "當月最佳新使用者"
      description: 在注冊的第一個月做出杰出貢獻
      long_description: |
        此徽章每月頒發給兩位新使用者，以表揚其整體傑出貢獻；評選依據包括貼文獲讚的頻率，以及按讚者的身分。
    enthusiast:
      name: 愛好者
      description: 連續 10 天訪問
      long_description: |
        連續造訪 10 天時會獲得此徽章。感謝您陪伴我們超過一週！
    aficionado:
      name: 百尺竿頭
      description: 連續 100 天訪問
      long_description: |
        連續造訪 100 天時會獲得此徽章。這已超過三個月！
    devotee:
      name: 全年不落
      description: 連續 365 天訪問
      long_description: |
        連續造訪 365 天時會獲得此徽章。太棒了，整整一年！
