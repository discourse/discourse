        您好，

        這是來自 %{site_name} 的自動訊息，通知您[貼文](%{base_url}%{url})已被移除。

        %{flag_reason}

        此貼文遭社群檢舉，工作人員選擇將其移除。

        ``` markdown
        %{flagged_post_raw_content}
        ```

        詳情請參閱我們的[社群準則](%{base_url}/guidelines)。
    flags_agreed_and_post_deleted_for_responders:
      title: "工作人員已從遭檢舉貼文中移除回覆"
      subject_template: "工作人員已從遭檢舉貼文中移除回覆"
      text_body_template: |
        您好，

        這是來自 %{site_name} 的自動訊息，通知您曾回覆的[貼文](%{base_url}%{url})已被移除。

        %{flag_reason}

        此貼文遭社群檢舉，工作人員選擇將其移除。

        ``` markdown
        %{flagged_post_raw_content}
        ```

        您的回覆為

        ``` markdown
        %{flagged_post_response_raw_content}
        ```

        如需進一步瞭解移除原因，請參閱我們的[社群準則](%{base_url}/guidelines)。
    usage_tips:
      text_body_template: |
        若想快速瞭解新使用者的入門技巧，請[查看這篇部落格文章](https://blog.discourse.org/2016/12/discourse-new-user-tips-and-tricks/)。

        隨著您在這裡參與活動，我們會逐漸認識您，針對新使用者的暫時限制也會解除。日後您將取得不同的[信任等級](https://blog.discourse.org/2018/06/understanding-discourse-trust-levels/)，並獲得特殊權限，協助我們共同管理社群。
    welcome_user:
      title: "歡迎使用者"
      preview: "歡迎來到 %{site_name}！"
      subject_template: "歡迎來到 %{site_name}！"
      text_body_template: |
        感謝您加入 %{site_name}，歡迎！

        %{new_user_tips}

        我們始終重視[文明的社群行為](%{base_url}/guidelines)。

        祝您使用愉快！
    welcome_tl1_user:
      title: "歡迎 TL1 使用者"
      subject_template: "感謝與我們共度時光"
      text_body_template: |
        您好！我們發現您非常積極地閱讀內容，這很棒，因此已將您提升至新的[信任等級！](https://blog.discourse.org/2018/06/understanding-discourse-trust-levels/)

        很高興您願意花時間與我們相處，我們也想更瞭解您。請花點時間[填寫個人資料](%{base_url}/my/preferences/profile)，也歡迎您[建立新主題](%{base_url}/categories)。
    welcome_staff:
      title: "歡迎加入工作人員團隊"
      subject_template: "恭喜，您已獲授予 %{role} 身分！"
      text_body_template: |
        一位工作人員已授予您 %{role} 身分。

        身為 %{role}，您現在可以存取<a href='%{base_url}/admin' target='_blank'>管理員介面</a>。

        能力越大，責任越大。若您剛開始管理社群，請參閱[管理指南](https://meta.discourse.org/t/discourse-moderation-guide/63116)。
    welcome_invite:
      title: "歡迎邀請"
      preview: "歡迎來到 %{site_name}！"
      subject_template: "歡迎來到 %{site_name}！"
      text_body_template: |
        感謝您接受 %{site_name} 的邀請，歡迎！

        - 我們已為您建立新帳號 **%{username}**。您可以前往[使用者個人資料][prefs]變更姓名或密碼。

        - 登入時，請務必**使用原始邀請中的相同電子郵件地址**，否則我們將無法確認是您本人！

        %{new_user_tips}

        我們始終重視[文明的社群行為](%{base_url}/guidelines)。

        祝您使用愉快！

        [prefs]: %{user_preferences_url}
    tl2_promotion_message:
      subject_template: "恭喜您的信任等級獲得提升！"
      text_body_template: |
        我們又將您提升了一個[信任等級](https://blog.discourse.org/2018/06/understanding-discourse-trust-levels/)！

        達到信任等級 2 表示您已閱讀並積極參與足夠多的內容，成為此社群的正式成員。

        身為經驗豐富的使用者，您可能會喜歡[這份實用提示與技巧清單](https://blog.discourse.org/2016/12/discourse-new-user-tips-and-tricks/)。

        歡迎您繼續參與——我們很高興有您在這裡。
    backup_succeeded:
      title: "備份成功"
      subject_template: "備份成功完成"
