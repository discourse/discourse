    email_reject_insufficient_trust_level:
      title: "電子郵件被拒 - 信任級別不足"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 信任級別不足"
      subject_template_improved: "%{email_prefix}：電子郵件問題——信任等級不足"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        您的帳號未達到透過此電子郵件地址發表新主題所需的信任等級。若您認為這是錯誤，請[聯絡工作人員](%{base_url}/about)。
    email_reject_user_not_found:
      title: "電子郵件被拒 - 找不到使用者"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 找不到使用者"
      subject_template_improved: "%{email_prefix}：電子郵件問題——找不到使用者"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        您的回覆是從未知的電子郵件地址寄出。請嘗試使用其他電子郵件地址寄送，或[聯絡工作人員](%{base_url}/about)。
    email_reject_screened_email:
      title: "電子郵件被拒：被屏蔽的電子郵件"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 被禁止的電子郵件"
      subject_template_improved: "%{email_prefix}：電子郵件問題——遭封鎖的電子郵件"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        您的回覆是從遭封鎖的電子郵件地址寄出。請嘗試使用其他電子郵件地址寄送，或[聯絡工作人員](%{base_url}/about)。
    email_reject_not_allowed_email:
      title: "電子郵件被拒：不允許的電子郵件"
      subject_template: "[%{email_prefix}] 電子郵件問題——遭封鎖的電子郵件"
      subject_template_improved: "%{email_prefix}：電子郵件問題——遭封鎖的電子郵件"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        您的回覆是從遭封鎖的電子郵件地址寄出。請嘗試使用其他電子郵件地址寄送，或[聯絡工作人員](%{base_url}/about)。
    email_reject_email_alias:
      title: "電子郵件遭拒：電子郵件別名"
      subject_template: "[%{email_prefix}] 電子郵件問題——無法識別的電子郵件地址"
      subject_template_improved: "%{email_prefix}：電子郵件問題——無法識別的電子郵件地址"
      text_body_template: |
        很抱歉，您寄給 %{destination} 的電子郵件（標題為 %{former_title}）未能成功。

        我們無法將您的寄件地址與此網站的帳號配對。請嘗試使用註冊時的電子郵件地址寄送，或[聯絡工作人員](%{base_url}/about)。
    email_reject_inactive_user:
      title: "電子郵件被拒：停用使用者"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 停用使用者"
      subject_template_improved: "%{email_prefix}：電子郵件問題——非作用中使用者"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        與此電子郵件地址關聯的帳號尚未啟用。請先啟用帳號，再透過電子郵件發文。
    email_reject_silenced_user:
      title: "電子郵件被拒：被禁言的使用者"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 被禁言的使用者"
      subject_template_improved: "%{email_prefix}：電子郵件問題——遭禁言使用者"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        與此電子郵件地址關聯的帳號已被禁言。
    email_reject_reply_user_not_matching:
      title: "電子郵件被拒 - 使用者不匹配"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 意外回復地址"
      subject_template_improved: "%{email_prefix}：電子郵件問題——非預期的回覆地址"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        您的回覆所使用的電子郵件地址與我們預期的不同，因此無法確定是否為同一人。請嘗試使用其他電子郵件地址寄送，或[聯絡工作人員](%{base_url}/about)。
    email_reject_empty:
      title: "電子郵件被拒：空"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 無內容"
      subject_template_improved: "%{email_prefix}：電子郵件問題——沒有內容"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        我們在您的電子郵件中找不到任何回覆內容。

        若您收到此訊息，而且確實有加入回覆，請改用較簡單的格式後再試一次。
    email_reject_parsing:
      title: "電子郵件被拒：解析"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 內容無法識別"
      subject_template_improved: "%{email_prefix}：電子郵件問題——無法識別內容"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        我們在電子郵件中找不到您的回覆。**請確認回覆位於電子郵件最上方**——我們無法處理行內回覆。
    email_reject_invalid_access:
      title: "電子郵件被拒：無效訪問"
      subject_template: "[%{email_prefix}] 電子郵件問題——無效的存取權限"
      subject_template_improved: "%{email_prefix}：電子郵件問題——存取權無效"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        您的帳號沒有在該分類中發表新主題的權限。若您認為這是錯誤，請[聯絡工作人員](%{base_url}/about)。
    email_reject_strangers_not_allowed:
      title: "電子郵件被拒：不允許陌生人"
      subject_template: "[%{email_prefix}] 電子郵件問題——無效的存取權限"
      subject_template_improved: "%{email_prefix}：電子郵件問題——存取權無效"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        您寄送電子郵件的分類只允許擁有有效帳號及已知電子郵件地址的使用者回覆。若您認為這是錯誤，請[聯絡工作人員](%{base_url}/about)。
    email_reject_invalid_post:
      title: "電子郵件被拒：無效貼文"
      subject_template: "[%{email_prefix}] 電子郵件問題——發文錯誤"
      subject_template_improved: "%{email_prefix}：電子郵件問題——發布錯誤"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        可能的原因包括：格式過於複雜、訊息過大或訊息過小。請再試一次；若問題持續發生，請改用網站發文。
    email_reject_invalid_post_specified:
      title: "電子郵件被拒：指定的貼文無效"
      subject_template: "[%{email_prefix}] 電子郵件問題——發文錯誤"
      subject_template_improved: "%{email_prefix}：電子郵件問題——發布錯誤"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        原因：

        %{post_error}

        若您能修正問題，請再試一次。
      date_invalid: "找不到貼文創建日期。電子郵件是否缺少 Date: 標頭？"
    email_reject_post_too_short:
      title: "電子郵件被拒：貼文過短"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 貼文過短"
      subject_template_improved: "%{email_prefix}：電子郵件問題——貼文太短"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        為了鼓勵更深入的對話，不允許過短的回覆。請至少回覆 %{count} 個字元。您也可以直接回覆「+1」，透過電子郵件為貼文按讚。
    email_reject_invalid_post_action:
      title: "電子郵件被拒：無效的貼文操作"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 無效的貼文操作"
      subject_template_improved: "%{email_prefix}：電子郵件問題——無效的貼文動作"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        無法識別貼文操作。請再試一次；若問題持續發生，請改用網站發文。
    email_reject_reply_key:
      title: "電子郵件被拒：回復鍵"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 未知回復鍵"
      subject_template_improved: "%{email_prefix}：電子郵件問題——未知的回覆金鑰"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        電子郵件中的回覆金鑰無效或無法識別，因此我們無法判斷此郵件回覆的內容。[聯絡工作人員](%{base_url}/about)。
    email_reject_bad_destination_address:
      title: "電子郵件被拒：回目標地址錯誤"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 未知收件人地址"
      subject_template_improved: "%{email_prefix}：電子郵件問題——未知的收件者地址"
      text_body_template: |
        很抱歉，您寄給 %{destination} 的電子郵件（標題為 %{former_title}）未能成功。

        以下是一些要檢查的事項：

          - 您是否使用多個電子郵件地址？回覆時是否使用了與原先不同的電子郵件地址？電子郵件回覆要求使用相同的電子郵件地址。

          - 您的電子郵件軟體在回覆時是否正確使用 Reply-To: 電子郵件地址？部分電子郵件軟體會錯誤地將回覆寄到 From: 地址，這樣無法運作。

          - 電子郵件中的 Message-ID 標頭是否遭修改？Message-ID 必須保持一致且不得變更。

        需要更多協助嗎？請透過 %{base_url}/about 的「聯絡我們」資訊與我們聯絡
    email_reject_old_destination:
      title: "電子郵件被拒：舊目標"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 您正嘗試回復舊通知"
      subject_template_improved: "%{email_prefix}：電子郵件問題——您正嘗試回覆舊通知"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        我們只接受在原始通知寄出後 %{number_of_days} 天內的回覆。請[前往主題](%{short_url})繼續對話。
    email_reject_topic_not_found:
      title: "電子郵件被拒 - 找不到主題"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 找不到主題"
      subject_template_improved: "%{email_prefix}：電子郵件問題——找不到主題"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        您回覆的主題已不存在，可能已被刪除。若您認為這是錯誤，請[聯絡工作人員](%{base_url}/about)。
    email_reject_topic_closed:
      title: "電子郵件被拒 - 主題已被關閉"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 主題已被關閉"
      subject_template_improved: "%{email_prefix}：電子郵件問題——主題已關閉"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        您回覆的主題目前已關閉，不再接受回覆。若您認為這是錯誤，請[聯絡工作人員](%{base_url}/about)。
    email_reject_auto_generated:
      title: "電子郵件被拒 - 自動生成"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 自動生成的回復"
      subject_template_improved: "%{email_prefix}：電子郵件問題——自動產生的回覆"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        您的電子郵件被標記為「自動產生」，表示它是由電腦自動建立，而非由真人輸入；我們無法接受此類郵件。若您認為這是錯誤，請[聯絡工作人員](%{base_url}/about)。
    email_reject_unrecognized_error:
      title: "電子郵件被拒 - 無法識別的錯誤"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 無法識別的錯誤"
      subject_template_improved: "%{email_prefix}：電子郵件問題——無法識別的錯誤"
      text_body_template: |
        很抱歉，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）未能成功處理。

        處理您的電子郵件時發生無法識別的錯誤，因此未能發佈。請再試一次，或[聯絡工作人員](%{base_url}/about)。
    email_reject_attachment:
      title: "電子郵件附件被拒"
      subject_template: "[%{email_prefix}] 電子郵件問題 - 附件被拒"
      subject_template_improved: "%{email_prefix}：電子郵件問題——附件遭拒"
      text_body_template: |
        很遺憾，您寄送至 %{destination} 的電子郵件（標題為「%{former_title}」）中有部分附件遭拒絕。

        詳細資料：
        %{rejected_errors}

        若您認為這是錯誤，請[聯絡工作人員](%{base_url}/about)。
    email_reject_reply_not_allowed:
      title: "電子郵件遭拒：不允許回覆"
      subject_template: "[%{email_prefix}] 電子郵件問題——不允許回覆"
      subject_template_improved: "%{email_prefix}：電子郵件問題——不允許回覆"
      text_body_template: |
        很抱歉，您寄給 %{destination} 的電子郵件（標題為 %{former_title}）未能成功。

        您沒有回覆該主題的權限。若您認為這是錯誤，請[聯絡工作人員](%{base_url}/about)。
    email_reject_reply_to_digest:
      title: "電子郵件遭拒：回覆摘要"
      subject_template: "[%{email_prefix}] 電子郵件問題——回覆摘要"
      subject_template_improved: "%{email_prefix}：電子郵件問題——回覆摘要"
      text_body_template: |
        很抱歉，您寄給 %{destination} 的電子郵件（標題為 %{former_title}）未能成功。

        您回覆了摘要電子郵件，系統不接受此類回覆。

        若您認為這是錯誤，請[聯絡工作人員](%{base_url}/about)。
    email_reject_too_many_recipients:
      title: "電子郵件遭拒：收件者太多"
      subject_template: "[%{email_prefix}] 電子郵件問題——收件者太多"
      subject_template_improved: "%{email_prefix}：電子郵件問題——收件者太多"
      text_body_template: |
        很抱歉，您寄給 %{destination} 的電子郵件（標題為 %{former_title}）未能成功。

        您嘗試寄給超過 %{max_recipients_count} 位收件者，因此系統自動將電子郵件標記為垃圾郵件。

        若您認為這是錯誤，請[聯絡工作人員](%{base_url}/about)。
    email_error_notification:
      title: "電子郵件錯誤通知"
      subject_template: "[%{email_prefix}] 電子郵件問題 - POP 身份驗證錯誤"
      subject_template_improved: "%{email_prefix}：電子郵件問題——POP 驗證錯誤"
      text_body_template: |
        很遺憾，從 POP 伺服器輪詢郵件時發生驗證錯誤。

        請確認您已在[網站設定](%{base_url}/admin/site_settings/category/email)中正確設定 POP 憑證。

        若 POP 電子郵件帳號提供網頁介面，您可能需要登入該網頁並在其中檢查設定。
    email_revoked:
      title: "電子郵件已撤消"
      subject_template: "您的電子郵件地址是否正確？"
      text_body_template: |
        很抱歉，我們目前無法透過電子郵件聯絡您。最近寄給您的幾封郵件全都因無法投遞而退回。

        請確認[您的電子郵件地址](%{base_url}/my/preferences/email)有效且可正常使用。您也可以將我們的電子郵件地址加入通訊錄／聯絡人清單，以提高郵件投遞成功率。
    email_bounced: |
      寄送至 %{email} 的訊息遭退回。

      ### 詳細資料

      ``` text
      %{raw}
      ```
    email_sending_failed: |
      傳送訊息至 %{email} 失敗。

      ### 詳細資料

      ``` text
      %{raw}
      ```
    ignored_users_summary:
      title: "忽略的使用者超過閾值"
      subject_template: "一個使用者被許多其他使用者忽略"
      text_body_template: |
        您好，

        這是來自 %{site_name} 的自動訊息，通知您 @%{username} 已被 %{ignores_threshold} 位使用者忽略。這可能表示社群中正在形成問題。

        您可能需要[查看此使用者最近的貼文](%{base_url}/u/%{username}/summary)，也可以查看[遭忽略與靜音使用者報告](%{base_url}/admin/reports/top_ignored_users)中的其他使用者。

        如需更多指引，請參閱我們的[社群準則](%{base_url}/guidelines)。
    too_many_spam_flags:
      title: "垃圾資訊檢舉過多"
      preview: "貼文因垃圾內容檢舉而暫時隱藏。"
      subject_template: "新帳號暫時停用"
      text_body_template: |
        您好，

        這是來自 %{site_name} 的自動訊息，通知您：由於您的貼文遭社群檢舉，已被暫時隱藏。

        作為預防措施，您的新帳號已被禁言；在工作人員審查您的帳號前，您將無法建立回覆或主題。造成不便，敬請見諒。

        如需進一步指引，請參閱我們的[社群指南](%{base_url}/guidelines)。
    too_many_tl3_flags:
      title: "TL3 檢舉過多"
      subject_template: "新帳號暫時停用"
      text_body_template: |
        您好，

        這是來自 %{site_name} 的自動訊息，通知您：由於收到大量社群檢舉，您的帳號已被暫時停用。

        作為預防措施，您的新帳號已被禁言；在工作人員審查您的帳號前，您將無法建立新回覆或主題。造成不便，敬請見諒。

        如需進一步指引，請參閱我們的[社群指南](%{base_url}/guidelines)。
    silenced_by_staff:
      title: "被管理人員禁言"
      preview: "帳號已暫時停用。"
      subject_template: "帳號被臨時暫停"
      text_body_template: |
        您好，

        這是來自 %{site_name} 的自動訊息，通知您：作為預防措施，您的帳號已被暫時停用。

        您仍可繼續瀏覽，但在[工作人員](%{base_url}/about)審查您最近的貼文前，無法回覆或建立主題。造成不便，敬請見諒。

        如需進一步指引，請參閱我們的[社群指南](%{base_url}/guidelines)。
    user_automatically_silenced:
      title: "使用者已被自動禁言"
      subject_template: "新使用者 %{username} 因社群檢舉而被禁言"
      text_body_template: |
        這是一則自動訊息。

        新使用者 [%{username}](%{user_url}) 已被自動禁言。

        請[審核檢舉](%{base_url}/review)。若 %{username} 遭到誤判禁言，請在[此使用者的管理員頁面](%{user_url})按一下解除禁言按鈕。

        可透過 `silence_new_user` 網站設定變更此門檻。
    user_automatically_silenced_with_reason:
      title: "使用者已被自動禁言"
      subject_template: "新使用者 %{username} 因社群檢舉而被禁言"
      text_body_template: |
        這是一則自動訊息。

        新使用者 [%{username}](%{user_url}) 已被自動禁言。

        原因－%{reason}

        請[審核檢舉](%{base_url}/review)。若 %{username} 遭到誤判禁言，請在[此使用者的管理員頁面](%{user_url})按一下解除禁言按鈕。

        可透過 `silence_new_user` 網站設定變更此門檻。
    spam_post_blocked:
      title: "垃圾資訊貼文被屏蔽"
      subject_template: "新使用者 %{username} 的貼文因重復連結被屏蔽"
      text_body_template: |
        這是一則自動訊息。

        新使用者 [%{username}](%{user_url}) 嘗試建立多篇包含 %{domains} 連結的貼文，但為避免垃圾內容，這些貼文已遭封鎖。該使用者仍可建立不連結至 %{domains} 的新貼文。

        請[審查該使用者](%{user_url})。

        可透過 `newuser_spam_host_threshold` 與 `allowed_spam_host_domains` 網站設定修改此行為。若 %{domains} 應獲豁免，請考慮將其加入允許清單。
    unsilenced:
      title: "已被取消禁言"
      preview: "帳號不再處于暫停狀態。"
      subject_template: "帳號不再處于暫停狀態"
      text_body_template: |
        您好，

        這是來自 %{site_name} 的自動訊息，通知您：經工作人員審查後，您的帳號已解除暫時停用狀態。

        您現在可以再次建立新回覆及主題。感謝您的耐心等候。
    pending_users_reminder:
      title: "待處理使用者提醒"
      subject_template:
        other: "有 %{count} 位使用者等待核准"
      text_body_template: |
        有新的使用者註冊正在等待核准（或拒絕），之後才能存取此論壇。

        [請審查這些申請](%{base_url}/review)。
    download_remote_images_disabled:
      title: "下載遠程圖片已被禁用"
      subject_template: "下載遠程圖片已被禁用"
      text_body_template: "由于達到了 `download_remote_images_threshold` 的磁盤空間限制，`download_remote_images_to_local` 設置被禁用。"
    new_user_of_the_month:
      title: "您是當月最佳新使用者！"
      subject_template: "您是本月新使用者！"
      text_body_template: |
        恭喜，您獲得了 **%{month_year} 月度新使用者獎**。:trophy:

        此獎項每月只頒發給兩位新使用者，並會永久顯示在[徽章頁面](%{url})上。

        您很快就成為我們社群中重要的一員。感謝您的加入，請繼續保持！
    queued_posts_reminder:
      title: "隊列貼文提醒"
      subject_template:
        other: "有 %{count} 篇貼文等待審查"
      text_body_template: |
        您好，

        新使用者的貼文已被保留以供審核，目前正等待審查。[請在此核准或拒絕](%{base_url}/review?type=ReviewableQueuedPost)。
    user_posts_deleted:
      title: "使用者貼文已刪除"
      subject_template: "%{user} 的所有貼文均已刪除"
      text_body_template:
        other: "@%{user} 的 %{count} 篇貼文已由 @%{staff_user} 刪除。"
