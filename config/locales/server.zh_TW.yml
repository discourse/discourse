        這是來自 %{site_name} 的自動訊息，通知您[貼文](%{base_url}%{url})已還原。

        此貼文曾遭社群檢舉，但工作人員選擇將其還原。

        [details="按一下展開已還原的貼文"]
        ``` markdown
        %{flagged_post_raw_content}
        ```
        [/details]
    flags_agreed_and_post_deleted:
      title: "遭檢舉的貼文已由工作人員移除"
      subject_template: "遭檢舉的貼文已由工作人員移除"
