  guidelines_topic:
    title: "常見問題解答/準則"
    guidelines_title: "準則"
    body: |
      <a name="civilized"></a>

      ## [這裡是文明的公開討論場所](#civilized)

      請像對待公園一樣對待本論壇。我們也是共享的社群資源，在這裡，可以通過持續對話分享技能、知識和興趣。

      這些不是硬性規定，而是幫助人們對我們社群做出判斷的指導方針，使這裡成為友好、文明的公共話語場所。

      <a name="improve"></a>

      ## [改善討論](#improve)

      不管多小，始終在討論中添加一些積極的內容，幫助我們讓這裡成為出色的討論場所。如果您不確定您的貼文是否能增添對話內容，請想想您要說什么，然后再試一試。

      改善討論的一種方式是發現已經發生的問題。在回復或開始自己的主題討論之前，花點時間瀏覽一下這裡的主題，您會有更好的機會遇見興趣相投的人。

      這裡討論的主題對我們很重要，我們希望您能表現出它們對您也很重要。尊重主題和討論這些主題的人，即使您并不贊同他們的觀點。

      <a name="agreeable"></a>

      ## [即使不贊同，也要心平氣和](#agreeable)

      您可能希望給出相反的意見。這很好。但要記住“對事不對人”。請避免：

      * 謾罵
      * 人身攻擊
      * 回應貼文的語氣而不是實際內容
      * 未加思索地反駁

      相反，您應該提供深思熟慮的見解來改善對話。

      <a name="participate"></a>

      ## [您的參與很重要](#participate)

      我們在這裡的對話為每位新訪客定下了基調。選擇參與使這個論壇成為有趣地方的討論，幫助我們影響這個社群的未來 &mdash; 避開那些不會使論壇向好發展的討論。

      Discourse 提供了一些工具，使社群能夠整體識別最佳（和最差）貢獻：書簽數、按讚數、檢舉數、回復數、編輯數、監看數、靜音數等。請使用這些工具來改善您自己和其他人的體驗。

      讓我們的社群變得越來越美好。

      <a name="flag-problems"></a>

      ## [如果您發現問題，請檢舉](#flag-problems)

      版主擁有特殊權限；他們對這個論壇負責。您也一樣。在您的幫助下，版主可以成為社群推動者，而不僅僅是看門人或監督者。

      當您發現不良行為時，請不要回復。回復就表示對不良行為的承認，會助長這些不良行為，消耗您的精力，浪費大家的時間。_只需檢舉即可_。如果累積了足夠多的檢舉，就會自動采取措施，或在版主的干預下采取措施。

      為了維護我們的社群，版主保留在任何時候出于任何原因移除任何內容和任何使用者帳號的權利。版主不會預覽新貼文；版主和網站營運商對社群發布的任何內容不承擔任何責任。

      <a name="be-civil"></a>

      ## [始終保持文明](#be-civil)

      沒有什么比粗魯更能破壞健康的對話了：

      * 講文明。不要發布任何理性的人會認為冒犯、辱罵或仇恨的內容。
      * 保持干凈。不要發布任何淫穢或露骨的色情內容。
      * 互相尊重。不要騷擾或指責任何人，冒充別人，或暴露他們的私人資訊。
      * 尊重我們的論壇。不要發布垃圾資訊或以其他方式破壞論壇。

      這些都不是具有精確定義的具體條款，請避免任何此類內容的出現。如果您不確定，問問自己，如果您的貼文出現在主要新聞網站的頭版，您會有什么感覺。

      這是一個公共論壇，搜尋引擎會對這些討論內容編制索引。請確保您的語言、連結和圖片不會影響家人和朋友的安全。

      <a name="keep-tidy"></a>

      ## [保持整潔](#keep-tidy)

      努力將內容放在合適的位置，以便我們可以將更多的時間花在討論而不是清理上。因此：

      * 不要在錯誤的分類中開始主題；請閱讀分類定義。
      * 不要在多個主題中重復發布相同的內容。
      * 不要發布無內容的回復。
      * 不要中途改變主題。
      * 不要在您的貼文上簽名 &mdash; 每個貼文都附有您的個人資料。

      不要發布“+1”或“同意”，而要使用“按讚”按鈕。不要從完全不同的方向討論現有主題，而要使用“作為連結主題回復”。

      <a name="stealing"></a>

      ## [僅發布自己的內容](#stealing)

      未經允許，您不得發布屬于他人的任何數位內容。您不得發布關于竊取他人知識產權（軟件、影片、音訊、圖片）或違反任何其他法律的描述、連結或方法。

      <a name="power"></a>

      ## [由您助力](#power)

      本網站由您[友好的版主團隊](%{base_path}/about)和*您*（社群）共同營運。如果您對事情的運作方式有任何其他疑問，請在%{feedback_category}中開設新主題，我們一起討論！如果您有無法通過元主題或檢舉解決的嚴重或緊急問題，請[聯系版主](%{base_path}/about)。
  tos_topic:
    title: "服務條款"
    body: "<h2 id=\"heading--change-me\"><a href=\"#heading--change-me\">更改我</a></h2>\n\n論壇管理員，下面是隱私權政策的示例起始模板，您需要自訂該模板以滿足您的網站需求。\n\n這些條款并不制約 <%{base_url}> 下的本網際網路論壇的使用，但有一天可能制約。這種情況下，要使用本論壇，您必須同意營運本論壇的公司 %{company_name} 的這些條款。\n\n本公司可能根據其他條款提供其他產品和服務。這些條款僅適用于本論壇的使用。\n\n跳轉到：\n\n- [重要條款](#heading--important-terms)\n- [您使用本論壇的權限](#heading--permission)\n- [論壇使用條件](#heading--conditions)\n- [可接受的使用](#heading--acceptable-use)\n- [內容標準](#heading--content-standards)\n- [執法](#heading--enforcement)\n- [您的帳號](#heading--your-account)\n- [您的內容](#heading--your-content)\n- [您的責任](#heading--responsibility)\n- [免責聲明](#heading--disclaimers)\n- [責任限制](#heading--liability)\n- [反饋](#heading--feedback)\n- [終止](#heading--termination)\n- [爭議](#heading--disputes)\n- [一般條款](#heading--general)\n- [聯系方式](#heading--contact)\n- [變更](#heading--changes)\n\n<h2 id=\"heading--important-terms\"><a href=\"#heading--important-terms\">重要條款</a></h2>\n\n***這些條款包括許多影響您的權利和責任的重要條款，如[免責聲明](#heading--disclaimers)中的免責聲明、[責任限制](#heading--liability)中本公司對您的責任限制、您同意依據[使用的責任](#heading--responsibility)賠償本公司因您濫用本論壇而造成的損失并同意依據[爭議](#heading--disputes)解決爭議。***\n\n<h2 id=\"heading--permission\"><a href=\"#heading--permission\">您使用本論壇的權限</a></h2>\n\n本公司依據這些條款向您授予使用本論壇的權限。每個人都需要同意這些條款才能使用本論壇。\n\n<h2 id=\"heading--conditions\"><a href=\"#heading--conditions\">論壇使用條件</a></h2>\n\n您使用本論壇的權限受以下條件限制：\n\n1. 您必須年滿十八周歲。\n\n2. 如果本公司直接聯系您，表示您無法再使用本論壇，您將無法再使用本論壇。\n\n3. 您必須按照[可接受的使用](#heading--acceptable-use)和[內容標準](#heading--content-standards)使用本論壇。\n\n<h2 id=\"heading--acceptable-use\"><a href=\"#heading--acceptable-use\">可接受的使用</a></h2>\n\n1. 在使用本論壇時不得違反法律。\n\n2. 未經他人特別許可，不得在本論壇上使用或試圖使用他人的帳號。\n\n3. 不得在本論壇上購買、出售或以其他方式交易使用者名或其他唯一標識符。\n\n4. 不得通過本論壇發送廣告、連鎖信或其他征求，也不得使用本論壇收集地址或其他個人資料，將其用于商業郵寄名單或資料庫。\n\n5. 不得自動訪問本論壇，或監控本論壇，如通過網路爬蟲、瀏覽器外掛程式或附加元件，或其他非 Web 瀏覽器的電腦程式。如果您運行公開的搜尋引擎，您可以爬取本論壇來為搜尋引擎建立索引。\n\n6. 不得使用本論壇向分發名單、新聞組或群組郵件別名發送電子郵件。\n\n7. 不得虛假地暗示您隸屬于本公司或得到本公司的認可。\n\n8. 不得在其他網頁上對本論壇上的圖片或其他非超文本內容建立超連結。\n\n9. 不得從在本論壇上下載的材料中刪除任何顯示專有所有權的標記。\n\n10. 不得在其他網站上使用 `<iframe>` 顯示本論壇的任何部分。\n\n11. 不得禁用、避免或規避本論壇的任何安全或訪問限制。\n\n12. 不得通過不合理的請求量，或旨在對本論壇底層的資訊系統施加不合理負載的請求，對本論壇的基礎架構造成壓力。\n\n13. 不得通過本論壇冒充他人。\n\n14. 不得鼓勵或幫助任何人違反這些條款。\n\n<h2 id=\"heading--content-standards\"><a href=\"#heading--content-standards\">內容標準</a></h2>\n\n1. 不得向本論壇提交非法、冒犯性或傷害他人的內容。這包括存在騷擾、不當、辱罵或仇恨行為的內容。\n\n2. 不得向本論壇提交違反法律、侵犯任何人的知識產權、侵犯任何人隱私或違反您與他人簽訂的協議的內容。\n\n3. 不得向本論壇提交包含惡意電腦代碼（如電腦病毒或間諜軟件）的內容。\n\n4. 不得以占位符形式向本論壇提交內容來保留特定地址、使用者名或其他唯一標識符。\n\n5. 不得使用本論壇披露您無權披露的資訊，如他人的機密或個人資訊。\n\n<h2 id=\"heading--enforcement\"><a href=\"#heading--enforcement\">執法</a></h2>\n\n本公司可以在最大的法律范圍內調查和起訴違反這些條款的行為。本公司可以通知執法部門并與之合作起訴違反法律和這些條款的行為。\n\n本公司保留出于任何理由更改、編輯和刪除本論壇內容的權利。如果您認為有人在向本論壇提交內容時違反了這些條款，請[立即聯系我們](#heading--contact)。 \n\n<h2 id=\"heading--your-account\"><a href=\"#heading--your-account\">您的帳號</a></h2>\n\n您必須創建并登錄帳號才能使用本論壇的某些功能。\n\n要創建帳號，您必須提供有關自己的一些資訊。如果您創建帳號，您同意至少提供有效的電子郵件地址，并使該地址保持最新狀態。您可以隨時通過向 <%{contact_email}> 發送電子郵件關閉您的帳號。\n\n您同意對使用您的帳號執行的所有操作負責，無論該操作是否經過您的授權，直到您關閉您的帳號或通知本公司您的帳號被盜用。如果您懷疑您的帳號被盜用，您同意立即通知本公司。您同意為您的帳號選擇安全的密碼并對其保密。\n\n根據其處理版權相關移除請求的政策，或者如果本公司合理地認為您違反了這些條款中的任何規則，本公司可能會限制、暫停或關閉您在本論壇上的帳號。\n\n<h2 id=\"heading--your-content\"><a href=\"#heading--your-content\">您的內容</a></h2>\n\n這些條款中的任何內容都不賦予本公司對您在本論壇分享的知識產權的任何所有權，例如您的帳號資訊、貼文或您提交給本論壇的其他內容。這些條款中的任何內容也不賦予您對本公司知識產權的任何所有權。\n\n在您與本公司之間，您仍然對您提交到本論壇的內容全權負責。您同意不會錯誤地暗示您提交到本論壇的內容由本公司倡議或已獲得本公司批準。這些條款并不要求本公司根據這些條款儲存、維護或提供您提交的內容的副本，也不要求本公司對其進行更改。\n\n您提交到本論壇的內容屬于您，您可以決定為他人賦予何種權限。但您至少應允許本公司向本論壇其他使用者提供您提交到本論壇的內容。該特殊許可允許公司復制、發布和分析您提交到本論壇的內容。 \n\n當您提交的內容從本論壇中刪除時，無論是由您還是由本公司刪除，當最后一份副本從公司的備份、快取和其他系統中消失時，本公司的特殊許可即告終止。您對提交的內容申請的其他許可，如[創用 CC](https://creativecommons.org)許可，可以在您的內容刪除后繼續。這些許可可能授予他人或本公司再次通過本論壇分享您的內容的權利。 \n\n接收您提交到本論壇的內容的其他人可能會違反您的內容許可條款。您同意本公司不為這些違規行為或其后果對您負責。\n\n<h2 id=\"heading--responsibility\"><a href=\"#heading--responsibility\">您的責任</a></h2>\n\n您同意賠償本公司因您違反這些條款，或因其他人使用您在本論壇上的帳號違反這些條款而被他人提起的法律索賠。您和本公司都同意盡快就您可能需要賠償本公司的任何法律索賠通知對方。如果本公司未能及時通知您某項法律索賠，您不必就您本可以通過及時通知進行辯護或減輕的損失對本公司進行賠償。您同意允許本公司控制對您必須賠償本公司的法律索賠進行的調查、辯護和解決，并配合這些努力。本公司同意，未經您事先同意，不會同意任何替您認錯或給您強加義務的和解。 \n\n<h2 id=\"heading--disclaimers\"><a href=\"#heading--disclaimers\">免責聲明</a></h2>\n\n***您接受使用本論壇和本論壇內容的所有風險。在法律允許的范圍內，本公司及其供應商按原樣提供本論壇，不提供任何保證。***\n\n本論壇可以超連結到和集成其他人營運的本論壇和服務。本公司不對他人營運的服務或可能提供的內容做出任何保證。使用他人營運的服務可能受您與營運該服務的一方之間的其他條款制約。 \n\n<h2 id=\"heading--liability\"><a href=\"#heading--liability\">責任限制</a></h2>\n\n***當您同意這些條款時，本公司及其供應商均不為其人員無法合理預見的違約損害對您承擔責任。***\n\n***在法律允許的范圍內，對于與本論壇或本論壇內容有關的任何類型的索賠，對您的全部責任將限制在 50 美元。***\n\n<h2 id=\"heading--feedback\"><a href=\"#heading--feedback\">反饋</a></h2>\n\n本公司歡迎您對本論壇提供反饋和建議。請參閱以下[聯系方式](#heading--contact)部分，了解與我們聯系的方式。\n\n您同意本公司可以自由地根據您提供的反饋和建議采取行動，并且本公司不必通知您相關反饋已被使用，也不必獲得您的使用許可或向您付款。您同意不提交您認為可能屬于您自己或他人機密或專有資訊的反饋或建議。\n\n<h2 id=\"heading--termination\"><a href=\"#heading--termination\">終止</a></h2>\n\n您或本公司可以隨時終止這些條款中所述的協議。當我們的協議終止時，您使用本論壇的權限即告終止。\n\n以下條款在我們的協議終止后仍然有效：[您的內容](#heading--your-content)、[反饋](#heading--feedback)、[您的責任](#heading--responsibility)、[免責聲明](#heading--disclaimers)、[責任限制](#heading--liability)和[一般條款](#heading--general)。\n\n<h2 id=\"heading--disputes\"><a href=\"#heading--disputes\">爭議</a></h2>\n\n%{governing_law} 將管控與這些條款或您對本論壇的使用有關的任何爭議。\n\n您和本公司同意僅在%{city_for_disputes}的州或聯邦法院尋求與這些條款相關的禁令。您和本公司均不反對這些法院的管轄權、訴訟地或審判地。\n\n***您和本公司將通過具有約束力的美國仲裁協會仲裁解決任何爭議，而不是根據《電腦欺詐和濫用法案》尋求禁令或索賠。仲裁將遵循美國仲裁協會的 Commercial Arbitration Rules（商業仲裁規則）和 Supplementary Procedures for Consumer Related Disputes（消費者相關爭議補充程式）。仲裁將在%{city_for_disputes}進行。無論您是作為原告還是集體成員，您都將以個人身份解決任何爭議，而不是作為集體訴訟或其他代表人訴訟的一部分。未經本公司許可，任何仲裁員不得將任何爭議與任何其他仲裁合并。***\n\n任何仲裁裁決都將包括仲裁費用、合理的律師費和證人的合理費用。您和本公司可以在任何有管轄權的法院進行仲裁裁決。\n\n<h2 id=\"heading--general\"><a href=\"#heading--general\">一般條款</a></h2>\n\n如果這些條款中的某項規定無法按書面規定執行，但可以通過修改使其可以執行，則應在必要的最低范圍內修改該規定，使其可以執行。否則，應刪除該規定。\n\n您不得轉讓您與本公司簽訂的協議。本公司可以將您的協議轉讓給本公司的任何附屬公司、獲得本公司控制權的任何其他公司或購買與本論壇相關的公司資產的任何其他公司。任何試圖違反這些條款進行的轉讓均不具有法律效力。\n\n行使本協議項下的任何權利和對任何違反本協議的行為不予追究均不表示對違反本協議的任何其他行為不予追究。\n\n這些條款包含了您與本公司之間就您對本論壇使用達成的所有協議條款。這些條款完全取代關于您的本論壇使用的任何其他協議，無論是否為書面協議。\n\n<h2 id=\"heading--contact\"><a href=\"#heading--contact\">聯系方式</a></h2>\n\n您可以通過以下方式根據這些條款通知本公司，以及將問題發送給本公司：<%{contact_email}>。 \n\n本公司可能會根據這些條款，使用您在本論壇上為您的帳號提供的電子郵件地址，或通過在本論壇首頁或您的帳號頁面上發布消息來通知您。\n\n<h2 id=\"heading--changes\"><a href=\"#heading--changes\">變更</a></h2>\n\n本公司上次更新這些條款的日期為 [在此處插入上次更新日期]，并可能再次更新這些條款。本公司將在本論壇上發布所有更新。對于包含重大變更的更新，如果您創建了帳號并提供了有效的電子郵件地址，本公司同意向您發送電子郵件。本公司還可能在本論壇上通過特殊消息或提醒來宣布更新。 \n\n當您注意到這些條款的更新后，您必須同意這些新條款才能繼續使用本論壇。\n"
  privacy_topic:
    title: "隱私權政策"
    body: "## [論壇管理員，下面是一個您應該為您的網站定制的隱私權政策的示例起始模板。]\n\n<a name=\"collect\"></a>\n\n## [我們收集哪些資訊？](#collect)\n\n當您在我們的網站上注冊時，我們會收集您的資訊，當您通過閱讀、撰寫和評價本論壇上分享的內容參與本論壇時，我們會收集您的資料。\n\n在我們的網站上注冊時，您可能會被要求輸入您的姓名和電子郵件地址。不過，您可以在不注冊的情況下訪問我們的網站。您的電子郵件地址將通過包含唯一連結的電子郵件進行驗證。如果訪問了該連結，我們便知道您對該電子郵件地址有控制權。 \n\n在注冊和發帖時，我們會記錄貼文所來自的 IP 地址。我們還可能保留服務器日志，其中包含向我們的服務器發送的每個請求的 IP 地址。 \n\n<a name=\"use\"></a>\n\n## [我們使用您的資訊做什么](#use)\n\n我們從您處收集的任何資訊都可能通過下列一種方式使用：\n\n* 個性化設置您的體驗 &mdash; 您的資訊可以幫助我們更好地滿足您的個人需求。\n* 改進我們的網站 &mdash; 我們根據您提供給我們的資訊和反饋，不斷努力改進我們的網站。 \n* 改進客戶服務 &mdash; 您的資訊可以幫助我們更高效地回應您的客戶服務請求和支持需求。\n* 定期發送電子郵件 &mdash; 您提供的電子郵件地址可能被用于向您發送資訊、您請求的關于主題變更的通知、回應您的使用者名、回復查詢和/或其他請求或問題。\n\n<a name=\"protect\"></a>\n\n## [我們如何保護您的資訊？](#protect)\n\n我們采取各種安全措施，確保在您輸入、提交或訪問您的個人資訊時您個人資訊的安全。\n\n<a name=\"data-retention\"></a>\n\n## [資料保留策略是什么？](#data-retention)\n\n我們會盡最大努力：\n\n* 將服務器日志保留不超過 [天數] 天。\n\n<a name=\"cookies\"></a>\n\n## [我們使用 Cookie 嗎？](#cookies)\n\n是的。Cookie 是在您允許的情況下，網站或其服務提供者通過您的 Web 瀏覽器傳輸到您電腦硬碟上的小文件。這些 Cookie 使網站能夠識別您的瀏覽器，并且如果您有注冊帳號，將其與您的注冊帳號相關聯。\n\n我們使用 Cookie 來了解和保存您的偏好以便將來訪問，并收集關于網站流量和網站互動的匯總資料，以便將來可以提供更好的網站體驗和工具。我們可能與第三方服務提供者簽訂合同，以幫助我們更好地了解我們的網站訪客。這些服務提供者不允許使用代表我們收集的資訊，除非為了幫助我們開展和改進業務。\n\n<a name=\"disclose\"></a>\n\n## [我們是否向外界披露任何資訊？](#disclose)\n\n我們不向外界出售、交易或以其他方式轉讓您的個人識別資訊。這不包括協助我們營運網站、經營業務或為您提供服務的可信第三方，前提是這些第三方同意對這些資訊保密。當我們認為為了遵守法律、執行我們的網站政策或保護我們或他人的權利、財產或安全而適合發布時，我們也可能發布您的資訊。不過，無法識別個人身份的訪客資訊可能被提供給其他方，用于行銷、廣告或其他用途。\n\n<a name=\"third-party\"></a>\n\n## [第三方連結](#third-party)\n\n有時，我們可能自行決定在我們的網站上包含或提供第三方產品或服務。這些第三方網站具有單獨和獨立的隱私權政策。因此，我們對這些連結網站的內容和活動不承擔責任和義務。盡管如此，我們仍努力保護我們網站的完整性并歡迎對這些網站提供任何反饋。\n\n<a name=\"coppa\"></a>\n\n## [美國《兒童在線隱私保護法》合規性](#coppa)\n\n我們的網站、產品和服務全部面向 18 歲或以上人群。如果此服務器在美國，而且您未滿 18 歲，根據 COPPA（[兒童在線隱私保護法](https://en.wikipedia.org/wiki/Children%27s_Online_Privacy_Protection_Act)），請勿使用本網站。\n\n<a name=\"online\"></a>\n\n## [僅在線隱私權政策](#online)\n\n本在線隱私權政策僅適用于通過我們的網站收集的資訊，不適用于離線收集的資訊。\n\n<a name=\"consent\"></a>\n\n## [您的同意](#consent)\n\n使用本網站，即表示您同意我們網站的隱私權政策。\n\n<a name=\"changes\"></a>\n\n## [我們隱私權政策的變更](#changes)\n\n如果我們決定更改我們的隱私權政策，我們將在此頁面上發布這些變更。 \n\n本文檔為 CC-BY-SA。它的最后更新日期為 [在此處插入最后更新日期]。\n"
