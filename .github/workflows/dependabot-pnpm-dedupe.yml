name: Pnpm dedupe on Dependabot PRs

on:
  push:
    branches:
      - "dependabot/npm_and_yarn/**/*"
    paths:
      - "pnpm-lock.yaml"

permissions:
  contents: write

jobs:
  deduplicate:
    name: Deduplicate
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
          token: ${{ secrets.GH_PUSH_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: pnpm install
        run: pnpm install --ignore-scripts --frozen-lockfile

      - run: pnpm dedupe --ignore-scripts

      - name: Git push
        run: |
          git config --global user.email "team@discourse.org"
          git config --global user.name "discoursebot"

          # The Font Awesome sprite sync may push to this branch at the same time, so retry on a rejected push
          for _ in 1 2 3; do
            git add pnpm-lock.yaml
            git diff --cached --quiet && exit 0
            git commit -m "pnpm dedupe [dependabot skip]"
            git push origin "HEAD:$GITHUB_REF_NAME" && exit 0
            git fetch --depth=1 origin "$GITHUB_REF_NAME"
            git reset --hard FETCH_HEAD
            pnpm dedupe --ignore-scripts
          done
          exit 1
