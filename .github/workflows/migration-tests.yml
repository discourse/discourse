name: Migration Tests

on:
  workflow_call:
    inputs:
      collect_mapping:
        type: boolean
        default: false
  pull_request:
    paths:
      - ".github/workflows/migration-tests.yml"
      - "migrations/**"
      - "script/ci/**"
      - ".github/workflows/test-plan.yml"
  push:
    branches:
      - main
      - stable
    paths:
      - ".github/workflows/migration-tests.yml"
      - "migrations/**"
      - "script/ci/**"
      - ".github/workflows/test-plan.yml"

concurrency:
  group: migration-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  selection:
    if: github.event_name == 'pull_request' || github.repository != 'discourse/discourse-private-mirror'
    uses: ./.github/workflows/test-plan.yml
    with:
      workflow: migration-tests
    permissions:
      contents: read
      actions: read

  tests:
    needs: selection
    if: github.event_name == 'pull_request' || github.repository != 'discourse/discourse-private-mirror'
    name: Tests
    runs-on: ${{ (github.repository_owner == 'discourse' && 'cdck-linux-8-core') || 'ubuntu-latest' }}
    container: discourse/discourse_test:release
    timeout-minutes: ${{ inputs.collect_mapping && 360 || needs.selection.outputs.mode == 'audit' && 50 || 25 }}

    defaults:
      run:
        shell: bash

    env:
      TEST_MAPPING_COLLECT: ${{ inputs.collect_mapping && '1' || '0' }}
      RAILS_ENV: test
      PGUSER: discourse
      PGPASSWORD: discourse
      LOAD_PLUGINS: 1

    steps:
      - name: Set working directory owner
        run: chown root:root .

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: actions/download-artifact@v7
        with:
          name: test-plan-migration-tests
          path: tmp/test-plan

      - name: Setup Git
        run: |
          git config --global user.email "ci@ci.invalid"
          git config --global user.name "Discourse CI"

      - name: Start redis
        run: redis-server /etc/redis/redis.conf --daemonize yes --logfile ""

      - name: Start Postgres
        run: |
          chown -R postgres /var/run/postgresql
          sudo -E -u postgres script/start_test_db.rb
          sudo -u postgres psql -c "CREATE ROLE $PGUSER LOGIN SUPERUSER PASSWORD '$PGPASSWORD';"

      - name: Symlink vendor/bundle from image
        run: |
          ln -s /var/www/discourse/vendor/bundle vendor/bundle

      - parallel:
          - name: Setup gems
            run: |
              bundle config set --local path vendor/bundle
              bundle config set --local deployment true
              bundle config set --local without development
              bundle config set --local with migrations
              bundle install --jobs $(($(nproc) - 1))
              bundle clean

          # The markdown engine specs build the parser bundle, which needs the
          # checkout's frontend dependencies (vendored libraries, the
          # pretty-text-processor build) - node, not Rails.
          - name: pnpm install
            run: pnpm install --frozen-lockfile

      - parallel:
          - name: RSpec (no Rails)
            # The wrapper resolves the suites through the app's Gemfile, so the
            # root lockfile governs the versions here, locally, and at runtime.
            # Nothing boots Rails here; specs that need it are tagged `:rails`
            # and run after the database is up.
            run: |
              for gem in core tooling converters importer; do
                ruby script/ci/test_job.rb tmp/test-plan/plan.json tmp/test-plan/catalog.json "migrations-$gem-plain" "tmp/test-results/migrations-$gem-plain"
              done

          - name: Create and migrate database
            run: |
              bin/rake db:create
              script/silence_successful_output bin/rake db:migrate

      - name: Run all schema and converter checks (disco check)
        run: |
          # Runs every check in dependency order: pending migrations, schema
          # config validity, config ↔ database drift, committed generated files
          # vs regeneration (in a temp directory), and converter coverage.
          # Prints the actionable differences and fix commands on failure.
          migrations/bin/disco check

      - name: RSpec (Rails integration)
        env:
          MIGRATIONS_RAILS: "1"
        run: |
          for gem in core tooling converters importer; do
            LD_PRELOAD="$RUBY_ALLOCATOR" ruby script/ci/test_job.rb tmp/test-plan/plan.json tmp/test-plan/catalog.json "migrations-$gem-rails" "tmp/test-results/migrations-$gem-rails"
          done

      - name: Publish file selection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: migration-test-selection
          path: |
            tmp/test-results
            !tmp/test-results/**/raw/**
          retention-days: 14
          if-no-files-found: error

      - name: Publish latest main mapping
        if: inputs.collect_mapping && github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v7
        with:
          name: test-mapping-main-migration-tests
          path: tmp/test-mappings/*.json
          retention-days: 14
          if-no-files-found: error
